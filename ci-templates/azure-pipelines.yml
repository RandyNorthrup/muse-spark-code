# Muse Spark Code (Unofficial): Azure Pipelines template (PLAN.md M80/D65, lane CM80CI-R2).
# Not endorsed by Meta. Guide: docs/ci-other-systems.md.
#
# One job runs the GitHub Action's own launcher, shipped in the
# muse-spark-code-acp package (ci/lib/ci-run.mjs): the run step downloads the
# pinned package, checks its SHA-256 with sha256sum before anything of it
# runs, unpacks it outside the workspace and execs the launcher, which
# installs the same tarball with lifecycle scripts off, checks its identity,
# reviews (or proposes a fix for) the change and writes muse-spark-out/.
# It never comments and never pushes.
#
# Secret: MUSE_MODEL_API_KEY as a secret pipeline variable (the padlock) or a
# secret in a linked variable group. Azure maps a secret into no step unless
# the step names it, so only the run step's env below has it. Keep the
# pipeline's "Make secrets available to builds of forks" OFF (its default):
# fork pull request builds then get no secret at all. The job condition
# below also keeps fork pull requests, and every pull request unless
# MUSE_INPUT_TRUST_PULL_REQUESTS is true, from starting the job. Azure
# compares strings without case, so True and true are the same here and in
# the launcher. The bootstrap unsets every key name and alias first, copies
# the value into a private key file (never an exported variable), and the
# launcher reads the key from its stdin alone.
#
# Pin MUSE_AGENT_VERSION to a release that carries ci/ (the first release
# after 0.17.0) and MUSE_INPUT_AGENT_PACKAGE_SHA256 to that tarball's SHA-256.

variables:
  MUSE_AGENT_VERSION: '' # Exact release, x.y.z.
  MUSE_INPUT_AGENT_PACKAGE_SHA256: '' # SHA-256 of that release's tarball, 64 lowercase hex digits.
  MUSE_INPUT_MODE: 'review' # review (plan mode, no edits) or fix (a patch is proposed).
  MUSE_INPUT_MAX_BUDGET_USD: '2.00' # Hard USD cap: more than 0, at most 20, up to six decimals.
  MUSE_INPUT_MAX_REQUESTS: '30' # Billable HTTP attempts, retries included (1-500).
  MUSE_INPUT_TIMEOUT_MINUTES: '20' # The run's deadline (1-360); the job timeout must cover it.
  MUSE_INPUT_MODEL: '' # Model API model id; empty uses the agent's default.
  MUSE_INPUT_EFFORT: '' # Reasoning effort; empty uses the model's default.
  MUSE_INPUT_ALLOW_CONTRIBUTOR_MODELS: 'false' # true allows a contributor model (training-eligible).
  MUSE_INPUT_IMAGE_GENERATION: 'false' # true allows paid images in fix mode, within the budget.
  MUSE_INPUT_MAX_DIFF_BYTES: '262144' # The diff given to the model is cut to this (1-1048576).
  MUSE_INPUT_EXTRA_INSTRUCTIONS: '' # Trusted instructions from the pipeline author.
  MUSE_INPUT_TRUST_PULL_REQUESTS: 'false' # true reviews pull requests from this repository.
  MUSE_INPUT_HTTPS_PROXY: ''
  MUSE_INPUT_NO_PROXY: ''
  MUSE_INPUT_EXTRA_CA_CERTS: '' # A CA file outside the checkout.
  MUSE_CI_JOB_TIMEOUT_MINUTES: '35' # Equal to timeoutInMinutes; the launcher refuses a run it cannot cover.

jobs:
  - job: muse_spark
    displayName: Muse Spark
    pool:
      vmImage: ubuntu-latest
    timeoutInMinutes: 35
    condition: and(succeeded(), or(ne(variables['Build.Reason'], 'PullRequest'), and(eq(variables['MUSE_INPUT_TRUST_PULL_REQUESTS'], 'true'), eq(variables['System.PullRequest.IsFork'], 'False'))))
    steps:
      - checkout: self
        fetchDepth: 0 # The base commit must be in the clone.
        persistCredentials: false
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: '22.x'
      - bash: |
          # BEGIN MUSE BOOTSTRAP (generated from ci-templates/bootstrap.sh - do not edit)
          # Muse Spark Code (Unofficial): the one POSIX bootstrap for the other-CI
          # templates (PLAN.md M80/D65). This file is the source of truth:
          # scripts/sync-ci-bootstrap.mjs copies it into gitlab-ci.yml,
          # azure-pipelines.yml, Jenkinsfile and bitbucket-pipelines.yml (stamping in
          # the template's system name), and the template tests refuse any drift.
          # POSIX sh only.
          #
          # Key handling: the two holders below are unset before they are assigned,
          # so an exported holder arriving from the environment cannot keep its
          # export attribute; every secret name is unset before any child runs;
          # the key lands in a private file, never an exported variable, and the
          # launcher reads it from its stdin alone.
          set +x
          set -eu
          umask 077
          unset muse_key muse_key_file
          muse_key="${MUSE_MODEL_API_KEY:-}"
          muse_key_file="${MUSE_MODEL_API_KEY_FILE:-}"
          unset MUSE_MODEL_API_KEY MUSE_MODEL_API_KEY_FILE MUSE_SPARK_MODEL_API_KEY META_API_KEY
          muse_start_ms=$(($(date +%s) * 1000))
          if [ -z "${MUSE_AGENT_VERSION:-}" ] || [ -z "${MUSE_INPUT_AGENT_PACKAGE_SHA256:-}" ]; then echo 'muse-spark: pin MUSE_AGENT_VERSION and MUSE_INPUT_AGENT_PACKAGE_SHA256' >&2; exit 1; fi
          muse_dir="$(mktemp -d)"
          trap 'rm -rf "$muse_dir"' EXIT HUP INT TERM
          if [ -n "$muse_key_file" ] && [ -f "$muse_key_file" ]; then
            cp "$muse_key_file" "$muse_dir/key" || { echo 'muse-spark: cannot read the key file' >&2; exit 1; }
          else
            printf '%s' "$muse_key" > "$muse_dir/key"
          fi
          unset muse_key muse_key_file
          chmod 600 "$muse_dir/key"
          curl --fail --silent --show-error --location --max-time 120 --output "$muse_dir/agent.tgz" "${MUSE_AGENT_URL:-https://registry.npmjs.org/muse-spark-code-acp/-/muse-spark-code-acp-$MUSE_AGENT_VERSION.tgz}"
          muse_sum="$(sha256sum "$muse_dir/agent.tgz")"
          if [ "${muse_sum%% *}" != "$MUSE_INPUT_AGENT_PACKAGE_SHA256" ]; then echo 'muse-spark: the agent package does not match MUSE_INPUT_AGENT_PACKAGE_SHA256' >&2; exit 1; fi
          mkdir "$muse_dir/launcher"
          tar -xzf "$muse_dir/agent.tgz" -C "$muse_dir/launcher" --no-same-owner
          MUSE_CI_TEMP="$muse_dir" MUSE_CI_BOOTSTRAP_START_MS="$muse_start_ms" MUSE_INPUT_AGENT_PACKAGE="$muse_dir/agent.tgz" exec node "$muse_dir/launcher/package/ci/lib/ci-run.mjs" azure < "$muse_dir/key"
          # END MUSE BOOTSTRAP
        displayName: Run Muse Spark
        env:
          MUSE_MODEL_API_KEY: $(MUSE_MODEL_API_KEY)
      - publish: muse-spark-out
        artifact: muse-spark-out
        displayName: Publish the run outputs
        condition: always()
