# Muse Spark Code (Unofficial): Bitbucket Pipelines template (PLAN.md M80/D65, lane CM80CI-R2).
# Not endorsed by Meta. Guide: docs/ci-other-systems.md.
#
# One step runs the GitHub Action's own launcher, shipped in the
# muse-spark-code-acp package (ci/lib/ci-run.mjs): the step downloads the
# pinned package, checks its SHA-256 with sha256sum before anything of it
# runs, unpacks it outside the workspace and execs the launcher, which
# installs the same tarball with lifecycle scripts off, checks its identity,
# reviews (or proposes a fix for) the change and writes muse-spark-out/.
# It never comments and never pushes.
#
# Secret (Repository settings > Repository variables): MUSE_MODEL_API_KEY,
# Secured. Set MUSE_AGENT_VERSION (a release that carries ci/, the first
# after 0.17.0) and MUSE_INPUT_AGENT_PACKAGE_SHA256 (that tarball's SHA-256)
# there too, and any other MUSE_INPUT_* value to change. Bitbucket does not
# start this repository's pipelines for pull requests from forks. The step
# is listed only under branches (main) and custom (run by hand by someone
# with write access), never under pull-requests: add it there yourself only
# with MUSE_INPUT_TRUST_PULL_REQUESTS set to true, or the launcher refuses
# the pull request build. The step unsets the variable before any other
# command and passes the value only on the exec line.
#
# Inputs, as repository variables (empty or unset takes the default; an
# explicitly empty MUSE_INPUT_MAX_BUDGET_USD stays empty and is refused):
#   MUSE_INPUT_MODE                     review (plan mode, no edits) or fix (a patch is proposed)
#   MUSE_INPUT_MAX_BUDGET_USD           hard USD cap, more than 0, at most 20; 2.00 when unset
#   MUSE_INPUT_MAX_REQUESTS             billable HTTP attempts, retries included (1-500); 30
#   MUSE_INPUT_TIMEOUT_MINUTES          the run's deadline (1-360); 20; max-time must cover it
#   MUSE_INPUT_MODEL                    Model API model id; the agent's default
#   MUSE_INPUT_EFFORT                   reasoning effort; the model's default
#   MUSE_INPUT_ALLOW_CONTRIBUTOR_MODELS true allows a contributor model (training-eligible); false
#   MUSE_INPUT_IMAGE_GENERATION         true allows paid images in fix mode; false
#   MUSE_INPUT_MAX_DIFF_BYTES           the diff given to the model is cut to this (1-1048576); 262144
#   MUSE_INPUT_EXTRA_INSTRUCTIONS       trusted instructions from the pipeline author
#   MUSE_INPUT_TRUST_PULL_REQUESTS      true reviews pull requests from this repository; false
#   MUSE_INPUT_HTTPS_PROXY, MUSE_INPUT_NO_PROXY, MUSE_INPUT_EXTRA_CA_CERTS

clone:
  depth: full # The base commit must be in the clone.

definitions:
  steps:
    - step: &muse-spark
        name: Muse Spark
        image: node:22
        # MUSE_CI_JOB_TIMEOUT_MINUTES below names the same deadline for the launcher.
        max-time: 35
        script:
          - export MUSE_INPUT_MAX_BUDGET_USD="${MUSE_INPUT_MAX_BUDGET_USD-2.00}"
          - export MUSE_CI_JOB_TIMEOUT_MINUTES=35
          - |
            set +x
            set -eu
            muse_key="${MUSE_MODEL_API_KEY:-}"
            unset MUSE_MODEL_API_KEY
            if [ -z "${MUSE_AGENT_VERSION:-}" ] || [ -z "${MUSE_INPUT_AGENT_PACKAGE_SHA256:-}" ]; then echo 'muse-spark: pin MUSE_AGENT_VERSION and MUSE_INPUT_AGENT_PACKAGE_SHA256' >&2; exit 1; fi
            muse_dir="$(mktemp -d)"
            curl --fail --silent --show-error --location --max-time 120 --output "$muse_dir/agent.tgz" "${MUSE_AGENT_URL:-https://registry.npmjs.org/muse-spark-code-acp/-/muse-spark-code-acp-$MUSE_AGENT_VERSION.tgz}"
            muse_sum="$(sha256sum "$muse_dir/agent.tgz")"
            if [ "${muse_sum%% *}" != "$MUSE_INPUT_AGENT_PACKAGE_SHA256" ]; then echo 'muse-spark: the agent package does not match MUSE_INPUT_AGENT_PACKAGE_SHA256' >&2; exit 1; fi
            mkdir "$muse_dir/launcher"
            tar -xzf "$muse_dir/agent.tgz" -C "$muse_dir/launcher" --no-same-owner
            MUSE_SPARK_MODEL_API_KEY="$muse_key" MUSE_CI_TEMP="$muse_dir" MUSE_INPUT_AGENT_PACKAGE="$muse_dir/agent.tgz" exec node "$muse_dir/launcher/package/ci/lib/ci-run.mjs" bitbucket
        artifacts:
          - muse-spark-out/**

pipelines:
  branches:
    main:
      - step: *muse-spark
  custom:
    muse-spark:
      - step: *muse-spark
