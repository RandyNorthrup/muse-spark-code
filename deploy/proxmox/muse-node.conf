# Muse Node as a Proxmox LXC container (M110f lane S, D90.20).
# Unprivileged, with nesting for the sandbox engine. The template and the
# storage are the operator's: set ostemplate and rootfs for the host this
# lands on, then start the container and run node init inside it.
arch: amd64
cores: 4
memory: 8192
swap: 1024
onboot: 1
unprivileged: 1
features: nesting=1
net0: name=eth0,bridge=vmbr0,ip=dhcp
ostemplate: local:vztmpl/debian-13-standard_amd64.tar.zst
rootfs: local-lvm:32
