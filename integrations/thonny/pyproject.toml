[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thonny-muse-spark"
version = "0.1.0"
description = "Muse Spark companion plugin for Thonny (unofficial)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Randy Northrup" }]
keywords = ["thonny", "muse-spark", "makers", "micropython"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
# No dependencies: only the standard library. Thonny itself is the host
# and provides the `thonny` package; the test suite runs against fakes.
dependencies = []

[project.urls]
Homepage = "https://github.com/RandyNorthrup/muse-spark-code"
Issues = "https://github.com/RandyNorthrup/muse-spark-code/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thonnycontrib.muse_spark" = ["locale/*/LC_MESSAGES/*.mo", "locale/*/LC_MESSAGES/*.po", "windows_job.cs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["thonnycontrib"]
