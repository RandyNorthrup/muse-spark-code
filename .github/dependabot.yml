# Weekly dependency updates, grouped so one pull request carries the
# routine bumps; the pinned-SHA actions stay pinned (Dependabot updates
# the SHA and the version comment together).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A week between a version appearing on the registry and a bump (a
    # freshly published package can be malicious or broken).
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # The VS Code typings are pinned to the engine floor by hand (the
      # manifest test enforces `@types/vscode` minor == engines.vscode minor).
      - dependency-name: '@types/vscode'
      # The Node typings follow the Node major the workflows and the manifest's engines run
      # on (22); a major ahead breaks the type-aware lint's module resolution.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript stays on 6.0.x until typescript-eslint declares support for 7 (AGENTS.md,
      # toolchain pins): its peer range is `>=4.8.4 <6.1.0`, and a compiler outside that range
      # silently disables every type-aware lint rule. 6.0.3 is the last 6.x release, so 7 is the
      # only update there is. Remove this entry when `npm info typescript-eslint
      # peerDependencies` admits 7, so the grouped pull request can bump it with its tests.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  # The semgrep CLI the CI `sast` job pins (.github/semgrep/requirements.txt).
  - package-ecosystem: pip
    directory: /.github/semgrep
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
