# The Node OS image pipeline (M110os OS6, on OS1's recipe): both images
# on each change, built by os/build.py inside the repository's builder
# container (os/builder/Dockerfile: Debian 13 by digest, mkosi from
# os/pins.json) with the per-architecture Linux runtime from this commit,
# the QEMU boot tests (x86-64 with KVM when the runner offers it and TCG
# otherwise, aarch64 `virt` emulated; each receipt names which), the
# reproducibility comparison, the SPDX SBOM from the build manifests, and
# the release assets with checksums, signatures and provenance.
#
# Waiting, named: image signing waits for the owner's key ceremony
# (the publish job warns loudly and records the assets unsigned).
# The reproducibility comparison blocks: two builds of each image
# match byte for byte (measured 2026-10-30, REPRO_ENFORCE below).
name: Node OS

on:
  pull_request:
    paths:
      - 'os/**'
      - 'scripts/os-boot-test.mjs'
      - 'scripts/os-repro-check.mjs'
      - 'scripts/os-sbom.mjs'
      - 'scripts/lib/osBootTest.mjs'
      - 'scripts/lib/osReproCheck.mjs'
      - 'scripts/lib/osSbom.mjs'
      - 'scripts/package-acp.mjs'
      - 'scripts/lib/acpBundles.mjs'
      - 'test/unit/nodeOs*.test.ts'
      - 'test/unit/osImageBuild*.test.mjs'
      - 'test/fixtures/nodeos-*/**'
      - '.github/workflows/node-os.yml'
  push:
    branches: [main]
    paths:
      - 'os/**'
      - 'scripts/os-boot-test.mjs'
      - 'scripts/os-repro-check.mjs'
      - 'scripts/os-sbom.mjs'
      - 'scripts/lib/osBootTest.mjs'
      - 'scripts/lib/osReproCheck.mjs'
      - 'scripts/lib/osSbom.mjs'
      - 'scripts/package-acp.mjs'
      - 'scripts/lib/acpBundles.mjs'
      - 'test/unit/nodeOs*.test.ts'
      - 'test/unit/osImageBuild*.test.mjs'
      - 'test/fixtures/nodeos-*/**'
      - '.github/workflows/node-os.yml'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its older run. A push to main
# keeps its own run to the end, in a group of its own commit, so the
# release door (scripts/rule2-gate.mjs) reads this run of the tagged
# commit and a merge that follows never cancels it.
concurrency:
  group: node-os-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

# The reproducibility comparison blocks the pipeline: two builds of
# each image match byte for byte (measured 2026-10-30; flip back to
# 'false' only with a dated reason if a recipe change breaks that).
env:
  REPRO_ENFORCE: 'true'
  # The systemd-analyze security gate on the built image's muse-node.service,
  # in tenths of an exposure point (it fails past this). 84 holds the unit at
  # the 8.3 it measured when the gate was added: a ratchet, not a claim that
  # 8.3 is safe. Lower it as the unit is hardened.
  SECURITY_THRESHOLD: '84'

jobs:
  static:
    name: static OS checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - name: image recipe policy
        shell: bash
        run: python3 os/check.py
      - name: firewall defaults load on a real kernel
        shell: bash
        # A container's own network namespace: the host's firewall is never
        # touched. The container is Debian 13, the release the image carries.
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD/os/hardening:/h:ro" \
            debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad sh -ec '
              apt-get update -qq && apt-get install -y -qq --no-install-recommends nftables
              nft -c -f /h/nftables.conf
              nft -f /h/nftables.conf
              nft list chain inet filter input | grep -q "policy drop"
              nft list chain inet filter forward | grep -q "policy drop"'
      - name: shell syntax of the OS scripts
        shell: bash
        run: |
          for script in os/hardening/security-threshold.sh os/crypt/enroll-var.sh os/crypt/sign-boot.sh os/crypt/tang/bind-tang.sh; do
            bash -n "$script"
          done
      - name: add-on manifests
        shell: bash
        run: |
          node os/addons/check-addon.mjs --manifest os/addons/chrome/addon.json
          node os/addons/check-addon.mjs --manifest os/addons/nvidia/addon.json
      - name: base firmware set, live
        shell: bash
        run: node os/firmware/check-firmware.mjs --firmware os/firmware/firmware.json
      - name: vendor key pins, recorded transcripts
        shell: bash
        run: |
          node os/addons/chrome/check-key.mjs --transcript test/fixtures/nodeos-chrome/colons.txt --fingerprints os/addons/chrome/fingerprints.txt
          node os/addons/chrome/check-key.mjs --transcript test/fixtures/nodeos-nvidia/colons.txt --fingerprints os/addons/nvidia/fingerprints.txt
      - name: security-threshold gate fires both ways
        shell: bash
        run: |
          root="$RUNNER_TEMP/threshold-root"
          mkdir -p "$root/usr/lib/systemd/system"
          printf '[Unit]\nDescription=deliberately insecure CI unit\n[Service]\nExecStart=/bin/true\n' > "$root/usr/lib/systemd/system/insecure-ci.service"
          os/hardening/security-threshold.sh --root "$root" --threshold 100 insecure-ci.service
          if os/hardening/security-threshold.sh --root "$root" --threshold 0 insecure-ci.service; then
            echo '::error::the threshold gate passed a zero threshold on an insecure unit' >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.target }} twice
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86-64
            acp-target: linux-x64
            runner: ubuntu-latest
          - target: arm64
            acp-target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      # The image build runs in the repository's builder container, the same
      # Debian 13 toolset on every runner (Ubuntu's systemd is older and
      # splits its packages differently, so a host install is not the tool the
      # recipe was proven with). gcc and libssl-dev are for the runtime
      # package's native helpers.
      - name: install the runtime package's native toolchain
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libssl-dev
      - name: build the image builder container
        shell: bash
        run: docker build -f os/builder/Dockerfile -t muse-nodeos-builder os
      - run: npm ci --ignore-scripts --no-audit
      - name: production build and the runtime package
        shell: bash
        env:
          ACP_TARGET: ${{ matrix.acp-target }}
        run: |
          node scripts/build.mjs --production
          node scripts/package-acp.mjs --target "$ACP_TARGET"
      # mkosi assembles disk images (loop mounts), so the builder container
      # runs privileged and its out/ tree is root's, moved by sudo below and
      # world-readable for the artifact upload.
      - name: first build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ACP_TARGET: ${{ matrix.acp-target }}
        run: |
          runtime=(dist/muse-spark-code-acp-"*"-$ACP_TARGET.tgz)
          sha="$(sha256sum "${runtime[0]}" | cut -d' ' -f1)"
          docker run --rm --privileged -v "$PWD:/work" -w /work muse-nodeos-builder \
            python3 os/build.py "$TARGET" --runtime "/work/${runtime[0]}" --runtime-sha256 "$sha" --mkosi /usr/local/bin/mkosi
          mkdir -p build-a
          sudo mv "out/$TARGET" "build-a/$TARGET"
      - name: second build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ACP_TARGET: ${{ matrix.acp-target }}
        run: |
          runtime=(dist/muse-spark-code-acp-"*"-$ACP_TARGET.tgz)
          sha="$(sha256sum "${runtime[0]}" | cut -d' ' -f1)"
          docker run --rm --privileged -v "$PWD:/work" -w /work muse-nodeos-builder \
            python3 os/build.py "$TARGET" --runtime "/work/${runtime[0]}" --runtime-sha256 "$sha" --mkosi /usr/local/bin/mkosi
          mkdir -p build-b
          sudo mv "out/$TARGET" "build-b/$TARGET"
      - name: security-threshold gate on the built image's service unit
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm --privileged -e TARGET -e SECURITY_THRESHOLD -v "$PWD:/work" -w /work muse-nodeos-builder bash -ec '
            root="$(mktemp -d)"
            mkdir "$root/usr"
            mount -o ro,loop "build-a/$TARGET/muse-node-$TARGET.usr-a.raw" "$root/usr"
            trap "umount $root/usr" EXIT
            os/hardening/security-threshold.sh --root "$root" --threshold "$SECURITY_THRESHOLD" muse-node.service'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-os-images-${{ matrix.target }}
          path: |
            build-a/
            build-b/
          retention-days: 90

  boot:
    name: boot ${{ matrix.arch }} in QEMU
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            build-target: x86-64
            qemu-arch: x86_64
            kvm: 'auto'
            memory: '2048'
            timeout: '900'
          - arch: aarch64
            build-target: arm64
            qemu-arch: aarch64
            kvm: 'off'
            memory: '2048'
            timeout: '1800'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-os-images-${{ matrix.build-target }}
      - name: install QEMU and the firmware
        shell: bash
        run: sudo apt-get install -y qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64
      # KVM where the runner offers it, TCG where it does not; the driver's
      # receipt (result.json) names the acceleration the boot ran under.
      - name: let the runner user open /dev/kvm
        if: matrix.arch == 'x86-64'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: boot the first build and wait for the marker
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_TARGET: ${{ matrix.build-target }}
          QEMU_ARCH: ${{ matrix.qemu-arch }}
          KVM: ${{ matrix.kvm }}
          MEMORY: ${{ matrix.memory }}
          TIMEOUT: ${{ matrix.timeout }}
        run: |
          image="build-a/$BUILD_TARGET/muse-node-$BUILD_TARGET.raw"
          if [ ! -f "$image" ]; then
            echo "::error::the OS1 recipe names the raw image $image; it is missing" >&2
            exit 1
          fi
          firmware_args=()
          if [ "$QEMU_ARCH" = x86_64 ]; then
            cp /usr/share/OVMF/OVMF_VARS_4M.fd "$RUNNER_TEMP/OVMF_VARS.fd"
            firmware_args=(--ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd --ovmf-vars "$RUNNER_TEMP/OVMF_VARS.fd")
          else
            firmware_args=(--aavmf /usr/share/AAVMF/AAVMF_CODE.fd)
          fi
          # The marker is the serial getty's login prompt: systemd's
          # own status lines carry ANSI escapes, so their plain text
          # never matches byte for byte.
          node scripts/os-boot-test.mjs --arch "$QEMU_ARCH" --out "boot-$ARCH" \
            --marker 'localhost login:' --timeout "$TIMEOUT" --memory "$MEMORY" \
            --image "$image" --kvm "$KVM" "${firmware_args[@]}"
          cat "boot-$ARCH/result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: node-os-boot-${{ matrix.arch }}
          path: boot-${{ matrix.arch }}/
          retention-days: 90

  repro:
    name: reproducibility comparison
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-os-images-*
          merge-multiple: true
      - name: record both builds
        shell: bash
        run: |
          node scripts/os-repro-check.mjs --record build-a --out hashes-a.json
          node scripts/os-repro-check.mjs --record build-b --out hashes-b.json
      - name: compare the builds
        if: env.REPRO_ENFORCE == 'true'
        shell: bash
        run: node scripts/os-repro-check.mjs --compare build-a build-b
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-os-hashes
          path: hashes-*.json
          retention-days: 90

  sbom:
    name: SPDX SBOM from the build manifests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-os-images-*
          merge-multiple: true
      - name: write the SBOM for each architecture
        shell: bash
        run: |
          mkdir -p sbom
          node scripts/os-sbom.mjs --manifest build-a/x86-64/muse-node-x86-64.manifest --image build-a/x86-64/muse-node-x86-64.raw --out sbom/muse-node-x86-64.spdx.json
          node scripts/os-sbom.mjs --manifest build-a/arm64/muse-node-arm64.manifest --image build-a/arm64/muse-node-arm64.raw --out sbom/muse-node-arm64.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-os-sbom
          path: sbom/
          retention-days: 90

  publish:
    name: release assets
    needs: [boot, repro, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-os-images-x86-64
          path: images-x86-64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-os-images-arm64
          path: images-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-os-sbom
          path: sbom
      - name: checksums and the asset manifest
        shell: bash
        run: |
          mkdir -p assets
          cp images-x86-64/build-a/x86-64/muse-node-x86-64.raw images-arm64/build-a/arm64/muse-node-arm64.raw assets/
          cp sbom/*.spdx.json assets/
          cp images-x86-64/build-a/x86-64/muse-node-x86-64.manifest images-arm64/build-a/arm64/muse-node-arm64.manifest assets/
          cp images-x86-64/build-a/x86-64/inputs.json images-x86-64/build-a/x86-64/artifacts.json assets/inputs-x86-64.json assets/artifacts-x86-64.json
          cp images-arm64/build-a/arm64/inputs.json images-arm64/build-a/arm64/artifacts.json assets/inputs-arm64.json assets/artifacts-arm64.json
          (cd assets && sha256sum muse-node-*.raw muse-node-*.spdx.json muse-node-*.manifest inputs-*.json artifacts-*.json > SHA256SUMS)
          node -e "
            const fs = require('node:fs');
            const sums = fs.readFileSync('assets/SHA256SUMS', 'utf8').trim().split('\n');
            const manifest = {
              images: sums
                .filter((line) => line.endsWith('.raw'))
                .map((line) => {
                  const [sha256, file] = line.split(/\s+/);
                  return { file, sha256 };
                }),
              sbom: sums
                .filter((line) => line.endsWith('.spdx.json'))
                .map((line) => {
                  const [sha256, file] = line.split(/\s+/);
                  return { file, sha256 };
                }),
              provenance: sums
                .filter(
                  (line) =>
                    line.endsWith('.manifest') ||
                    line.includes('inputs-') ||
                    line.includes('artifacts-'),
                )
                .map((line) => {
                  const [sha256, file] = line.split(/\s+/);
                  return { file, sha256 };
                }),
              signed: false,
              signatureNote: 'image signing waits for the owner key ceremony',
            };
            fs.writeFileSync('assets/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "
      - name: sign the checksums, or say the key ceremony waits
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.OS_IMAGE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo '::warning::image signing waits for the owner key ceremony; assets stay unsigned'
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/sign-gpg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --armor --detach-sign --output assets/SHA256SUMS.asc assets/SHA256SUMS
          node -e "
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('assets/manifest.json', 'utf8'));
            manifest.signed = true;
            manifest.signatureNote = 'SHA256SUMS.asc over SHA256SUMS';
            fs.writeFileSync('assets/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "
      - name: attest the provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/muse-node-*.raw
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-os-assets
          path: assets/
          retention-days: 90
