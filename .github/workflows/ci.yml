# Pull requests, merge-queue groups and manual branch runs call the shared
# build (build.yml): the fast tier for a pull request once the merge queue is
# on, the full tier for everything else. The required checks are the same
# seven names on every event.
#
# CI capacity (D122): while the repository variable ORG_CI is `on` and the
# capacity app's key reaches the run, a same-repository pull request runs
# part `home`: every job here except the unit shards (eight on Ubuntu,
# sixteen each on Windows and macOS), plus build.yml's `org` job, which
# pushes the pull request's merge commit to the capacity repository
# scnetsolutions/muse-spark-code-ci as ci/pr-<number>, where this same file
# runs those forty shards on the organization's runners (part `org`), and
# waits for that run. The required names fold in its result. Forks,
# Dependabot, merge groups, manual runs and every pull request while ORG_CI
# is not `on` keep every job here (part `all`): none of them gets the key.
name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  # Runs only in the capacity repository, where build.yml's `org` job pushes
  # ci/pr-<number>; route skips it anywhere else.
  push:
    branches: ['ci/pr-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: route
    if: ${{ github.event_name != 'push' || github.repository == 'scnetsolutions/muse-spark-code-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      part: ${{ steps.pick.outputs.part }}
    steps:
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ORG_CI: ${{ vars.ORG_CI }}
          FAST: ${{ github.event_name == 'pull_request' && vars.CI_MERGE_QUEUE == 'on' }}
          # GitHub passes no Actions secret to a fork's or Dependabot's run,
          # so this is false there whatever ORG_CI says.
          HAS_KEY: ${{ secrets.ORG_CI_APP_PRIVATE_KEY != '' }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            [[ "$REF" =~ ^ci/pr-[0-9]+$ ]] || { echo "::error::branch $REF is not ci/pr-<number>"; exit 1; }
            part=org
            why="the merge commit of pull request #${REF#ci/pr-}"
          elif [ "$EVENT" != pull_request ]; then
            part=all
            why="a $EVENT run keeps every job here"
          elif [ "$ORG_CI" != on ]; then
            part=all
            why="ORG_CI is not on"
          elif [ "$FAST" = true ]; then
            part=all
            why="the fast tier runs on Ubuntu only"
          elif [ "$SAME_REPO" != true ] || [ "$HAS_KEY" != true ]; then
            part=all
            why="no capacity app key reaches this run: a fork, Dependabot, or ORG_CI_APP_PRIVATE_KEY unset"
          else
            part=home
            why="the unit shards run in scnetsolutions/muse-spark-code-ci"
          fi
          echo "part=$part" >> "$GITHUB_OUTPUT"
          echo "This run's part: $part ($why)"

  build:
    needs: route
    uses: ./.github/workflows/build.yml
    # The capacity app's key, read only by build.yml's `org` job in a `home`
    # run; empty wherever GitHub withholds secrets. No other secret is passed.
    secrets:
      org-ci-app-private-key: ${{ secrets.ORG_CI_APP_PRIVATE_KEY }}
    with:
      # The fast PR tier is safe only while the merge queue runs the full one
      # before anything lands. Until the maintainer has turned the queue on in
      # the main ruleset and set the repository variable CI_MERGE_QUEUE to
      # `on` (CONTRIBUTING.md, "CI tiers"), every PR keeps the full tier.
      fast: ${{ github.event_name == 'pull_request' && vars.CI_MERGE_QUEUE == 'on' }}
      part: ${{ needs.route.outputs.part }}
