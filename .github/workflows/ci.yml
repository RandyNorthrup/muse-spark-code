# Every push to main and every pull request runs the shared build
# (build.yml): the quality gates on three platforms, the integration tests,
# the macOS helper, the .vsix, secret scanning and semgrep.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Same-repository reusable workflow: GITHUB_TOKEN reaches it on its own;
    # no other secret is passed (least privilege).
    uses: ./.github/workflows/build.yml
