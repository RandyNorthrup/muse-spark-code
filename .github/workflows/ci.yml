name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # All gates except secrets (separate job) and integration tests (below):
      # format, lint, typecheck, dead code, cycles, duplication, unit tests with
      # coverage thresholds, production build with bundle budget, npm audit.
      - run: npm run quality:gates
      - name: integration tests (linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: integration tests (windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - run: semgrep scan --config auto --error --exclude=dist --exclude=coverage --exclude=node_modules
