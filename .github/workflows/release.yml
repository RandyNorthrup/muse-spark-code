# A version tag (v1.2.3) reuses verified exact-tree CI artifacts or runs the
# shared build, then publishes its six platform
# VSIX packages plus the untargeted fallback (PLAN.md D209), ACP tarball, CycloneDX
# inventories and SHA256SUMS on GitHub with
# CHANGELOG notes and package attestations. The identical packages go to
# Marketplace/Open VSX when the tag-only `marketplace` environment has
# VSCE_PAT/OVSX_PAT, and to npm by trusted publishing (OIDC, no token).
# Registry reruns require matching bytes/SRI;
# network retries are bounded. The final summary reports every channel,
# including missing-secret skips, and fails any failed channel.
# Recovery, npm auth and signing decisions: docs/RELEASING.md.
#
# Before anything is built, the tag must name the manifest's version and
# point at a commit on main. The PAT reaches one step only, after an
# `npm ci --ignore-scripts`, so no dependency's install script or the husky
# `prepare` hook ever runs beside it; no checkout keeps a token in its git
# config (M26, PLAN.md D29).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Recovery (2026-10-04): run on a version tag with the id of an earlier
  # release run whose build passed, to publish that run's tested packages
  # without building them again. The tag checks still run first.
  workflow_dispatch:
    inputs:
      artifacts_run_id:
        description: An earlier Release run on this tag whose build passed (its packages are published)
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: tag checks
    runs-on: ubuntu-latest
    # The last step waits up to 60 minutes for a run on the tagged commit that
    # is still in progress (the Hosts run a merge to main starts takes 4 to 8).
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      # The whole history and every branch, for the ancestry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: a manual run is on a version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            echo "::error::run the recovery on a version tag, not ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: tag matches the manifest version
        run: |
          version="$(jq -r .version package.json)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main" >&2
            exit 1
          fi
      # The pin check parses its upstream answers with zod, so the
      # dependencies are installed first (scripts/check-workflow-scripts.mjs
      # holds every job to that).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit
      # M81 A1: never ship an expired browser check runtime pin, or one more
      # than 14 days behind the newest Stable (design spec v4 §4.2).
      - name: the browser check runtime pin is current
        run: node scripts/check-browser-runtime-pin.mjs
      # AGENTS.md rule 2 at the release door (docs/certification/rule2-gate.md):
      # every workflow run on the tagged commit and on the head of the pull
      # request that merged as it is complete and green on its first attempt.
      # One still in progress is waited for; a red one, or one that was started
      # again, stops the release here, with the run, job and step named. An
      # expected commit with no run of its own stops it too. A
      # recovery run passes the same door.
      - name: every hosted run on the tagged commit is green on its first attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rule2-gate.mjs release

  reuse:
    name: verified CI artifacts or full-build fallback
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.check.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit
      - name: find a successful own-repository CI build of the tag tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ vars.RELEASE_FORCE_REBUILD }}
          RECOVERY_RUN_ID: ${{ inputs.artifacts_run_id }}
        run: node scripts/release-reuse.mjs find
      - name: download the source-tree receipt
        id: receipt
        if: steps.lookup.outputs.run-id != '' && steps.lookup.outputs.legacy-recovery != 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-tree-${{ steps.lookup.outputs.tree }}
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}
          path: reused
      - name: download the CI platform VSIX packages
        id: vsix
        if: steps.lookup.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-spark-code-vsix
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}
          path: reused
      - name: download the CI ACP tarball
        id: acp
        if: steps.lookup.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-spark-code-acp
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}
          path: reused
      - name: download the CI SBOMs
        id: sboms
        if: steps.lookup.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-spark-code-sboms
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}
          path: reused
      # D140: the Linux dictation helper builds for the release assets.
      # Tags predating helper assets (legacy recovery) reuse without them.
      - name: download the CI Linux helper x64 build
        id: helpers-x64
        if: steps.lookup.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-created-linux-x64
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}
          path: reused-helpers/x64
      - name: download the CI Linux helper arm64 build
        id: helpers-arm64
        if: steps.lookup.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-created-linux-arm64
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}
          path: reused-helpers/arm64
      - name: verify tree, asset hashes and both package versions
        id: check
        if: steps.lookup.outputs.run-id != ''
        env:
          DOWNLOADS_OK: ${{ (steps.receipt.outcome == 'success' || steps.lookup.outputs.legacy-recovery == 'true') && steps.vsix.outcome == 'success' && steps.acp.outcome == 'success' && steps.sboms.outcome == 'success' && (steps.helpers-x64.outcome == 'success' || steps.lookup.outputs.legacy-recovery == 'true') && (steps.helpers-arm64.outcome == 'success' || steps.lookup.outputs.legacy-recovery == 'true') }}
          RECOVERY_RUN_ID: ${{ inputs.artifacts_run_id }}
          LEGACY_RECOVERY: ${{ steps.lookup.outputs.legacy-recovery }}
          SOURCE_TREE: ${{ steps.lookup.outputs.tree }}
        run: |
          if [ "$DOWNLOADS_OK" = 'true' ]; then
            node scripts/release-reuse.mjs verify reused
          else
            if [ -n "$RECOVERY_RUN_ID" ]; then
              echo '::error::Recovery download failed; preserve the original bytes.' >&2
              exit 1
            fi
            echo 'reused=false' >> "$GITHUB_OUTPUT"
            echo 'Full rebuild: a CI artifact download failed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.reused == 'true'
        with:
          name: muse-spark-code-vsix
          path: reused/*.vsix
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.reused == 'true'
        with:
          name: muse-spark-code-acp
          path: reused/*.tgz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.reused == 'true'
        with:
          name: muse-spark-code-sboms
          path: reused/*.cdx.json
          if-no-files-found: error
          retention-days: 30
      # The receipt travels with them, so a recovery from this run checks
      # the same per-asset hashes (release-reuse.mjs findRecovery).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.reused == 'true' && steps.lookup.outputs.legacy-recovery != 'true'
        with:
          name: source-tree-${{ steps.lookup.outputs.tree }}
          path: reused/release-build.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.reused == 'true' && hashFiles('reused-helpers/x64/**') != ''
        with:
          name: muse-created-linux-x64
          path: reused-helpers/x64
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.reused == 'true' && hashFiles('reused-helpers/arm64/**') != ''
        with:
          name: muse-created-linux-arm64
          path: reused-helpers/arm64
          if-no-files-found: error
          retention-days: 30

  build:
    needs: [verify, reuse]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.reuse.result == 'success' && github.event_name == 'push' && needs.reuse.outputs.reused != 'true' }}
    # Same-repository reusable workflow: GITHUB_TOKEN reaches it on its own;
    # no other secret is passed (least privilege). A job that calls a
    # reusable workflow takes no timeout-minutes; build.yml's jobs set theirs.
    # `actions: read` is for build.yml's `first-attempt` job (rule 2); a called
    # workflow can ask for no more than its caller grants.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build.yml

  # check:claims (branch feat/claims-gate): the real-life record check lands
  # here before any release publishes — a step that fails the release when
  # the packed product's real-life run record does not cover the shipped
  # claims. No stub: until that branch lands there is nothing here that
  # pretends to pass.
  release:
    name: GitHub Release
    needs: [verify, reuse, build, native-sign]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.reuse.result == 'success' && needs.native-sign.result == 'success' && (needs.reuse.outputs.reused == 'true' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    outputs:
      outcome: ${{ steps.outcome.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          name: muse-spark-code-vsix
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          name: muse-spark-code-acp
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          name: muse-spark-code-sboms
          path: release
      # D140: the helper builds for the same-tag release assets. Absent on
      # legacy recoveries only; the staging step refuses a modern VSIX
      # without them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: helpers-x64
        continue-on-error: true
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          name: muse-created-linux-x64
          path: helpers/x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: helpers-arm64
        continue-on-error: true
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          name: muse-created-linux-arm64
          path: helpers/arm64
      # Keep each host's receipt beside its own archives for exact verification.
      # Recovery's native-sign job has already verified the prior signed bytes.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          pattern: m104-native-release-*
          merge-multiple: false
          path: native-release
      - run: npm ci --ignore-scripts --no-audit
      - name: verify and stage every present native host's archives and receipt
        run: node scripts/package-hosts/release.mjs stage native-release release
      # M80 hook: inert until its schemas exist. They ship as assets beside
      # the packages, listed in SHA256SUMS and attested like them.
      - name: stage the M80 schemas when present
        shell: bash
        run: |
          shopt -s nullglob
          schemas=(docs/schemas/*.json)
          : > release/.schemas
          if [ "${#schemas[@]}" -gt 0 ]; then
            cp "${schemas[@]}" release/
            printf '%s\n' "${schemas[@]##*/}" > release/.schemas
          fi
      # D140: stage the helper files as stable-named release assets and
      # prove the VSIX embeds exactly their digests. A VSIX from the
      # download-on-consent era without staged helpers fails instead of
      # publishing an unusable release; legacy tags (bundled helpers, no
      # asset names in the bundle) release without them.
      - name: stage the Linux helper release assets when present
        shell: bash
        run: |
          mkdir -p release/helpers
          staged=0
          for spec in x64:muse-dictate x64:libwhisper.so.1 x64:libggml.so x64:libggml-base.so \
              x64:libggml-cpu-x64.so x64:libggml-cpu-sse42.so x64:libggml-cpu-sandybridge.so \
              x64:libggml-cpu-haswell.so x64:libggml-cpu-skylakex.so x64:libggml-cpu-icelake.so \
              x64:libggml-cpu-alderlake.so x64:libggml-cpu-sapphirerapids.so \
              arm64:muse-dictate arm64:libwhisper.so.1 arm64:libggml.so \
              arm64:libggml-base.so arm64:libggml-cpu-armv8.0_1.so arm64:libggml-cpu-armv8.2_1.so \
              arm64:libggml-cpu-armv8.2_2.so arm64:libggml-cpu-armv8.2_3.so arm64:libggml-cpu-armv8.6_1.so \
              arm64:libggml-cpu-armv8.6_2.so arm64:libggml-cpu-armv9.2_1.so arm64:libggml-cpu-armv9.2_2.so; do
            arch="${spec%%:*}"
            file="${spec#*:}"
            if [ -f "helpers/$arch/$file" ]; then
              cp "helpers/$arch/$file" "release/helpers/linux-$arch-$file"
              staged=1
            fi
          done
          # Every VSIX (the universal one and the six targets) carries the
          # Linux voice bundle. Its dist/voiceLinux.js is only a loader: the
          # code is that member of the VSIX's runtime archive.
          voice_linux() {
            unzip -p "$1" extension/dist/runtime.bundles.json.br > release/runtime.bundles.json.br
            node scripts/runtime-archive-member.mjs release/runtime.bundles.json.br voiceLinux.js > release/voiceLinux.js
            rm release/runtime.bundles.json.br
          }
          shopt -s nullglob
          vsixes=(release/*.vsix)
          if [ "${#vsixes[@]}" -eq 0 ]; then
            echo '::error::no VSIX to check the helper pins of' >&2
            exit 1
          fi
          if [ "$staged" = 1 ]; then
            # The tagged source carries unset pins by design; measure the
            # staged helpers (and this tag) into the checker's own copy so
            # it verifies each VSIX against real bytes, not empty pins.
            node scripts/build-linux-helper-pins.mjs helpers/x64 helpers/arm64
            for vsix in "${vsixes[@]}"; do
              voice_linux "$vsix"
              echo "${vsix##*/}:"
              node scripts/check-linux-helper-pins.mjs --bundle release/voiceLinux.js --assets release/helpers
              rm release/voiceLinux.js
            done
          else
            for vsix in "${vsixes[@]}"; do
              voice_linux "$vsix"
              if grep -q 'linux-x64-muse-dictate' release/voiceLinux.js; then
                echo "::error::${vsix##*/} pins helper assets but none were staged" >&2
                exit 1
              fi
              rm release/voiceLinux.js
            done
            rmdir release/helpers
          fi
      - name: checksums for every release asset
        shell: bash
        working-directory: release
        run: |
          mapfile -t schemas < .schemas
          mapfile -t native < .native
          shopt -s nullglob
          helper_assets=(helpers/linux-*)
          sha256sum ./*.vsix ./*.tgz ./*.cdx.json "${schemas[@]/#/./}" "${native[@]/#/./}" > SHA256SUMS
          # Helpers upload under their basenames, so SHA256SUMS must name
          # them that way or `sha256sum -c` fails on a downloaded asset.
          if ((${#helper_assets[@]})); then
            (cd helpers && sha256sum linux-*) >> SHA256SUMS
          fi
      - name: attest every asset SHA256SUMS lists
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          create-storage-record: false
          show-summary: false
          subject-checksums: release/SHA256SUMS
      - name: release notes from the CHANGELOG
        run: node scripts/changelog-notes.mjs "${GITHUB_REF_NAME#v}" > release/notes.md
      - name: create or verify the GitHub Release without replacing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t schemas < release/.schemas
          mapfile -t native < release/.native
          shopt -s nullglob
          helper_assets=(release/helpers/linux-*)
          node scripts/github-release.mjs "$GITHUB_REF_NAME" release/notes.md release/*.vsix release/*.tgz release/*.cdx.json "${schemas[@]/#/release/}" "${native[@]/#/release/}" "${helper_assets[@]}" release/SHA256SUMS
      - id: outcome
        run: echo 'outcome=published' >> "$GITHUB_OUTPUT"

  publish:
    name: Marketplace publish
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Fresh publishes share one 30-minute visibility poll across all
    # artifacts (npm took 19 for 0.16.0); the timeout must cover every
    # publish plus that poll.
    timeout-minutes: 60
    # The token lives in this environment, which only version tags may
    # deploy to (a `v*` tag policy): no branch run, and no other job, can
    # read it (M28).
    environment: marketplace
    env:
      # Whether the secret is set, never the secret itself: a step's `if:`
      # cannot read `secrets` ("Secrets cannot be directly referenced in if:
      # conditionals", GitHub's secrets guide), and the value goes to the
      # publish step alone.
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
    outputs:
      outcome: ${{ steps.skipped.outputs.outcome || steps.published.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache in the job that holds the PAT: the lockfile's integrity
      # hashes are checked either way, and a restored cache is one input less.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          name: muse-spark-code-vsix
          path: release
      - name: skipped without VSCE_PAT
        id: skipped
        if: env.HAS_VSCE_PAT != 'true'
        run: echo 'outcome=skipped-no-secret' >> "$GITHUB_OUTPUT"
      # The locked vsce, with no install script of any package run (vsce
      # needs none to publish an unsigned package: @vscode/vsce-sign's
      # binary is used only for --signTool or a signature manifest).
      - name: install the locked tools without install scripts
        if: env.HAS_VSCE_PAT == 'true'
        run: npm ci --ignore-scripts --no-audit
      - name: publish to the Marketplace
        id: published
        if: env.HAS_VSCE_PAT == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: node scripts/publish-registry.mjs marketplace release/*.vsix

  openvsx:
    name: Open VSX publish
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Fresh publishes share one 30-minute visibility poll across all
    # artifacts; the timeout must cover every publish plus that poll.
    timeout-minutes: 60
    # Its own job, so either registry failing leaves the other published;
    # the token lives in the same tag-only environment as VSCE_PAT.
    environment: marketplace
    env:
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
    outputs:
      outcome: ${{ steps.skipped.outputs.outcome || steps.published.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          name: muse-spark-code-vsix
          path: release
      - name: skipped without OVSX_PAT
        id: skipped
        if: env.HAS_OVSX_PAT != 'true'
        run: echo 'outcome=skipped-no-secret' >> "$GITHUB_OUTPUT"
      # The locked ovsx, with no install script of any package run.
      - name: install the locked tools without install scripts
        if: env.HAS_OVSX_PAT == 'true'
        run: npm ci --ignore-scripts --no-audit
      - name: publish to Open VSX
        id: published
        if: env.HAS_OVSX_PAT == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node scripts/publish-registry.mjs openvsx release/*.vsix

  npm:
    name: npm publish (ACP agent)
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    # A fresh publish polls registry visibility for up to 30 minutes (npm took
    # 19 for 0.16.0); the timeout must cover the poll plus the publish itself.
    timeout-minutes: 40
    # npm trusted publishing (OIDC, 2026-10-04): npm trusts this workflow file in
    # this environment to publish muse-spark-code-acp, so no npm token is stored
    # anywhere. Only this job can request the OIDC identity, which also signs the
    # provenance.
    permissions:
      contents: read
      id-token: write
      actions: read
    # The same tag-only environment as the other registries' tokens; npm's
    # trusted publisher names it, so a run outside it cannot publish.
    environment: marketplace
    outputs:
      outcome: ${{ steps.published.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          name: muse-spark-code-acp
          path: release
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 bundles npm 10.
      # Pinned to the last npm 11, with no install scripts.
      - name: npm with trusted publishing
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - name: install the verification tools without install scripts
        run: npm ci --ignore-scripts --no-audit
      # The packed tarball as it is: no install, no script of any package. The
      # leading ./ matters: npm reads `release/x.tgz` as a GitHub owner/repo.
      - name: publish muse-spark-code-acp to npm
        id: published
        run: node scripts/publish-registry.mjs npm release/muse-spark-code-acp-*.tgz

  node-image:
    name: signed multi-arch node image
    needs: npm
    if: ${{ !cancelled() && needs.npm.result == 'success' }}
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/node-image.yml

  # M104-I: build without credentials; sign/publish only in the tag-only environment.
  native-build:
    name: native host packages
    needs: [verify, reuse]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.reuse.result == 'success' && github.event_name == 'push' }}
    uses: ./.github/workflows/hosts-native.yml

  native-sign:
    name: native artifact signing (${{ matrix.host }})
    needs: [verify, reuse, native-build]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.reuse.result == 'success' && (needs.native-build.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    environment: marketplace
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: jetbrains, os: ubuntu-latest }
          - { host: visualstudio, os: windows-latest }
          - { host: eclipse, os: ubuntu-latest }
          - { host: zed, os: ubuntu-latest }
          - { host: xcode, os: macos-latest }
          - { host: qtcreator, os: ubuntu-latest }
          - { host: neovim, os: ubuntu-latest }
          - { host: emacs, os: ubuntu-latest }
          - { host: sublime, os: ubuntu-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: folder
        env:
          HOST_ID: ${{ matrix.host }}
        run: |
          if [ -e "hosts/$HOST_ID" ] || [ -L "hosts/$HOST_ID" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "::notice::skipped-host-absent: hosts/$HOST_ID is absent"
            echo "$HOST_ID: skipped-host-absent — hosts/$HOST_ID is absent" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.folder.outputs.present == 'true'
        with:
          node-version: 22
      - name: tools without install scripts or channel credentials
        if: steps.folder.outputs.present == 'true'
        run: npm ci --ignore-scripts --no-audit
      - name: download the built bytes or the verified recovery run's signed bytes
        if: steps.folder.outputs.present == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('m104-native-release-{0}', matrix.host) || format('m104-native-{0}', matrix.host) }}
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: native-package
      - name: verify this tag's source tree and exact artifact bytes
        if: steps.folder.outputs.present == 'true'
        env:
          HOST_ID: ${{ matrix.host }}
        run: node scripts/package-hosts/release.mjs verify "$HOST_ID" native-package
      - name: sign with only this channel's supplied credentials (never during recovery)
        if: steps.folder.outputs.present == 'true' && github.event_name == 'push'
        env:
          HOST_ID: ${{ matrix.host }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ matrix.host == 'jetbrains' && secrets.JETBRAINS_CERTIFICATE_CHAIN || '' }}
          JETBRAINS_PRIVATE_KEY: ${{ matrix.host == 'jetbrains' && secrets.JETBRAINS_PRIVATE_KEY || '' }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ matrix.host == 'jetbrains' && secrets.JETBRAINS_PRIVATE_KEY_PASSWORD || '' }}
          WINDOWS_SIGNING_CERTIFICATE: ${{ matrix.host == 'visualstudio' && secrets.WINDOWS_SIGNING_CERTIFICATE || '' }}
          WINDOWS_SIGNING_PASSWORD: ${{ matrix.host == 'visualstudio' && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
          ECLIPSE_SIGNING_KEY: ${{ matrix.host == 'eclipse' && secrets.ECLIPSE_SIGNING_KEY || '' }}
          ECLIPSE_SIGNING_PASSWORD: ${{ matrix.host == 'eclipse' && secrets.ECLIPSE_SIGNING_PASSWORD || '' }}
          APPLE_SIGNING_CERTIFICATE: ${{ matrix.host == 'xcode' && secrets.APPLE_SIGNING_CERTIFICATE || '' }}
          APPLE_SIGNING_PASSWORD: ${{ matrix.host == 'xcode' && secrets.APPLE_SIGNING_PASSWORD || '' }}
          APPLE_NOTARY_KEY: ${{ matrix.host == 'xcode' && secrets.APPLE_NOTARY_KEY || '' }}
          APPLE_NOTARY_KEY_ID: ${{ matrix.host == 'xcode' && secrets.APPLE_NOTARY_KEY_ID || '' }}
          APPLE_NOTARY_ISSUER_ID: ${{ matrix.host == 'xcode' && secrets.APPLE_NOTARY_ISSUER_ID || '' }}
        run: node scripts/package-hosts/release.mjs sign "$HOST_ID" native-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.folder.outputs.present == 'true'
        with:
          name: m104-native-release-${{ matrix.host }}
          path: native-package/*
          if-no-files-found: error
          retention-days: 30

  native-publish:
    name: native channel (${{ matrix.host }})
    needs: [release, native-sign]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.native-sign.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    environment: marketplace
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: jetbrains, os: ubuntu-latest }
          - { host: visualstudio, os: windows-latest }
          - { host: eclipse, os: ubuntu-latest }
          - { host: zed, os: ubuntu-latest }
          - { host: xcode, os: macos-latest }
          - { host: qtcreator, os: ubuntu-latest }
          - { host: neovim, os: ubuntu-latest }
          - { host: emacs, os: ubuntu-latest }
          - { host: sublime, os: ubuntu-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: folder
        env:
          HOST_ID: ${{ matrix.host }}
        run: |
          if [ -e "hosts/$HOST_ID" ] || [ -L "hosts/$HOST_ID" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "::notice::skipped-host-absent: hosts/$HOST_ID is absent"
            echo "$HOST_ID: skipped-host-absent — hosts/$HOST_ID is absent" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.folder.outputs.present == 'true'
        with:
          node-version: 22
      - name: tools without install scripts or channel credentials
        if: steps.folder.outputs.present == 'true'
        run: npm ci --ignore-scripts --no-audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.folder.outputs.present == 'true'
        with:
          name: m104-native-release-${{ matrix.host }}
          path: native-package
      - name: confirm the exact native assets are already attached to this GitHub Release
        if: steps.folder.outputs.present == 'true'
        env:
          HOST_ID: ${{ matrix.host }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/package-hosts/release.mjs github "$HOST_ID" native-package
      - name: publish uploaded bytes or report the named registry prerequisite
        if: steps.folder.outputs.present == 'true'
        env:
          HOST_ID: ${{ matrix.host }}
          MUSE_HOST_OUTCOME_FILE: native-outcome/${{ matrix.host }}.json
          JETBRAINS_MARKETPLACE_TOKEN: ${{ matrix.host == 'jetbrains' && secrets.JETBRAINS_MARKETPLACE_TOKEN || '' }}
          VSCE_PAT: ${{ matrix.host == 'visualstudio' && secrets.VSCE_PAT || '' }}
          LUAROCKS_API_KEY: ${{ matrix.host == 'neovim' && secrets.LUAROCKS_API_KEY || '' }}
        run: |
          mkdir -p native-outcome
          node scripts/package-hosts/release.mjs publish "$HOST_ID" native-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.folder.outputs.present == 'true' && success()
        with:
          name: m104-native-outcome-${{ matrix.host }}
          path: native-outcome/*.json
          if-no-files-found: error

  native-summary:
    name: native release channel outcomes
    needs: [native-build, native-sign, native-publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all-published: ${{ steps.report.outputs.all-published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: m104-native-outcome-*
          path: native-outcomes
          merge-multiple: true
      - id: report
        run: node scripts/package-hosts/release.mjs summary native-outcomes

  summary:
    name: release channel outcomes
    needs: [release, publish, openvsx, npm, node-image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-major-tag
      cancel-in-progress: false
    outputs:
      all-published: ${{ steps.report.outputs.all-published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: report node image outcome and require publication
        env:
          NODE_IMAGE_RESULT: ${{ needs.node-image.result }}
        run: |
          printf 'Node image: %s\n' "$NODE_IMAGE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$NODE_IMAGE_RESULT" = success
      - name: report all channels and fail any incomplete job
        id: report
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/release-summary.mjs
      # M80 hook: skip until action/ exists and every channel actually published.
      - name: move the M80 v0 tag after all channels published
        id: major-tag
        continue-on-error: true
        if: steps.report.outputs.all-published == 'true' && hashFiles('action/action.yml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git show-ref --verify --quiet refs/tags/v0; then
            current=$(git rev-parse 'refs/tags/v0^{commit}')
            if git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
              echo 'v0 already points at this release or a newer descendant' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! git merge-base --is-ancestor "$current" "$GITHUB_SHA"; then
              echo '::error::v0 is on a divergent history; owner review required' >&2
              exit 1
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0" -f sha="$GITHUB_SHA" -F force=false > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v0 -f sha="$GITHUB_SHA" > /dev/null
          fi
      - name: report the M80 major-tag outcome
        if: ${{ !cancelled() && (steps.major-tag.outcome == 'success' || steps.major-tag.outcome == 'failure') }}
        env:
          MAJOR_TAG_OUTCOME: ${{ steps.major-tag.outcome }}
        run: |
          # The backticks below are literal markdown, not command
          # substitution: they must stay inside single quotes.
          # shellcheck disable=SC2016
          if [ "$MAJOR_TAG_OUTCOME" = success ]; then
            printf '\nM80 Action major tag (`v0`): current or newer release.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::M80 v0 update failed; admin move required. Published channel outcomes remain above.'
            printf '\nM80 Action major tag (`v0`): **admin move required** after the failed update for `%s`. Confirm its current target, then follow `docs/RELEASING.md`; channel outcomes above are unchanged.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi

  refresh-badges:
    name: refresh README badges
    needs: summary
    if: ${{ !cancelled() && needs.summary.result == 'success' && needs.summary.outputs.all-published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit
      - name: refresh README badges
        # URLs come from README.md, including Markdown and the GitHub CI badge.
        # Each badge is fetched before the repository page's camo copies purge.
        run: node scripts/refresh-badges.mjs
      - name: report refresh setup failure
        if: failure()
        run: echo '::warning::README badge refresh failed; published releases are unchanged.'
