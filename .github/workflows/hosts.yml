# The host checks (PLAN.md M62, M63): the integration tests in VSCodium, and
# the ACP agent's npm package as npm installs it on each platform (its help,
# its trust refusal and the key's round trip through the OS credential
# store). No model is called and no real key is used. Each job runs one
# script of test/hosts, the same script a local run uses. The editor checks
# that drove a fake Muse Code CLI are gone (owner, 2026-10-17: no fakes).
#
# Pull requests and pushes to main that touch the product or these checks,
# every Monday (the hosts' own new releases), and by hand. Every job has a
# timeout and leaves no token in the git config; none pushes.
# Capacity (D122, CISHARDS2): a routed same-repository pull request run
# skips every job here, and the capacity repository's `ci/pr-<number>` push
# run (triggered by build.yml's `org` job) runs every job there, because the
# jobs consume each other's artifacts inside one run, which cannot cross
# repositories. The `relay` job below waits for that run and takes its
# result, so a failure there fails this run too. Any other event runs
# everything here, as now.
name: Hosts

on:
  pull_request:
    paths:
      - 'src/**'
      - 'l10n/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.mjs'
      - 'scripts/package-acp.mjs'
      - 'docs/schemas/**'
      - 'docs/acp.md'
      - 'test/e2e/**'
      - 'test/hosts/**'
      - 'test/integration/**'
      - '.github/workflows/hosts.yml'
  push:
    branches: [main, ci/pr-*]
    paths:
      - 'src/**'
      - 'l10n/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.mjs'
      - 'scripts/package-acp.mjs'
      - 'docs/schemas/**'
      - 'docs/acp.md'
      - 'test/e2e/**'
      - 'test/hosts/**'
      - 'test/integration/**'
      - '.github/workflows/hosts.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Where this run's jobs belong (D122, CISHARDS2): the same split as
  # ci.yml's `route`, fast tier included. A same-repository pull request
  # while ORG_CI is on and the capacity app's key reaches the run is `home`
  # (every job below is skipped here and runs in the capacity run); a
  # `ci/pr-<number>` push in the capacity repository is `org`; anything else
  # is `all` (every job runs here, as before). Unlike ci.yml, a push outside
  # `ci/pr-*` is `all`, not an error: the lead's pushes to the capacity
  # `main` are ordinary pushes.
  route:
    name: route
    if: ${{ github.event_name != 'push' || github.repository == 'scnetsolutions/muse-spark-code-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      part: ${{ steps.pick.outputs.part }}
    steps:
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ORG_CI: ${{ vars.ORG_CI }}
          FAST: ${{ github.event_name == 'pull_request' && vars.CI_MERGE_QUEUE == 'on' }}
          # GitHub passes no Actions secret to a fork's or Dependabot's run,
          # so this is false there whatever ORG_CI says.
          HAS_KEY: ${{ secrets.ORG_CI_APP_PRIVATE_KEY != '' }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            if [[ "$REF" =~ ^ci/pr-[0-9]+$ ]]; then
              part=org
              why="the merge commit of pull request #${REF#ci/pr-}"
            else
              part=all
              why="a push outside ci/pr-<number> keeps every job here"
            fi
          elif [ "$EVENT" != pull_request ]; then
            part=all
            why="a $EVENT run keeps every job here"
          elif [ "$ORG_CI" != on ]; then
            part=all
            why="ORG_CI is not on"
          elif [ "$FAST" = true ]; then
            part=all
            why="the fast tier runs Ubuntu only and pushes no capacity branch, so every job stays here"
          elif [ "$SAME_REPO" != true ] || [ "$HAS_KEY" != true ]; then
            part=all
            why="no capacity app key reaches this run: a fork, Dependabot, or ORG_CI_APP_PRIVATE_KEY unset"
          else
            part=home
            why="every job runs in scnetsolutions/muse-spark-code-ci"
          fi
          echo "part=$part" >> "$GITHUB_OUTPUT"
          echo "This run's part: $part ($why)"

  native-helpers:
    name: package helper (${{ matrix.platform }})
    # The whole workflow moves at once (see above): skipped only in `home`.
    # When `route` itself is skipped (a push to `main` here), `part` is empty
    # and the job runs here: `!cancelled()` keeps GitHub from adding its
    # implicit `success()` over `needs`, which a skipped `route` would fail.
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.part != 'home' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - platform: darwin
            os: macos-latest
            artifact: muse-dictate-darwin
            path: |
              native/darwin/muse-dictate
              native/darwin/muse-dictate-screen.tgz
          - platform: linux-x64
            os: ubuntu-24.04
            artifact: muse-created-linux-x64
            path: native/linux/x64/muse-created
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            artifact: muse-created-linux-arm64
            path: native/linux/arm64/muse-created
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - if: matrix.platform == 'darwin'
        run: bash native/darwin/build.sh
      # Archive on macOS: artifact upload otherwise discards executable modes.
      - if: matrix.platform == 'darwin'
        run: tar -czf native/darwin/muse-dictate-screen.tgz -C native/darwin muse-dictate-screen.app
      - if: matrix.platform != 'darwin'
        run: |
          sudo apt-get update && sudo apt-get install -y libssl-dev
          node --input-type=module -e "import { buildLinuxHelper } from './scripts/build-linux-helper.mjs'; buildLinuxHelper()"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
      # M109: the vault helper the packagers require beside the dictation helper.
      - if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-vault-darwin
          path: dist/native/darwin/muse-vault
          if-no-files-found: error

  # The agent's npm package from one production build (the .vsix packs
  # beside it), with every native helper the packagers require (M107) from
  # native-helpers.
  packages:
    name: packages
    needs: [native-helpers, route]
    # `!cancelled()` drops the implicit `success()` (see native-helpers), so
    # the predecessor's success is required explicitly.
    if: ${{ !cancelled() && needs.native-helpers.result == 'success' && needs.route.outputs.part != 'home' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-dictate-darwin
          path: native/darwin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-created-linux-x64
          path: native/linux/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-created-linux-arm64
          path: native/linux/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-vault-darwin
          path: dist/native/darwin
      - run: chmod +x native/darwin/muse-dictate native/linux/x64/muse-created native/linux/arm64/muse-created dist/native/darwin/muse-vault
      - run: tar -xzf native/darwin/muse-dictate-screen.tgz -C native/darwin
      - run: npm run package
        env:
          # The packaged-README badge check lists public main (GitHub API).
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/package-acp.mjs
        env:
          # The packaged-README badge check lists public main (GitHub API).
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosts-acp
          path: dist/muse-spark-code-acp-*.tgz
          if-no-files-found: error

  # The agent as npm installs it, on each platform: its headless help and
  # trust refusal, then the key's round trip through the platform's
  # credential store (D61) with its own native keyring binding.
  agent:
    name: agent package (${{ matrix.os }})
    needs: [packages, route]
    if: ${{ !cancelled() && needs.packages.result == 'success' && needs.route.outputs.part != 'home' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hosts-acp
          path: hosts-acp
      - run: npm install --global ./hosts-acp/muse-spark-code-acp-*.tgz
      - name: installed headless help and trust refusal
        run: sh test/hosts/exec.sh "$(npm root --global)/muse-spark-code-acp"
      - name: the key through the Secret Service (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnome-keyring
          dbus-run-session -- sh -c "printf 'ci\n' | gnome-keyring-daemon --unlock --components=secrets > /dev/null && sh test/hosts/keystore.sh muse-spark-code-acp"
      # A keychain of the job's own, unlocked, as the default: the runner's
      # login keychain would ask a person to unlock it.
      - name: the key through the Keychain (macos)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci hosts.keychain
          security list-keychains -d user -s hosts.keychain login.keychain
          security default-keychain -d user -s hosts.keychain
          security unlock-keychain -p ci hosts.keychain
          security set-keychain-settings hosts.keychain
          sh test/hosts/keystore.sh muse-spark-code-acp
      - name: the key through Credential Manager (windows)
        if: runner.os == 'Windows'
        run: |
          sh test/hosts/keystore.sh muse-spark-code-acp

  # The integration tests in VSCodium: the floor's release and the latest.
  vscodium:
    name: VSCodium ${{ matrix.release }}
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.part != 'home' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        release: ['1.99.32846', latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:dev
      - run: xvfb-run -a sh test/hosts/run-vscodium.sh "${{ matrix.release }}" "$RUNNER_TEMP/vscodium"

  # D122, CISHARDS2: in a `home` run every job above is skipped here and runs
  # in the capacity repository, so this job waits for that repository's run
  # of this same workflow on the pushed merge commit and takes its result: a
  # failure or cancellation there fails this run. It polls the public runs on
  # this commit, at most ten minutes to appear; when none appears, the
  # capacity push matched none of this workflow's paths, so no run was
  # started, and the job succeeds with a warning instead of failing a pull
  # request whose latest push touched none of these paths. build.yml's `org`
  # job already fails closed when the push itself is missing. 120 bounds the
  # queue plus the offloaded suite (each job carries its own 10–25 minute
  # bound), under the platform's 6-hour ceiling.
  relay:
    name: capacity Hosts result
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.part == 'home' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CAPACITY: scnetsolutions/muse-spark-code-ci
      WORKFLOW: .github/workflows/hosts.yml
    steps:
      - name: wait for the capacity run and take its result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query="repos/$CAPACITY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100"
          select='[.workflow_runs[] | select(.path == env.WORKFLOW)][0] // empty | "\(.id) \(.status) \(.conclusion) \(.html_url)"'
          errors="$RUNNER_TEMP/capacity-read.err"
          appear_by=$((SECONDS + 600))
          id=''
          while :; do
            if found=$(gh api "$query" --jq "$select" 2> "$errors"); then
              if [ -n "$found" ]; then
                read -r id status conclusion url <<< "$found"
                [ "$status" = completed ] && break
                echo "$url: $status"
              fi
            else
              echo "::warning::reading $CAPACITY's runs failed: $(cat "$errors")"
            fi
            if [ -z "$id" ] && [ "$SECONDS" -ge "$appear_by" ]; then
              echo "::warning::no $WORKFLOW run on $GITHUB_SHA appeared in $CAPACITY: the capacity push matched none of its paths, so nothing runs there"
              {
                echo "### Capacity Hosts: no run"
                echo
                echo "No $WORKFLOW run on this commit in $CAPACITY: the push"
                echo "matched none of its paths. Nothing offloaded, nothing to relay."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 60
          done
          {
            echo "### Capacity Hosts: $conclusion"
            echo
            echo "[$CAPACITY run $id]($url)"
            echo
            echo '| job | result |'
            echo '| --- | --- |'
            gh api "repos/$CAPACITY/actions/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | "| [\(.name)](\(.html_url)) | \(.conclusion) |"' 2> "$errors" ||
              echo "| the job list could not be read: $(cat "$errors") | |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$url concluded $conclusion"
          test "$conclusion" = success
