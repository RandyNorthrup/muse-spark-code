# The host checks (PLAN.md M62, M63): the integration tests in VSCodium, and
# the ACP agent's npm package as npm installs it on each platform (its help,
# its trust refusal and the key's round trip through the OS credential
# store). No model is called and no real key is used. Each job runs one
# script of test/hosts, the same script a local run uses. The editor checks
# that drove a fake Muse Code CLI are gone (owner, 2026-10-17: no fakes).
#
# Pull requests and pushes to main that touch the product or these checks,
# every Monday (the hosts' own new releases), and by hand. Every job has a
# timeout and leaves no token in the git config; none pushes.
# Capacity (D122, CISHARDS2): a routed same-repository pull request run
# skips every job here, and the capacity repository's `ci/pr-<number>` push
# run (triggered by build.yml's `org` job) runs every job there, because the
# jobs consume each other's artifacts inside one run, which cannot cross
# repositories. The `relay` job below waits for that run and takes its
# result, so a failure there fails this run too. Any other event runs
# everything here, as now.
name: Hosts

on:
  pull_request:
    paths:
      - 'src/**'
      - 'l10n/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.mjs'
      - 'scripts/package-acp.mjs'
      - 'docs/schemas/**'
      - 'docs/acp.md'
      - 'test/e2e/**'
      - 'test/hosts/**'
      - 'test/integration/**'
      - '.github/workflows/hosts.yml'
  # There is deliberately no `paths:` filter here although the
  # `pull_request` trigger above has one: GitHub evaluates a push filter
  # against the push's own incremental diff, while the `pull_request` filter
  # sees the pull request's cumulative paths, so filtering here would skip
  # the capacity run whenever the latest force-push touches only an unrelated
  # file — and the `relay` job below would then pass with no Hosts run
  # anywhere (PR218FIX3). Every push starts this workflow; the `route` job's
  # `touches` output re-applies the path list instead: the cumulative merge
  # diff for a `ci/pr-*` push, the push's own commits for a `main` push (what
  # the removed filter did there).
  push:
    branches: [main, ci/pr-*]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Where this run's jobs belong (D122, CISHARDS2): the same split as
  # ci.yml's `route`, fast tier included. A same-repository pull request
  # while ORG_CI is on and the capacity app's key reaches the run is `home`
  # (every job below is skipped here and runs in the capacity run); a
  # `ci/pr-<number>` push in the capacity repository is `org`; anything else
  # is `all` (every job runs here, as before). Unlike ci.yml, a push outside
  # `ci/pr-*` is `all`, not an error: the lead's pushes to the capacity
  # `main` are ordinary pushes.
  route:
    name: route
    # A push to `main` runs here too (PR218FIX3): the removed push `paths:`
    # filter's replacement, `touches` below, is computed in this job. Any
    # other push outside the capacity repository still skips it — nothing
    # pushes `ci/pr-*` here.
    if: ${{ github.event_name != 'push' || github.repository == 'scnetsolutions/muse-spark-code-ci' || github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      part: ${{ steps.pick.outputs.part }}
      touches: ${{ steps.touches.outputs.touches }}
    steps:
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ORG_CI: ${{ vars.ORG_CI }}
          FAST: ${{ github.event_name == 'pull_request' && vars.CI_MERGE_QUEUE == 'on' }}
          # GitHub passes no Actions secret to a fork's or Dependabot's run,
          # so this is false there whatever ORG_CI says.
          HAS_KEY: ${{ secrets.ORG_CI_APP_PRIVATE_KEY != '' }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            if [[ "$REF" =~ ^ci/pr-[0-9]+$ ]]; then
              part=org
              why="the merge commit of pull request #${REF#ci/pr-}"
            else
              part=all
              why="a push outside ci/pr-<number> keeps every job here"
            fi
          elif [ "$EVENT" != pull_request ]; then
            part=all
            why="a $EVENT run keeps every job here"
          elif [ "$ORG_CI" != on ]; then
            part=all
            why="ORG_CI is not on"
          elif [ "$FAST" = true ]; then
            part=all
            why="the fast tier runs Ubuntu only and pushes no capacity branch, so every job stays here"
          elif [ "$SAME_REPO" != true ] || [ "$HAS_KEY" != true ]; then
            part=all
            why="no capacity app key reaches this run: a fork, Dependabot, or ORG_CI_APP_PRIVATE_KEY unset"
          else
            part=home
            why="every job runs in scnetsolutions/muse-spark-code-ci"
          fi
          echo "part=$part" >> "$GITHUB_OUTPUT"
          echo "This run's part: $part ($why)"
      # The path gate for pushes (see the `push` trigger above). A `ci/pr-*`
      # push (`part == 'org'`) diffs the pushed merge commit against its
      # first parent (main as the merge saw it — the same `$GITHUB_SHA^1`
      # build.yml's `org` job pushes as `ci/base`), which is the pull
      # request's cumulative paths however small the force-push diff was. A
      # `main` push diffs the push's own commits (`before` to `HEAD`), which
      # is what the removed push `paths:` filter did there. The pattern list
      # mirrors the `pull_request` `paths:` above; keep them in sync. Any
      # other run keeps `touches` true: its own trigger already decided. A
      # non-merge capacity tip, a missing base or a diff error fails closed
      # to true (run the jobs) with a warning, never to a skipped gate.
      # Depth 2 is the tip plus its parents: every merge push's base is in
      # it, and a `main` push older than that runs everything instead.
      - name: history for the path gate
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: touches
        shell: bash
        env:
          PART: ${{ steps.pick.outputs.part }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          touches=true
          why="this event's own trigger already decided"
          diff_base=
          diff_scope=
          if [ "$PART" = org ] && [ "$EVENT" = push ]; then
            diff_scope='the cumulative merge diff'
            if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
              diff_base=HEAD^1
            else
              echo '::warning::the capacity tip is not a merge commit, running the jobs'
            fi
          elif [ "$EVENT" = push ]; then
            diff_scope="the push's own commits"
            diff_base="$BEFORE"
          fi
          if [ -n "$diff_base" ]; then
            if git rev-parse --verify --quiet "$diff_base" >/dev/null; then
              code=0
              git diff --quiet "$diff_base" HEAD -- \
                'src/**' \
                'l10n/**' \
                'package.json' \
                'package-lock.json' \
                'scripts/build.mjs' \
                'scripts/package-acp.mjs' \
                'docs/schemas/**' \
                'docs/acp.md' \
                'test/e2e/**' \
                'test/hosts/**' \
                'test/integration/**' \
                '.github/workflows/hosts.yml' || code=$?
              if [ "$code" -eq 0 ]; then
                touches=false
                why="$diff_scope touches none of these paths"
              elif [ "$code" -eq 1 ]; then
                touches=true
                why="$diff_scope touches these paths"
              else
                echo "::warning::the $diff_scope diff failed (exit $code), running the jobs"
                why="$diff_scope diff errored"
              fi
            else
              echo "::warning::cannot read the $diff_scope base, running the jobs"
              why="$diff_scope base is missing"
            fi
          fi
          echo "touches=$touches" >> "$GITHUB_OUTPUT"
          echo "Touches these paths: $touches ($why)"

  native-helpers:
    name: package helper (${{ matrix.platform }})
    # The whole workflow moves at once (see above): skipped only in `home`.
    # A skipped `route` (a push outside `main` here, which nothing makes)
    # leaves `part` empty and the job runs here: `!cancelled()` keeps GitHub
    # from adding its implicit `success()` over `needs`, which a skipped
    # `route` would fail. `touches != 'false'` (not `== 'true'`) keeps that
    # fallback: a push whose diff misses these paths skips the jobs, while a
    # skipped `route` leaves it empty, which still runs.
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.part != 'home' && needs.route.outputs.touches != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - platform: darwin
            os: macos-latest
            artifact: muse-dictate-darwin
            path: |
              native/darwin/muse-dictate
              native/darwin/muse-dictate-screen.tgz
          - platform: linux-x64
            os: ubuntu-24.04
            arch: x64
            artifact: muse-created-linux-x64
            path: native/linux/x64/muse-created
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            artifact: muse-created-linux-arm64
            path: native/linux/arm64/muse-created
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - if: matrix.platform == 'darwin'
        run: bash native/darwin/build.sh
      # Archive on macOS: artifact upload otherwise discards executable modes.
      - if: matrix.platform == 'darwin'
        run: tar -czf native/darwin/muse-dictate-screen.tgz -C native/darwin muse-dictate-screen.app
      - if: matrix.platform != 'darwin'
        run: |
          sudo apt-get update && sudo apt-get install -y libssl-dev
          node --input-type=module -e "import { buildLinuxHelper } from './scripts/build-linux-helper.mjs'; import { buildVaultPeer } from './scripts/build-vault-peer.mjs'; buildLinuxHelper(); buildVaultPeer()"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
      # The vault peer the ACP packager requires beside muse-created, as in build.yml.
      - if: matrix.platform != 'darwin'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-vault-peer-linux-${{ matrix.arch }}
          path: native/linux/${{ matrix.arch }}/muse-vault-peer
          if-no-files-found: error
      # M109: the vault helper the packagers require beside the dictation helper.
      - if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-vault-darwin
          path: dist/native/darwin/muse-vault
          if-no-files-found: error

  # The agent's npm package from one production build (the .vsix packs
  # beside it), with every native helper the packagers require (M107) from
  # native-helpers.
  packages:
    name: packages
    needs: [native-helpers, route]
    # `!cancelled()` drops the implicit `success()` (see native-helpers), so
    # the predecessor's success is required explicitly.
    if: ${{ !cancelled() && needs.native-helpers.result == 'success' && needs.route.outputs.part != 'home' && needs.route.outputs.touches != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-dictate-darwin
          path: native/darwin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-created-linux-x64
          path: native/linux/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-created-linux-arm64
          path: native/linux/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-vault-peer-linux-x64
          path: native/linux/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-vault-peer-linux-arm64
          path: native/linux/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-vault-darwin
          path: dist/native/darwin
      - run: chmod +x native/darwin/muse-dictate native/linux/x64/muse-created native/linux/arm64/muse-created dist/native/darwin/muse-vault
      - run: chmod +x native/linux/x64/muse-vault-peer native/linux/arm64/muse-vault-peer
      - run: tar -xzf native/darwin/muse-dictate-screen.tgz -C native/darwin
      - run: npm run package
        env:
          # The packaged-README badge check lists public main (GitHub API).
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/package-acp.mjs
        env:
          # The packaged-README badge check lists public main (GitHub API).
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosts-acp
          path: dist/muse-spark-code-acp-*.tgz
          if-no-files-found: error

  # The agent as npm installs it, on each platform: its headless help and
  # trust refusal, then the key's round trip through the platform's
  # credential store (D61) with its own native keyring binding.
  agent:
    name: agent package (${{ matrix.os }})
    needs: [packages, route]
    if: ${{ !cancelled() && needs.packages.result == 'success' && needs.route.outputs.part != 'home' && needs.route.outputs.touches != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hosts-acp
          path: hosts-acp
      - run: npm install --global ./hosts-acp/muse-spark-code-acp-*.tgz
      - name: installed headless help and trust refusal
        run: sh test/hosts/exec.sh "$(npm root --global)/muse-spark-code-acp"
      - name: the key through the Secret Service (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnome-keyring
          dbus-run-session -- sh -c "printf 'ci\n' | gnome-keyring-daemon --unlock --components=secrets > /dev/null && sh test/hosts/keystore.sh muse-spark-code-acp"
      # A keychain of the job's own, unlocked, as the default: the runner's
      # login keychain would ask a person to unlock it.
      - name: the key through the Keychain (macos)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci hosts.keychain
          security list-keychains -d user -s hosts.keychain login.keychain
          security default-keychain -d user -s hosts.keychain
          security unlock-keychain -p ci hosts.keychain
          security set-keychain-settings hosts.keychain
          sh test/hosts/keystore.sh muse-spark-code-acp
      - name: the key through Credential Manager (windows)
        if: runner.os == 'Windows'
        run: |
          sh test/hosts/keystore.sh muse-spark-code-acp

  # The integration tests in VSCodium: the floor's release and the latest.
  vscodium:
    name: VSCodium ${{ matrix.release }}
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.part != 'home' && needs.route.outputs.touches != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        release: ['1.99.32846', latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:dev
      - run: xvfb-run -a sh test/hosts/run-vscodium.sh "${{ matrix.release }}" "$RUNNER_TEMP/vscodium"

  # D122, CISHARDS2: in a `home` run every job above is skipped here and runs
  # in the capacity repository, so this job waits for that repository's run
  # of this same workflow on the pushed merge commit and takes its result: a
  # failure or cancellation there fails this run. The push itself is made by
  # build.yml's `org` job, which queues independently of this relay — so the
  # wait has two phases. First the `ci/pr-<number>` branch must reach this
  # commit: that phase is bounded only by this job's timeout, so a pull
  # request whose producer is still queued never goes falsely red (PR218W2).
  # Then the run has ten minutes to appear from the landed push, as in
  # build.yml's capacity waiter: a landed push with no run means the push or
  # Actions there failed, and the job fails closed. Every `ci/pr-*` push
  # starts a capacity run (the `push` trigger above has no path filter;
  # PR218FIX3). 360 is GitHub's own job ceiling on hosted runners
  # (actions/reference/limits: "Job execution time ... 6 hours"), not our
  # figure: the wait outlives any supported backlog — queue delays under
  # contention across the offloaded suite's chained stages included — and
  # anything longer fails at the platform's limit instead of ours (PR218W2).
  relay:
    name: capacity Hosts result
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.part == 'home' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CAPACITY: scnetsolutions/muse-spark-code-ci
      WORKFLOW: .github/workflows/hosts.yml
    steps:
      - name: wait for the capacity run and take its result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          branch="ci/pr-$PR_NUMBER"
          errors="$RUNNER_TEMP/capacity-read.err"
          test -n "$PR_NUMBER" || { echo '::error::no pull request number for the capacity branch'; exit 1; }
          while :; do
            if sha=$(gh api "repos/$CAPACITY/commits/$branch" --jq '.sha' 2> "$errors"); then
              if [ "$sha" = "$GITHUB_SHA" ]; then
                echo "push landed: $branch is $GITHUB_SHA"
                break
              fi
              echo "$branch is $sha, waiting for it to reach $GITHUB_SHA"
            else
              echo "waiting for the push of $GITHUB_SHA to $branch: $(cat "$errors")"
            fi
            sleep 60
          done
          query="repos/$CAPACITY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100"
          select='[.workflow_runs[] | select(.path == env.WORKFLOW)][0] // empty | "\(.id) \(.status) \(.conclusion) \(.html_url)"'
          appear_by=$((SECONDS + 600))
          id=''
          while :; do
            if found=$(gh api "$query" --jq "$select" 2> "$errors"); then
              if [ -n "$found" ]; then
                read -r id status conclusion url <<< "$found"
                [ "$status" = completed ] && break
                echo "$url: $status"
              fi
            else
              echo "::warning::reading $CAPACITY's runs failed: $(cat "$errors")"
            fi
            if [ -z "$id" ] && [ "$SECONDS" -ge "$appear_by" ]; then
              echo "::error::no $WORKFLOW run on $GITHUB_SHA appeared in $CAPACITY within ten minutes of the push"
              {
                echo "### Capacity Hosts: no run"
                echo
                echo "No $WORKFLOW run on this commit appeared in $CAPACITY:"
                echo "the push or Actions there failed."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep 60
          done
          {
            echo "### Capacity Hosts: $conclusion"
            echo
            echo "[$CAPACITY run $id]($url)"
            echo
            echo '| job | result |'
            echo '| --- | --- |'
            gh api "repos/$CAPACITY/actions/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | "| [\(.name)](\(.html_url)) | \(.conclusion) |"' 2> "$errors" ||
              echo "| the job list could not be read: $(cat "$errors") | |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$url concluded $conclusion"
          test "$conclusion" = success
