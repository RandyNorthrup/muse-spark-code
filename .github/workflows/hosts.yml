# PROBE (never merged): test/unit/m114Panel.test.mjs with time stamps on
# hosted macOS, inside the real shard and alone.
# The host checks (PLAN.md M62, M63): the extension in the editors built on
# VS Code, and the ACP agent in the editors that speak ACP, each driven as
# docs/certification/m62.md and m63.md recorded it, against the fake Muse
# Code CLI (no model is called and no real key is used). Each job runs one
# script of test/hosts, the same script a local run uses.
#
# Pull requests and pushes to main that touch the product or these checks,
# every Monday (the hosts' own new releases), and by hand. Every job has a
# timeout and leaves no token in the git config; none pushes.
name: Hosts

on:
  pull_request:
    paths:
      - 'src/**'
      - 'l10n/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.mjs'
      - 'scripts/package-acp.mjs'
      - 'scripts/package-acp-test.mjs'
      - 'docs/schemas/**'
      - 'docs/acp.md'
      - 'test/e2e/**'
      - 'test/hosts/**'
      - 'test/integration/**'
      - '.github/workflows/hosts.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'l10n/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.mjs'
      - 'scripts/package-acp.mjs'
      - 'scripts/package-acp-test.mjs'
      - 'docs/schemas/**'
      - 'docs/acp.md'
      - 'test/e2e/**'
      - 'test/hosts/**'
      - 'test/integration/**'
      - '.github/workflows/hosts.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: probe, shard 6 of 8 as CI runs it (${{ matrix.run }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: unit and process e2e tests, shard 6 of 8
        shell: bash
        run: npx vitest run --coverage --shard=6/8 --reporter=default --reporter=blob --outputFile=blob-reports/shard-6.json

  alone:
    name: probe, the file alone five times (${{ matrix.run }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: the file alone, five fresh processes
        shell: bash
        run: |
          status=0
          for round in 1 2 3 4 5; do
            echo "PROBE ROUND $round"
            npx vitest run --coverage test/unit/m114Panel.test.mjs --reporter=default || status=1
          done
          exit "$status"
