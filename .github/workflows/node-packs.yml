# The toolchain pack build (M110t TP1, PLAN.md D90.27): locks every
# deploy/packs/*.json pin, assembles the Linux layer blobs natively per
# arch, smokes them, scans them, and publishes the signed index the
# node installs from. Weekly on main, or by hand.
#
# The Fulcio identity this workflow signs with is pinned in the node
# (PACKS_SIGN_IDENTITY): this file's name and the main branch are part
# of the trust contract. Rename it and the node refuses the index.
name: Node packs

on:
  schedule:
    - cron: '13 6 * * 4'
  workflow_dispatch:
    inputs:
      pack:
        description: 'One pack to build (default: all fourteen)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: node-packs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        shell: bash
        run: |
          tag="packs-$(date -u +%Y%m%d)-${{ github.run_number }}-${{ github.run_attempt }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

  build:
    name: build (${{ matrix.pack }}, ${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        pack:
          [
            typescript,
            python,
            rust,
            cpp,
            csharp,
            go,
            java,
            shell,
            devops,
            docs,
            mobile,
            makers,
            game,
            crosscutting,
          ]
        arch: [x64, arm64]
    env:
      OUT: ${{ github.workspace }}/pack-build
      TAG: ${{ needs.plan.outputs.tag }}
      PACK: ${{ inputs.pack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Select pack
        id: select
        shell: bash
        run: |
          if [ -n "$PACK" ] && [ "$PACK" != "${{ matrix.pack }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Lock pins
        if: steps.select.outputs.skip != 'true'
        shell: bash
        run: |
          node scripts/build-packs.mjs lock \
            --pack "${{ matrix.pack }}" --arch "${{ matrix.arch }}" --out "$OUT" \
            --with-requires
      - name: Build layer
        if: steps.select.outputs.skip != 'true'
        shell: bash
        run: |
          node scripts/build-packs.mjs build \
            --pack "${{ matrix.pack }}" --arch "${{ matrix.arch }}" --out "$OUT" \
            --with-requires --tag "$TAG" --revision "${{ github.run_number }}" \
            --built-by "pack-ci/${{ github.run_id }}"
      - name: Check built
        id: built
        if: steps.select.outputs.skip != 'true'
        shell: bash
        run: |
          # mobile has no arm64 layer: the skip is the honest answer.
          if [ -f "$OUT/layers/${{ matrix.pack }}-${{ matrix.arch }}.tar.gz" ]; then
            echo "layer=true" >> "$GITHUB_OUTPUT"
          else
            echo "layer=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan layer
        if: steps.built.outputs.layer == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pack-build/layers/${{ matrix.pack }}-${{ matrix.arch }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          scanners: vuln
      - name: Upload layer
        if: steps.select.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layer-${{ matrix.pack }}-${{ matrix.arch }}
          path: |
            pack-build/layers/${{ matrix.pack }}-${{ matrix.arch }}.tar.gz
            pack-build/locks/${{ matrix.pack }}-${{ matrix.arch }}.json
            pack-build/sbom/${{ matrix.pack }}-${{ matrix.arch }}.spdx.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: publish
    needs: [plan, build]
    if: inputs.pack == '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      OUT: ${{ github.workspace }}/pack-build
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: layer-*
          path: pack-artifacts
          merge-multiple: true
      - name: Assemble tree and index
        shell: bash
        run: |
          mkdir -p "$OUT/layers" "$OUT/locks" "$OUT/sbom"
          mv pack-artifacts/*.tar.gz "$OUT/layers/"
          mv pack-artifacts/*.spdx.json "$OUT/sbom/"
          mv pack-artifacts/*.json "$OUT/locks/"
          node scripts/build-packs.mjs index --out "$OUT" \
            --tag "$TAG" --revision "${{ github.run_number }}" \
            --built-by "pack-ci/${{ github.run_id }}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign index
        shell: bash
        run: |
          cosign sign-blob --yes --bundle "$OUT/index.bundle" "$OUT/index.json"
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "Toolchain packs $TAG" \
            --notes "Locked toolchain layers and their signed index (node-packs run ${{ github.run_number }})." \
            "$OUT"/index.json "$OUT"/index.bundle \
            "$OUT"/layers/*.tar.gz "$OUT"/sbom/*.spdx.json

  refresh:
    name: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Report drift
        id: drift
        shell: bash
        run: |
          node scripts/build-packs.mjs refresh | tee refresh.txt
          if grep -q "packs stale" refresh.txt; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
      - name: File drift issue
        if: steps.drift.outputs.stale == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --label packs-drift --state open --json number --jq '.[].number' | head -1)
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file refresh.txt
          else
            gh issue create --title "Pack pins drifted ($(date -u +%Y-%m-%d))" \
              --label packs-drift --body-file refresh.txt
          fi
