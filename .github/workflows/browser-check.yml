# The browser check on the real pinned runtime, on each hosted OS (M81 A1,
# design spec v4 §10). The rigs ran the same captures by hand
# (docs/certification/m81.md); this repeats them on GitHub's throwaway
# runners, and macos-latest (Apple silicon) gives the pinned mac-arm64
# archive its install, launch and restart.
#
# - The runtime is installed by the store itself (dist/browserRuntime.js,
#   consent answered "download"): the pinned archive is downloaded, its
#   length and SHA-256 checked, extracted and verified.
# - The restart capture (scripts/browser-check-restart.mjs) kills the check's
#   own network service mid-page and requires restartObserved, every request
#   through the owned proxy, no challenge at the page and nothing left.
# - The live suite (test/unit/browserCheckLive.test.ts) and the R51 control
#   (test/unit/browserCheckR51.test.ts) must run all of their tests here,
#   none skipped.
# - Ubuntu's default kernel refuses unprivileged user namespaces to an
#   unconfined program, so the browser's sandbox cannot start. Where it does,
#   the capture first requires a closed refusal; then this throwaway runner
#   lifts the restriction for the rest of the job.
#
# No model is called and no secret is used: every page is a local fixture.
# Capacity (D122, CISHARDS2): each capture uploads only its own result
# files, so the run splits by operating system — a routed same-repository
# pull request run keeps the Ubuntu capture here and runs the Windows and
# macOS captures in the capacity repository's `ci/pr-<number>` push run. The
# `relay` job below waits for that run and takes its result, so a failure
# there fails this run too. Any other event runs all three here, as now.
name: Browser check

on:
  pull_request:
    paths:
      - 'src/core/browser/**'
      - 'src/host/browser/**'
      - 'src/shared/browserCheckConstants.ts'
      - 'scripts/browser-check-restart.mjs'
      - 'test/unit/browserCheckLive.test.ts'
      - 'test/unit/browserCheckR51.test.ts'
      - 'test/unit/helpers/browserProcesses.ts'
      - 'test/fixtures/browser-check.html'
      - '.github/workflows/browser-check.yml'
  # Only the capacity repository ever sees this branch (build.yml's `org`
  # job pushes it there); nothing pushes it here. There is deliberately no
  # `paths:` filter here although the `pull_request` trigger above has one:
  # GitHub evaluates a push filter against the push's own incremental diff,
  # while the `pull_request` filter sees the pull request's cumulative
  # paths, so filtering here would skip the capacity run whenever the latest
  # force-push touches only an unrelated file — and the `relay` job below
  # would then pass with no capture run anywhere (PR218FIX3). Every capacity
  # push starts this workflow; the `route` job's `touches` output re-applies
  # the path list to the cumulative merge diff instead.
  push:
    branches: [ci/pr-*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Where this run's captures belong (D122, CISHARDS2): the same split
  # as hosts.yml's `route`, fast tier included. A push outside `ci/pr-*` is
  # `all`, not an error.
  route:
    name: route
    if: ${{ github.event_name != 'push' || github.repository == 'scnetsolutions/muse-spark-code-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      part: ${{ steps.pick.outputs.part }}
      touches: ${{ steps.touches.outputs.touches }}
    steps:
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ORG_CI: ${{ vars.ORG_CI }}
          FAST: ${{ github.event_name == 'pull_request' && vars.CI_MERGE_QUEUE == 'on' }}
          # GitHub passes no Actions secret to a fork's or Dependabot's run,
          # so this is false there whatever ORG_CI says.
          HAS_KEY: ${{ secrets.ORG_CI_APP_PRIVATE_KEY != '' }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            if [[ "$REF" =~ ^ci/pr-[0-9]+$ ]]; then
              part=org
              why="the merge commit of pull request #${REF#ci/pr-}"
            else
              part=all
              why="a push outside ci/pr-<number> keeps every job here"
            fi
          elif [ "$EVENT" != pull_request ]; then
            part=all
            why="a $EVENT run keeps every job here"
          elif [ "$ORG_CI" != on ]; then
            part=all
            why="ORG_CI is not on"
          elif [ "$FAST" = true ]; then
            part=all
            why="the fast tier pushes no capacity branch, so every capture stays here"
          elif [ "$SAME_REPO" != true ] || [ "$HAS_KEY" != true ]; then
            part=all
            why="no capacity app key reaches this run: a fork, Dependabot, or ORG_CI_APP_PRIVATE_KEY unset"
          else
            part=home
            why="the Windows and macOS captures run in scnetsolutions/muse-spark-code-ci"
          fi
          echo "part=$part" >> "$GITHUB_OUTPUT"
          echo "This run's part: $part ($why)"
      # The path gate for capacity pushes (see the `push` trigger above):
      # `part == 'org'` diffs the pushed merge commit against its first
      # parent (main as the merge saw it — the same `$GITHUB_SHA^1`
      # build.yml's `org` job pushes as `ci/base`), which is the pull
      # request's cumulative paths however small the force-push diff was.
      # The pattern list mirrors the `pull_request` `paths:` above; keep
      # them in sync. Any other run keeps `touches` true: its own trigger
      # already decided. A non-merge tip, a missing parent or a diff error
      # fails closed to true (run the captures) with a warning, never to a
      # skipped gate. Depth 2 is the tip plus its parents, all this diff
      # reads.
      - name: history for the path gate
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: touches
        shell: bash
        env:
          PART: ${{ steps.pick.outputs.part }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$PART" = org ] && [ "$EVENT" = push ]; then
            if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
              code=0
              git diff --quiet HEAD^1 HEAD -- \
                'src/core/browser/**' \
                'src/host/browser/**' \
                'src/shared/browserCheckConstants.ts' \
                'scripts/browser-check-restart.mjs' \
                'test/unit/browserCheckLive.test.ts' \
                'test/unit/browserCheckR51.test.ts' \
                'test/unit/helpers/browserProcesses.ts' \
                'test/fixtures/browser-check.html' \
                '.github/workflows/browser-check.yml' || code=$?
              if [ "$code" -eq 0 ]; then
                touches=false
                why='the cumulative merge diff touches none of these paths'
              elif [ "$code" -eq 1 ]; then
                touches=true
                why='the cumulative merge diff touches these paths'
              else
                echo "::warning::the cumulative diff failed (exit $code), running the captures"
                touches=true
                why='the cumulative diff errored'
              fi
            else
              echo '::warning::the capacity tip is not a merge commit, running the captures'
              touches=true
              why='HEAD^2 is missing'
            fi
          else
            touches=true
            why="this event's own trigger already decided"
          fi
          echo "touches=$touches" >> "$GITHUB_OUTPUT"
          echo "Touches these paths: $touches ($why)"

  captures:
    name: captures (${{ matrix.os }})
    needs: route
    # `!cancelled()` keeps GitHub from adding its implicit `success()` over
    # `needs`: when `route` itself is skipped, `part` is empty and every
    # capture runs here (the matrix below), instead of the job being skipped
    # with its skipped need. A failed `route` still holds the captures back.
    # `touches != 'false'` (not `== 'true'`) keeps that fallback: an `org`
    # run whose cumulative diff misses these paths skips the captures, while
    # a skipped `route` leaves it empty, which still runs.
    if: ${{ !cancelled() && needs.route.result != 'failure' && needs.route.outputs.touches != 'false' }}
    # Larger runner (CISHARDS2): the Windows capture measured 3.1 min, over
    # the 2.9 min longest shard; the macOS capture (2.4 min) stays standard.
    # The larger label applies only in the capacity run while its
    # `LARGE_RUNNERS` variable is `on`.
    runs-on: ${{ needs.route.outputs.part == 'org' && vars.LARGE_RUNNERS == 'on' && matrix.os == 'windows-latest' && 'msc-windows-8core' || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A `home` run keeps only the Ubuntu capture here; the capacity run
        # (`org`) takes Windows and macOS. When `route` itself is skipped,
        # `part` is empty and every capture runs here.
        os: ${{ fromJSON(needs.route.outputs.part == 'home' && '["ubuntu-latest"]' || needs.route.outputs.part == 'org' && '["windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - name: the runtime's storage folder
        shell: bash
        run: echo "MUSE_TEST_BROWSER_STORAGE=$RUNNER_TEMP/muse-browser-storage" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Linux user-namespace restriction
        id: userns
        if: runner.os == 'Linux'
        shell: bash
        run: |
          value=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)
          echo "kernel.apparmor_restrict_unprivileged_userns = $value"
          echo "restricted=$([ "$value" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: restricted kernel, the check refuses closed
        if: steps.userns.outputs.restricted == 'true'
        shell: bash
        run: node scripts/browser-check-restart.mjs dist "$MUSE_TEST_BROWSER_STORAGE" closed | tee restricted.json

      - name: lift the restriction on this throwaway runner
        if: steps.userns.outputs.restricted == 'true'
        shell: bash
        run: |
          # The guard below is deliberately "not (A and B)": either test is a
          # [ ] comparison, which fails only when its condition is false, so
          # the brace group runs exactly when this is not a GitHub-hosted
          # runner. There is no third state for C to leak into.
          # shellcheck disable=SC2015
          [ "$GITHUB_ACTIONS" = true ] && [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "not a GitHub-hosted runner"; exit 1; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: forced network-service restart
        shell: bash
        run: node scripts/browser-check-restart.mjs dist "$MUSE_TEST_BROWSER_STORAGE" | tee restart.json

      - name: live suite and R51 on the pinned runtime
        shell: bash
        run: |
          npx vitest run test/unit/browserCheckLive.test.ts test/unit/browserCheckR51.test.ts --coverage.enabled=false --reporter=default --reporter=json --outputFile.json=live.json
          node -e "const r = require('./live.json'); console.log(r.numPassedTests + ' passed, ' + r.numPendingTests + ' skipped, ' + r.numFailedTests + ' failed'); process.exit(r.numPassedTests > 0 && r.numPendingTests === 0 && r.numTodoTests === 0 && r.numFailedTests === 0 ? 0 : 1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-check-${{ matrix.os }}
          path: |
            restricted.json
            restart.json
            live.json
          if-no-files-found: ignore
          retention-days: 14

  # D122, CISHARDS2: in a `home` run only the Ubuntu capture above runs here
  # while Windows and macOS run in the capacity repository, so this job waits
  # for that repository's run of this same workflow on the pushed merge commit
  # and takes its result: a failure or cancellation there fails this run. The
  # push itself is made by build.yml's `org` job, which queues independently
  # of this relay — so the wait has two phases. First the `ci/pr-<number>`
  # branch must reach this commit: that phase is bounded only by this job's
  # timeout, so a pull request whose producer is still queued never goes
  # falsely red (PR218W2). Then the run has ten minutes to appear from the
  # landed push, as in build.yml's capacity waiter: a landed push with no run
  # means the push or Actions there failed, and the job fails closed. Every
  # `ci/pr-*` push starts a capacity run (the `push` trigger above has no path
  # filter; PR218FIX3). 360 is GitHub's own job ceiling on hosted runners
  # (actions/reference/limits: "Job execution time ... 6 hours"), not our
  # figure: the wait outlives any supported backlog under contention, and
  # anything longer fails at the platform's limit instead of ours (PR218W2).
  relay:
    name: capacity browser captures result
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.part == 'home' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CAPACITY: scnetsolutions/muse-spark-code-ci
      WORKFLOW: .github/workflows/browser-check.yml
    steps:
      - name: wait for the capacity run and take its result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          branch="ci/pr-$PR_NUMBER"
          errors="$RUNNER_TEMP/capacity-read.err"
          test -n "$PR_NUMBER" || { echo '::error::no pull request number for the capacity branch'; exit 1; }
          while :; do
            if sha=$(gh api "repos/$CAPACITY/commits/$branch" --jq '.sha' 2> "$errors"); then
              if [ "$sha" = "$GITHUB_SHA" ]; then
                echo "push landed: $branch is $GITHUB_SHA"
                break
              fi
              echo "$branch is $sha, waiting for it to reach $GITHUB_SHA"
            else
              echo "waiting for the push of $GITHUB_SHA to $branch: $(cat "$errors")"
            fi
            sleep 60
          done
          query="repos/$CAPACITY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100"
          select='[.workflow_runs[] | select(.path == env.WORKFLOW)][0] // empty | "\(.id) \(.status) \(.conclusion) \(.html_url)"'
          appear_by=$((SECONDS + 600))
          id=''
          while :; do
            if found=$(gh api "$query" --jq "$select" 2> "$errors"); then
              if [ -n "$found" ]; then
                read -r id status conclusion url <<< "$found"
                [ "$status" = completed ] && break
                echo "$url: $status"
              fi
            else
              echo "::warning::reading $CAPACITY's runs failed: $(cat "$errors")"
            fi
            if [ -z "$id" ] && [ "$SECONDS" -ge "$appear_by" ]; then
              echo "::error::no $WORKFLOW run on $GITHUB_SHA appeared in $CAPACITY within ten minutes of the push"
              {
                echo "### Capacity browser captures: no run"
                echo
                echo "No $WORKFLOW run on this commit appeared in $CAPACITY:"
                echo "the push or Actions there failed."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep 60
          done
          {
            echo "### Capacity browser captures: $conclusion"
            echo
            echo "[$CAPACITY run $id]($url)"
            echo
            echo '| job | result |'
            echo '| --- | --- |'
            gh api "repos/$CAPACITY/actions/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | "| [\(.name)](\(.html_url)) | \(.conclusion) |"' 2> "$errors" ||
              echo "| the job list could not be read: $(cat "$errors") | |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$url concluded $conclusion"
          test "$conclusion" = success
