# PyPI Trusted Publishing: configure this repository/workflow in PyPI.
# Build runs without the publish environment or OIDC permission.
name: Publish Thonny plugin

on:
  push:
    tags: ['thonny-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-thonny-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag names the package version
        shell: bash
        run: |
          version="$(python -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('integrations/thonny/pyproject.toml').read(), re.M).group(1))")"
          if [ "thonny-v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match thonny-muse-spark version ${version}" >&2
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: |
          python -m pip install --upgrade pip build pytest twine
          python -m pytest integrations/thonny
          python -m build --outdir dist/thonny integrations/thonny
          twine check dist/thonny/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thonny-dist
          path: dist/thonny/*
          retention-days: 30

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/thonny-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thonny-dist
          path: dist/thonny
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: install the trusted-publishing uploader
        run: python -m pip install twine==6.2.0
      - name: upload using PyPI Trusted Publishing (OIDC only)
        run: python -m twine upload --non-interactive --trusted-publishing always dist/thonny/*
