# The Thonny plugin's PyPI release job (M103 lane T, Q-M103h).
#
# The publishing account and its token are the owner's: this job publishes
# only when the `pypi` environment holds a `PYPI_API_TOKEN` secret, and it
# never runs for lane T itself (no tag is pushed here). A `thonny-vX.Y.Z`
# tag must name the version in `integrations/thonny/pyproject.toml`.
#
# The token reaches exactly one step (`twine upload`), through the
# environment, never an argument or a file. Without the secret the job
# reports the skip and stops before the upload.
name: Publish Thonny plugin

on:
  push:
    tags: ['thonny-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-thonny-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag names the package version
        shell: bash
        run: |
          version="$(python -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('integrations/thonny/pyproject.toml').read(), re.M).group(1))")"
          if [ "thonny-v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match thonny-muse-spark version ${version}" >&2
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: |
          python -m pip install --upgrade pip build pytest twine
          python -m pytest integrations/thonny
          python -m build --outdir dist/thonny integrations/thonny
          twine check dist/thonny/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thonny-dist
          path: dist/thonny/*
          retention-days: 30

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/thonny-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    steps:
      - uses: actions/download-artifact@37947653afb6fcac8a2ba35b558e9c0de8f242b082cab # v7.0.1
        with:
          name: thonny-dist
          path: dist/thonny
      - name: owner's token present
        id: token
        env:
          HAS_PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: echo "present=${HAS_PYPI_API_TOKEN}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          python-version: '3.14'
      - name: twine upload (owner's token, this step only)
        if: steps.token.outputs.present == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip twine
          twine upload --non-interactive dist/thonny/*
      - name: no token, no publish
        if: steps.token.outputs.present != 'true'
        run: echo "PYPI_API_TOKEN is not set in the pypi environment; the distribution was built and kept as an artifact, nothing was published."
