# The VS Code forks that ship Linux builds (PLAN.md M62b): Cursor, Devin
# Desktop (Windsurf until 2026), Kiro and Positron, each at its latest
# release from its own update feed (test/hosts/fork-release.mjs). Each job
# installs the .vsix with the fork's CLI and runs the integration tests in
# the fork; the job summary names the fork's version and its VS Code base.
#
# Apart from hosts.yml because these are the forks' latest builds, not
# pinned ones, and their feeds can change without notice: every Monday, by
# hand, and on pull requests that change this check. Every job has a
# timeout and leaves no token in the git config; none pushes.
# Capacity (D122, CISHARDS2): like hosts.yml, the whole workflow moves — a
# routed same-repository pull request run skips every job here, and the
# capacity repository's `ci/pr-<number>` push run runs every job there. The
# `relay` job below waits for that run and takes its result, so a failure
# there fails this run too. Any other event runs everything here, as now.
name: Forks

on:
  pull_request:
    paths:
      - 'test/hosts/fork-release.mjs'
      - 'test/hosts/installed.vscode-test.mjs'
      - 'test/hosts/run-fork.sh'
      - '.github/workflows/forks.yml'
  # Only the capacity repository ever sees this branch (build.yml's `org`
  # job pushes it there); nothing pushes it here. There is deliberately no
  # `paths:` filter here although the `pull_request` trigger above has one:
  # GitHub evaluates a push filter against the push's own incremental diff,
  # while the `pull_request` filter sees the pull request's cumulative
  # paths, so filtering here would skip the capacity run whenever the latest
  # force-push touches only an unrelated file — and the `relay` job below
  # would then pass with no fork run anywhere (PR218FIX3). Every capacity
  # push starts this workflow; the `route` job's `touches` output re-applies
  # the path list to the cumulative merge diff instead.
  push:
    branches: [ci/pr-*]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Where this run's jobs belong (D122, CISHARDS2): the same split as
  # hosts.yml's `route`, fast tier included. A push outside `ci/pr-*` is
  # `all`, not an error.
  route:
    name: route
    if: ${{ github.event_name != 'push' || github.repository == 'scnetsolutions/muse-spark-code-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      part: ${{ steps.pick.outputs.part }}
      touches: ${{ steps.touches.outputs.touches }}
    steps:
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ORG_CI: ${{ vars.ORG_CI }}
          FAST: ${{ github.event_name == 'pull_request' && vars.CI_MERGE_QUEUE == 'on' }}
          # GitHub passes no Actions secret to a fork's or Dependabot's run,
          # so this is false there whatever ORG_CI says.
          HAS_KEY: ${{ secrets.ORG_CI_APP_PRIVATE_KEY != '' }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            if [[ "$REF" =~ ^ci/pr-[0-9]+$ ]]; then
              part=org
              why="the merge commit of pull request #${REF#ci/pr-}"
            else
              part=all
              why="a push outside ci/pr-<number> keeps every job here"
            fi
          elif [ "$EVENT" != pull_request ]; then
            part=all
            why="a $EVENT run keeps every job here"
          elif [ "$ORG_CI" != on ]; then
            part=all
            why="ORG_CI is not on"
          elif [ "$FAST" = true ]; then
            part=all
            why="the fast tier runs Ubuntu only and pushes no capacity branch, so every job stays here"
          elif [ "$SAME_REPO" != true ] || [ "$HAS_KEY" != true ]; then
            part=all
            why="no capacity app key reaches this run: a fork, Dependabot, or ORG_CI_APP_PRIVATE_KEY unset"
          else
            part=home
            why="every job runs in scnetsolutions/muse-spark-code-ci"
          fi
          echo "part=$part" >> "$GITHUB_OUTPUT"
          echo "This run's part: $part ($why)"
      # The path gate for capacity pushes (see the `push` trigger above):
      # `part == 'org'` diffs the pushed merge commit against its first
      # parent (main as the merge saw it — the same `$GITHUB_SHA^1`
      # build.yml's `org` job pushes as `ci/base`), which is the pull
      # request's cumulative paths however small the force-push diff was.
      # The pattern list mirrors the `pull_request` `paths:` above; keep
      # them in sync. Any other run keeps `touches` true: its own trigger
      # already decided. A non-merge tip, a missing parent or a diff error
      # fails closed to true (run the jobs) with a warning, never to a
      # skipped gate. Depth 2 is the tip plus its parents, all this diff
      # reads.
      - name: history for the path gate
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: touches
        shell: bash
        env:
          PART: ${{ steps.pick.outputs.part }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$PART" = org ] && [ "$EVENT" = push ]; then
            if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
              code=0
              git diff --quiet HEAD^1 HEAD -- \
                'test/hosts/fork-release.mjs' \
                'test/hosts/installed.vscode-test.mjs' \
                'test/hosts/run-fork.sh' \
                '.github/workflows/forks.yml' || code=$?
              if [ "$code" -eq 0 ]; then
                touches=false
                why='the cumulative merge diff touches none of these paths'
              elif [ "$code" -eq 1 ]; then
                touches=true
                why='the cumulative merge diff touches these paths'
              else
                echo "::warning::the cumulative diff failed (exit $code), running the jobs"
                touches=true
                why='the cumulative diff errored'
              fi
            else
              echo '::warning::the capacity tip is not a merge commit, running the jobs'
              touches=true
              why='HEAD^2 is missing'
            fi
          else
            touches=true
            why="this event's own trigger already decided"
          fi
          echo "touches=$touches" >> "$GITHUB_OUTPUT"
          echo "Touches these paths: $touches ($why)"

  native-helpers:
    name: package helper (${{ matrix.platform }})
    # The whole workflow moves at once (see above): skipped only in `home`.
    # When `route` itself is skipped, `part` is empty and the job runs here:
    # `!cancelled()` keeps GitHub from adding its implicit `success()` over
    # `needs`, which a skipped `route` would fail. `touches != 'false'`
    # (not `== 'true'`) keeps that fallback: an `org` run whose cumulative
    # diff misses these paths skips the jobs, while a skipped `route`
    # leaves it empty, which still runs.
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.part != 'home' && needs.route.outputs.touches != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - platform: darwin
            os: macos-latest
            artifact: muse-dictate-darwin
            path: |
              native/darwin/muse-dictate
              native/darwin/muse-dictate-screen.tgz
          - platform: linux-x64
            os: ubuntu-24.04
            arch: x64
            artifact: muse-created-linux-x64
            path: native/linux/x64/muse-created
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            artifact: muse-created-linux-arm64
            path: native/linux/arm64/muse-created
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: matrix.platform == 'darwin'
        run: bash native/darwin/build.sh
      # Archive on macOS: artifact upload otherwise discards executable modes.
      - if: matrix.platform == 'darwin'
        run: tar -czf native/darwin/muse-dictate-screen.tgz -C native/darwin muse-dictate-screen.app
      - if: matrix.platform != 'darwin'
        run: |
          sudo apt-get update && sudo apt-get install -y libssl-dev
          node --input-type=module -e "import { buildLinuxHelper } from './scripts/build-linux-helper.mjs'; import { buildVaultPeer } from './scripts/build-vault-peer.mjs'; buildLinuxHelper(); buildVaultPeer()"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
      # The vault peer the packagers require beside muse-created, as in build.yml.
      - if: matrix.platform != 'darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muse-vault-peer-linux-${{ matrix.arch }}
          path: native/linux/${{ matrix.arch }}/muse-vault-peer
          if-no-files-found: error
      # M109: the vault helper the packagers require beside the dictation helper.
      - if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muse-vault-darwin
          path: dist/native/darwin/muse-vault
          if-no-files-found: error

  vsix:
    name: vsix
    needs: [native-helpers, route]
    # `!cancelled()` drops the implicit `success()` (see native-helpers), so
    # the predecessor's success is required explicitly.
    if: ${{ !cancelled() && needs.native-helpers.result == 'success' && needs.route.outputs.part != 'home' && needs.route.outputs.touches != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-dictate-darwin
          path: native/darwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-created-linux-x64
          path: native/linux/x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-created-linux-arm64
          path: native/linux/arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-vault-peer-linux-x64
          path: native/linux/x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-vault-peer-linux-arm64
          path: native/linux/arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-vault-darwin
          path: dist/native/darwin
      - run: chmod +x native/darwin/muse-dictate native/linux/x64/muse-created native/linux/arm64/muse-created dist/native/darwin/muse-vault
      - run: chmod +x native/linux/x64/muse-vault-peer native/linux/arm64/muse-vault-peer
      - run: tar -xzf native/darwin/muse-dictate-screen.tgz -C native/darwin
      # The .vsix recompressor needs the pinned Zopfli (VSIXFIT B): without
      # it packaging fails rather than falling back to zlib level 9.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r .github/vsix-compress/requirements.txt
      # One package per platform, no universal package (PLAN.md D209): the
      # forks ship Linux builds, so this proves the Linux x64 target, whose
      # size gate runs inside packaging.
      - run: npm run package -- --target linux-x64
        env:
          # The packaged-README badge check lists public main (GitHub API).
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forks-vsix
          path: '*.vsix'
          if-no-files-found: error

  fork:
    name: ${{ matrix.fork }}
    needs: [vsix, route]
    if: ${{ !cancelled() && needs.vsix.result == 'success' && needs.route.outputs.part != 'home' && needs.route.outputs.touches != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        fork: [cursor, devin-desktop, kiro, positron]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: forks-vsix
          path: forks-vsix
      - name: ${{ matrix.fork }}
        env:
          # Positron's latest release is read from the GitHub API.
          GH_TOKEN: ${{ github.token }}
        run: xvfb-run -a sh test/hosts/run-fork.sh "${{ matrix.fork }}" forks-vsix/*.vsix "$RUNNER_TEMP/fork"

  # D122, CISHARDS2: in a `home` run every job above is skipped here and runs
  # in the capacity repository, so this job waits for that repository's run
  # of this same workflow on the pushed merge commit and takes its result: a
  # failure or cancellation there fails this run. The push itself is made by
  # build.yml's `org` job, which queues independently of this relay — so the
  # wait has two phases. First the `ci/pr-<number>` branch must reach this
  # commit: that phase is bounded only by this job's timeout, so a pull
  # request whose producer is still queued never goes falsely red (PR218W2).
  # Then the run has ten minutes to appear from the landed push, as in
  # build.yml's capacity waiter: a landed push with no run means the push or
  # Actions there failed, and the job fails closed. Every `ci/pr-*` push
  # starts a capacity run (the `push` trigger above has no path filter;
  # PR218FIX3). 360 is GitHub's own job ceiling on hosted runners
  # (actions/reference/limits: "Job execution time ... 6 hours"), not our
  # figure: the wait outlives any supported backlog — queue delays under
  # contention across the offloaded suite's chained stages included — and
  # anything longer fails at the platform's limit instead of ours (PR218W2).
  relay:
    name: capacity Forks result
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.part == 'home' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CAPACITY: scnetsolutions/muse-spark-code-ci
      WORKFLOW: .github/workflows/forks.yml
    steps:
      - name: wait for the capacity run and take its result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          branch="ci/pr-$PR_NUMBER"
          errors="$RUNNER_TEMP/capacity-read.err"
          test -n "$PR_NUMBER" || { echo '::error::no pull request number for the capacity branch'; exit 1; }
          while :; do
            if sha=$(gh api "repos/$CAPACITY/commits/$branch" --jq '.sha' 2> "$errors"); then
              if [ "$sha" = "$GITHUB_SHA" ]; then
                echo "push landed: $branch is $GITHUB_SHA"
                break
              fi
              echo "$branch is $sha, waiting for it to reach $GITHUB_SHA"
            else
              echo "waiting for the push of $GITHUB_SHA to $branch: $(cat "$errors")"
            fi
            sleep 60
          done
          query="repos/$CAPACITY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100"
          select='[.workflow_runs[] | select(.path == env.WORKFLOW)][0] // empty | "\(.id) \(.status) \(.conclusion) \(.html_url)"'
          appear_by=$((SECONDS + 600))
          id=''
          while :; do
            if found=$(gh api "$query" --jq "$select" 2> "$errors"); then
              if [ -n "$found" ]; then
                read -r id status conclusion url <<< "$found"
                [ "$status" = completed ] && break
                echo "$url: $status"
              fi
            else
              echo "::warning::reading $CAPACITY's runs failed: $(cat "$errors")"
            fi
            if [ -z "$id" ] && [ "$SECONDS" -ge "$appear_by" ]; then
              echo "::error::no $WORKFLOW run on $GITHUB_SHA appeared in $CAPACITY within ten minutes of the push"
              {
                echo "### Capacity Forks: no run"
                echo
                echo "No $WORKFLOW run on this commit appeared in $CAPACITY:"
                echo "the push or Actions there failed."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep 60
          done
          {
            echo "### Capacity Forks: $conclusion"
            echo
            echo "[$CAPACITY run $id]($url)"
            echo
            echo '| job | result |'
            echo '| --- | --- |'
            gh api "repos/$CAPACITY/actions/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | "| [\(.name)](\(.html_url)) | \(.conclusion) |"' 2> "$errors" ||
              echo "| the job list could not be read: $(cat "$errors") | |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$url concluded $conclusion"
          test "$conclusion" = success
