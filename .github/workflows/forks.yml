# The VS Code forks that ship Linux builds (PLAN.md M62b): Cursor, Devin
# Desktop (Windsurf until 2026), Kiro and Positron, each at its latest
# release from its own update feed (test/hosts/fork-release.mjs). Each job
# installs the .vsix with the fork's CLI and runs the integration tests in
# the fork; the job summary names the fork's version and its VS Code base.
#
# Apart from hosts.yml because these are the forks' latest builds, not
# pinned ones, and their feeds can change without notice: every Monday, by
# hand, and on pull requests that change this check. Every job has a
# timeout and leaves no token in the git config; none pushes.
# Capacity (D122, CISHARDS2): like hosts.yml, the whole workflow moves — a
# routed same-repository pull request run skips every job here, and the
# capacity repository's `ci/pr-<number>` push run runs every job there. Any
# other event runs everything here, as now.
name: Forks

on:
  pull_request:
    paths:
      - 'test/hosts/fork-release.mjs'
      - 'test/hosts/installed.vscode-test.mjs'
      - 'test/hosts/run-fork.sh'
      - '.github/workflows/forks.yml'
  # Only the capacity repository ever sees this branch (build.yml's `org`
  # job pushes it there); nothing pushes it here.
  push:
    branches: [ci/pr-*]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Where this run's jobs belong (D122, CISHARDS2): the same split as
  # hosts.yml's `route`. A push outside `ci/pr-*` is `all`, not an error.
  route:
    name: route
    if: ${{ github.event_name != 'push' || github.repository == 'scnetsolutions/muse-spark-code-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      part: ${{ steps.pick.outputs.part }}
    steps:
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ORG_CI: ${{ vars.ORG_CI }}
          # GitHub passes no Actions secret to a fork's or Dependabot's run,
          # so this is false there whatever ORG_CI says.
          HAS_KEY: ${{ secrets.ORG_CI_APP_PRIVATE_KEY != '' }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            if [[ "$REF" =~ ^ci/pr-[0-9]+$ ]]; then
              part=org
              why="the merge commit of pull request #${REF#ci/pr-}"
            else
              part=all
              why="a push outside ci/pr-<number> keeps every job here"
            fi
          elif [ "$EVENT" != pull_request ]; then
            part=all
            why="a $EVENT run keeps every job here"
          elif [ "$ORG_CI" != on ]; then
            part=all
            why="ORG_CI is not on"
          elif [ "$SAME_REPO" != true ] || [ "$HAS_KEY" != true ]; then
            part=all
            why="no capacity app key reaches this run: a fork, Dependabot, or ORG_CI_APP_PRIVATE_KEY unset"
          else
            part=home
            why="every job runs in scnetsolutions/muse-spark-code-ci"
          fi
          echo "part=$part" >> "$GITHUB_OUTPUT"
          echo "This run's part: $part ($why)"

  native-helpers:
    name: package helper (${{ matrix.platform }})
    # The whole workflow moves at once (see above): skipped only in `home`.
    # When `route` itself is skipped, `part` is empty and the job runs here:
    # `!cancelled()` keeps GitHub from adding its implicit `success()` over
    # `needs`, which a skipped `route` would fail.
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.part != 'home' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - platform: darwin
            os: macos-latest
            artifact: muse-dictate-darwin
            path: |
              native/darwin/muse-dictate
              native/darwin/muse-dictate-screen.tgz
          - platform: linux-x64
            os: ubuntu-24.04
            artifact: muse-created-linux-x64
            path: native/linux/x64/muse-created
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            artifact: muse-created-linux-arm64
            path: native/linux/arm64/muse-created
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - if: matrix.platform == 'darwin'
        run: bash native/darwin/build.sh
      # Archive on macOS: artifact upload otherwise discards executable modes.
      - if: matrix.platform == 'darwin'
        run: tar -czf native/darwin/muse-dictate-screen.tgz -C native/darwin muse-dictate-screen.app
      - if: matrix.platform != 'darwin'
        run: |
          sudo apt-get update && sudo apt-get install -y libssl-dev
          node --input-type=module -e "import { buildLinuxHelper } from './scripts/build-linux-helper.mjs'; buildLinuxHelper()"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
      # M109: the vault helper the packagers require beside the dictation helper.
      - if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-vault-darwin
          path: dist/native/darwin/muse-vault
          if-no-files-found: error

  vsix:
    name: vsix
    needs: [native-helpers, route]
    # `!cancelled()` drops the implicit `success()` (see native-helpers), so
    # the predecessor's success is required explicitly.
    if: ${{ !cancelled() && needs.native-helpers.result == 'success' && needs.route.outputs.part != 'home' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-dictate-darwin
          path: native/darwin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-created-linux-x64
          path: native/linux/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-created-linux-arm64
          path: native/linux/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-vault-darwin
          path: dist/native/darwin
      - run: chmod +x native/darwin/muse-dictate native/linux/x64/muse-created native/linux/arm64/muse-created dist/native/darwin/muse-vault
      - run: tar -xzf native/darwin/muse-dictate-screen.tgz -C native/darwin
      - run: npm run package
        env:
          # The packaged-README badge check lists public main (GitHub API).
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forks-vsix
          path: '*.vsix'
          if-no-files-found: error

  fork:
    name: ${{ matrix.fork }}
    needs: [vsix, route]
    if: ${{ !cancelled() && needs.vsix.result == 'success' && needs.route.outputs.part != 'home' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        fork: [cursor, devin-desktop, kiro, positron]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forks-vsix
          path: forks-vsix
      - name: ${{ matrix.fork }}
        env:
          # Positron's latest release is read from the GitHub API.
          GH_TOKEN: ${{ github.token }}
        run: xvfb-run -a sh test/hosts/run-fork.sh "${{ matrix.fork }}" forks-vsix/*.vsix "$RUNNER_TEMP/fork"
