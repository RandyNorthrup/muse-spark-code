# The shared build: every quality gate on three platforms, the integration
# tests, the macOS dictation helper, and the .vsix with both helpers as the
# `muse-spark-code-vsix` artifact. Called by ci.yml (pushes and pull
# requests) and release.yml (version tags), so a release is built exactly
# the way CI builds every commit.
name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint:ps (PSScriptAnalyzer over native/windows) is real on this runner
      # and a reported skip elsewhere.
      - name: PSScriptAnalyzer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -AcceptLicense
      # All gates except secrets (separate job) and integration tests (below):
      # format, lint, typecheck, dead code, cycles, duplication, unit tests with
      # coverage thresholds, production build with bundle budget, npm audit.
      - run: npm run quality:gates
      - name: integration tests (linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: integration tests (windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

  # The macOS dictation helper (M9): Apple's Speech framework behind the
  # microphone button. Compiled here because only a Mac can; the package job
  # below ships it in the .vsix.
  native-darwin:
    name: dictation helper (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash native/darwin/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-dictate-darwin
          path: native/darwin/muse-dictate
          if-no-files-found: error

  # The .vsix with both helpers: what release.yml publishes.
  package:
    name: package (.vsix)
    needs: [quality, native-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-dictate-darwin
          path: native/darwin
      - run: chmod +x native/darwin/muse-dictate
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-spark-code-vsix
          path: '*.vsix'
          if-no-files-found: error

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - run: semgrep scan --config auto --error --exclude=dist --exclude=coverage --exclude=node_modules
