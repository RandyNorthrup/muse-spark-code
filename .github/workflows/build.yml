# The shared build (CIFLOW, PLAN.md §7). `fast: true` (ci.yml, pull requests
# once the merge queue is on) runs the Ubuntu static gates, the production
# build and every unit test with no coverage gate; the full tier (merge
# groups, manual runs, release.yml) runs every gate on three platforms, unit
# shards (four on Ubuntu, eight on Windows and macOS), the integration runs,
# the macOS helper and the universal packages. Accessibility left the
# pull-request path: it runs on merge groups, manual runs and releases, never
# on a pull_request event. The required check names come from the `required`
# aggregate below on both tiers.
# Releases can reuse these exact-tree packages after verifying the CI receipt.
#
# Every job has a timeout and every checkout leaves no token in the git
# config (`persist-credentials: false`, M26, PLAN.md D29). One job pushes:
# `org` (D122) sends a pull request's merge commit to the capacity repository
# with a one-hour token of its own that git reads from the step's environment,
# never from its config. Nothing here pushes to this repository.
name: Build

on:
  workflow_call:
    inputs:
      fast:
        description: Ubuntu PR checks; false runs the full merge/release gate
        type: boolean
        default: false
      # Where this run's jobs belong (D122). `all` runs every job of the tier
      # here. `home` runs the Ubuntu unit shards here and the Windows and
      # macOS ones in the capacity repository scnetsolutions/muse-spark-code-ci
      # through the `org` job; `org` (the capacity repository's own run) runs
      # only those shards. Release builds and every caller that passes nothing
      # get `all`.
      part:
        description: all, home or org (D122)
        type: string
        default: all
    secrets:
      # The private key of the capacity repository's GitHub App, read only by
      # the `org` job (D122). Empty for forks, Dependabot and every caller
      # that passes none.
      org-ci-app-private-key:
        description: private key of the GitHub App installed on scnetsolutions/muse-spark-code-ci
        required: false

permissions:
  contents: read

jobs:
  checks:
    name: static gates (${{ matrix.os }}, ${{ matrix.part.name }})
    if: ${{ inputs.part != 'org' }}
    runs-on: ${{ matrix.os }}
    # One serial job outgrew its 25 minutes on macOS (CIFIX017R3, run
    # 37992331755: 21.8 min in round 2, cancelled at 25 in round 3 during
    # check:host-api, no hang): type-aware ESLint alone took 17.7 min there
    # (lint:js:main 7.0, lint:js:unit 10.2) against 6.5 on Ubuntu, and 5.1 GB
    # per ESLint process rules out ESLint's threads on a 7 GB runner. Three
    # parts run every gate on every OS; macOS' slowest measured is ~11 min.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.fast && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
        part:
          - name: lint
            gates: 'format:check lint:js:main lint:js:tests lint:css lint:ps'
          - name: unit lint
            gates: 'lint:js:unit'
          - name: build
            gates: 'typecheck check:badges check:tokens check:l10n check:reference check:host-api check:plan check:roadmap deadcode cycles duplication build security:audit'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint:ps (PSScriptAnalyzer over native/windows) is real on this runner
      # and a reported skip elsewhere. The version is the one lint-ps.mjs
      # pins, so the gate does not change under an unchanged tree. The
      # PowerShell Gallery's search now and then answers "No match was found"
      # (the 0.6.0 release PR's first run; PR #42's, three tries in a row), so
      # a version already on the runner is used as is, then Install-Module is
      # tried twice, and last the package itself is downloaded from the
      # Gallery's package endpoint, checked against the SHA-512 lint-ps.mjs
      # pins, and unpacked into the user's module path. Each failure is named.
      - name: PSScriptAnalyzer (windows, pinned)
        if: runner.os == 'Windows' && matrix.part.name == 'lint'
        shell: pwsh
        run: |
          $version = node scripts/lint-ps.mjs --print-version
          $sha512 = node scripts/lint-ps.mjs --print-sha512
          if (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object { $_.Version -eq [version]$version }) {
            Write-Host "PSScriptAnalyzer $version is already installed"
            exit 0
          }
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            try {
              Install-Module PSScriptAnalyzer -RequiredVersion $version -Force -Scope CurrentUser -AcceptLicense -ErrorAction Stop
              exit 0
            } catch {
              Write-Warning "Install-Module attempt $attempt failed: $_"
              Start-Sleep -Seconds 10
            }
          }
          $package = Join-Path $env:RUNNER_TEMP "PSScriptAnalyzer.$version.nupkg"
          for ($attempt = 1; ; $attempt++) {
            try {
              Invoke-WebRequest "https://www.powershellgallery.com/api/v2/package/PSScriptAnalyzer/$version" -OutFile $package -ErrorAction Stop
              break
            } catch {
              if ($attempt -ge 3) { throw }
              Write-Warning "Package download attempt $attempt failed: $_"
              Start-Sleep -Seconds 10
            }
          }
          $hash = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($package)))
          if ($hash -ne $sha512) { throw "PSScriptAnalyzer $version package hash $hash is not the pinned $sha512" }
          $modules = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\Modules\PSScriptAnalyzer'
          $target = Join-Path $modules $version
          Expand-Archive $package -DestinationPath $target -Force
          Remove-Item -Recurse -Force (Join-Path $target '_rels'), (Join-Path $target 'package') -ErrorAction SilentlyContinue
          Remove-Item -Force -LiteralPath (Join-Path $target '[Content_Types].xml') -ErrorAction SilentlyContinue
          Remove-Item -Force -Path (Join-Path $target '*.nuspec') -ErrorAction SilentlyContinue
          Import-Module PSScriptAnalyzer -RequiredVersion $version -ErrorAction Stop
          Write-Host "PSScriptAnalyzer $version installed from the checked package"
      # Same static/build/audit gates as quality:gates, across the parts; tests
      # have their own required job.
      - run: npx run-s ${{ matrix.part.gates }}
        env:
          # check:badges lists public main through the GitHub API; the job token
          # keeps hosted runners off the shared unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest' && matrix.part.name == 'build' && !inputs.fast
        with:
          name: production-webview
          # The whole production dist, minus the VSIX stage and build metadata:
          # a hand list drifted once (wire.js gained a lazy chunk the list lacked).
          path: |
            dist
            !dist/vsix-package
            !dist/meta
          if-no-files-found: error

  unit:
    name: tests (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # The warm limit stays 20 minutes (the shard history is in the matrix
    # comment below). An `org` run starts cold: a cache restores only from
    # the current or the default branch (the dependency-caching reference),
    # and a capacity branch is neither until the seeded default-branch cache
    # lands (CONTRIBUTING.md, "The capacity repository"). A cold `npm ci` is
    # about a minute (901 packages in 11-12 s from registry.npmjs.org,
    # measured 2026-10-17), so `org` shards get 25: the warm bound plus the
    # cold install and margin, still far under the platform's 6-hour ceiling.
    timeout-minutes: ${{ inputs.part == 'org' && 25 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        # D122: `home` keeps Ubuntu here and `org` runs Windows and macOS in
        # the capacity repository (macOS jobs queue first: five at a time per
        # account, twelve per full run, eight of them these shards).
        os: ${{ fromJSON(inputs.fast && '["ubuntu-latest"]' || inputs.part == 'home' && '["ubuntu-latest"]' || inputs.part == 'org' && '["windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
        shard: ${{ fromJSON(inputs.fast && '[1]' || '[1,2,3,4,5,6,7,8]') }}
        # Windows splits its slower serial run eight ways: with six, shard 1 ran
        # 16-17 min (952 s of tests; modelApiHost alone 207 s) and crossed the
        # 20-minute limit in run 38027675949, as hosted Windows varies ~60%
        # between runs (PLAN.md §8). macOS also runs files one at a time
        # (vitest.config.ts) and takes eight too: over six it had no margin
        # even green (run 38225260540: shard 4 took 19 of the 20 minutes,
        # shard 1 took 16), and run 38270466443 lost shard 1 to the limit
        # while it was still running normally. The warm limit stays 20 minutes;
        # Ubuntu keeps four. Part `org` gets 25 (the job's timeout): a new
        # capacity branch starts with a cold npm cache.
        exclude: ${{ fromJSON((inputs.fast || inputs.part == 'org') && '[]' || '[{"os":"ubuntu-latest","shard":5},{"os":"ubuntu-latest","shard":6},{"os":"ubuntu-latest","shard":7},{"os":"ubuntu-latest","shard":8}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: unit tests
        shell: bash
        env:
          FAST: ${{ inputs.fast }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.os == 'ubuntu-latest' && 4 || 8 }}
        run: |
          if [ "$FAST" = true ]; then
            npx vitest run
          else
            npx vitest run --shard="$SHARD/$SHARDS" --reporter=default
          fi

  accessibility:
    name: accessibility (WCAG 2.2 AA)
    # Out of the pull-request path: webview changes are looked at locally,
    # and the queue's merge_group run plus releases still gate every merge.
    if: ${{ inputs.part != 'org' && !inputs.fast && github.event_name != 'pull_request' }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-webview
          path: dist
      # Every scenario/theme; identical browser bundle. Measured Ubuntu 4m54s,
      # Windows 8m11s (run 37211362498). Platform behavior stays in native tests.
      - run: npm run test:a11y
      - run: npm run test:legal-a11y

  integration:
    name: integration (${{ matrix.os }})
    if: ${{ inputs.part != 'org' && !inputs.fast }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The integration tests run twice (.vscode-test.mjs): on the latest
      # stable VS Code and on the manifest's floor (engines.vscode). The two
      # downloads are cached under a key naming both versions.
      - name: VS Code versions for the integration tests
        id: vscode
        if: runner.os != 'macOS'
        shell: bash
        run: node scripts/vscode-versions.mjs >> "$GITHUB_OUTPUT"
      - name: VS Code download cache
        if: runner.os != 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ steps.vscode.outputs.minimum }}-${{ steps.vscode.outputs.stable }}
      - name: integration tests (linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: integration tests (windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

  # D122: in a `home` run this job stands for the Windows and macOS unit
  # shards. It pushes the pull request's merge commit to the capacity
  # repository as ci/pr-<number>, where ci.yml runs part `org` on the
  # organization's runners (a newer commit replaces the branch, and ci.yml's
  # concurrency cancels the older run there), then waits for that run and
  # succeeds only if it succeeded. The push token comes from the capacity
  # GitHub App: one hour, contents and workflow files of that one repository,
  # revoked when the job ends. The wait reads the public run with this job's
  # own read-only token.
  org:
    name: tests (windows-latest, macos-latest) in scnetsolutions/muse-spark-code-ci
    if: ${{ inputs.part == 'home' }}
    runs-on: ubuntu-latest
    # The capacity run is a route job, then sixteen shards of at most 25
    # minutes, macOS five at a time per account. With four pull requests
    # queued ahead, their 32 macOS shards take eight waves plus two more for
    # this run's eight: ten waves of full-length shards is 200 minutes before
    # route and setup overhead. 360 is GitHub's own job ceiling on hosted
    # runners (actions/reference/limits: "Job execution time ... 6 hours"),
    # not our figure: the wait outlives any supported backlog, and anything
    # longer fails at the platform's limit instead of ours. The wait step
    # polls with this job's own token, which lives as long as the job; only
    # the push needs the one-hour App token.
    timeout-minutes: 360
    env:
      CAPACITY: scnetsolutions/muse-spark-code-ci
    steps:
      - name: a token for the capacity repository only (contents and workflow files, one hour)
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ORG_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.org-ci-app-private-key }}
          owner: scnetsolutions
          repositories: muse-spark-code-ci
          permission-contents: write
          # GitHub refuses a push that adds or changes a file under
          # .github/workflows without it; the first push of the history does.
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The capacity repository receives the commits it lacks, which
          # needs their parents here.
          fetch-depth: 0
      # ci/base takes main as this merge commit saw it (its first parent), so
      # the next push sends only what main and the pull request added since.
      # git asks the helper for the password, which reads the step's
      # environment: the token is in no argument and no config file.
      - name: push the merge commit to the capacity repository
        shell: bash
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ci/pr-${{ github.event.pull_request.number }}
        run: |
          # The single quotes below are deliberate. $TOKEN must not expand
          # into git's arguments, where it would sit in the process list; the
          # helper's own shell expands it from the step's environment instead,
          # and $1 is that helper's argument ("get").
          # shellcheck disable=SC2016
          git -c credential.helper= \
            -c 'credential.helper=!f() { test "$1" = get && printf "username=x-access-token\npassword=%s\n" "$TOKEN"; }; f' \
            push "https://github.com/$CAPACITY.git" "+$GITHUB_SHA^1:refs/heads/ci/base" "+$GITHUB_SHA:refs/heads/$BRANCH"
          echo "Sent $GITHUB_SHA to $CAPACITY as $BRANCH"
      # The run of ci.yml on exactly this commit. One that has not shown up
      # ten minutes after the push means the push or Actions there failed;
      # the job says so instead of waiting out its limit.
      - name: wait for the capacity repository's run and take its result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query="repos/$CAPACITY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100"
          pick='[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")][0] // empty | "\(.id) \(.status) \(.conclusion) \(.html_url)"'
          errors="$RUNNER_TEMP/capacity-read.err"
          appear_by=$((SECONDS + 600))
          id=''
          while :; do
            if found=$(gh api "$query" --jq "$pick" 2> "$errors"); then
              if [ -n "$found" ]; then
                read -r id status conclusion url <<< "$found"
                [ "$status" = completed ] && break
                echo "$url: $status"
              fi
            else
              echo "::warning::reading $CAPACITY's runs failed: $(cat "$errors")"
            fi
            if [ -z "$id" ] && [ "$SECONDS" -ge "$appear_by" ]; then
              echo "::error::no CI run on $GITHUB_SHA appeared in $CAPACITY within ten minutes of the push"
              exit 1
            fi
            sleep 60
          done
          {
            echo "### Windows and macOS unit shards: $conclusion"
            echo
            echo "[$CAPACITY run $id]($url)"
            echo
            echo '| job | result |'
            echo '| --- | --- |'
            gh api "repos/$CAPACITY/actions/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | "| [\(.name)](\(.html_url)) | \(.conclusion) |"' 2> "$errors" ||
              echo "| the job list could not be read: $(cat "$errors") | |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$url concluded $conclusion"
          test "$conclusion" = success

  # The matrix emits the five existing non-security required names on BOTH
  # events. Every name rejects a failed/cancelled/missing selected-tier job;
  # in a `home` run that includes `org`, so `quality (windows-latest)` and
  # `quality (macos-latest)` still mean that those shards passed (D122).
  required:
    name: ${{ matrix.check }}
    if: ${{ always() && inputs.part != 'org' }}
    needs:
      [
        checks,
        unit,
        org,
        accessibility,
        integration,
        native-build,
        linux-native-build,
        packages,
        secrets,
        sast,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        check:
          - quality (ubuntu-latest)
          - quality (windows-latest)
          - quality (macos-latest)
          - dictation helper (macos)
          - package (.vsix)
    steps:
      - name: require every selected-tier job
        shell: bash
        env:
          FAST: ${{ inputs.fast }}
          PART: ${{ inputs.part }}
          EVENT: ${{ github.event_name }}
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          ORG: ${{ needs.org.result }}
          ACCESSIBILITY: ${{ needs.accessibility.result }}
          INTEGRATION: ${{ needs.integration.result }}
          HELPER: ${{ needs.native-build.result }}
          LINUX_HELPER: ${{ needs.linux-native-build.result }}
          PACKAGES: ${{ needs.packages.result }}
          SECRETS: ${{ needs.secrets.result }}
          SAST: ${{ needs.sast.result }}
        run: |
          test "$CHECKS" = success
          test "$UNIT" = success
          test "$SECRETS" = success
          test "$SAST" = success
          # D122: a `home` run's Windows and macOS unit shards ran in the
          # capacity repository, and `org` succeeded only if that run did.
          if [ "$PART" = home ]; then
            test "$ORG" = success
          fi
          if [ "$FAST" != true ]; then
            test "$INTEGRATION" = success
            test "$HELPER" = success
            test "$LINUX_HELPER" = success
            test "$PACKAGES" = success
          fi
          # Accessibility runs on merge groups, manual runs and releases, but
          # never on a pull_request event: there it is skipped, not failed.
          if [ "$EVENT" != pull_request ]; then
            test "$ACCESSIBILITY" = success
          fi

  # The macOS dictation helper (M9): Apple's Speech framework behind the
  # microphone button. Compiled here because only a Mac can; the package job
  # below ships it in the .vsix. build.sh embeds package.json's version and
  # fails when the finished binary carries another.
  native-build:
    name: compile dictation helper (macos)
    if: ${{ inputs.part != 'org' && !inputs.fast }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash native/darwin/build.sh
      # The helper asks macOS under its own name, from a copy of itself that
      # disclaims the responsibility of the app that started it, and a
      # SIGTERM to the first process ends the copy (M28).
      - run: bash native/darwin/check-disclaim.sh
      - name: permission-free screen recorder and signed resource checks
        run: |
          bash test/native/darwin/run-screen-record.sh
          bash test/native/darwin/check-screen-resources.sh
          bash native/darwin/check-disclaim.sh --screen-only
      # Archive on macOS: artifact upload otherwise discards executable modes.
      - run: tar -czf native/darwin/muse-dictate-screen.tgz -C native/darwin muse-dictate-screen.app
      - run: bash native/darwin/check-vault.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-vault-darwin
          path: dist/native/darwin/muse-vault
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-dictate-darwin
          path: |
            native/darwin/muse-dictate
            native/darwin/muse-dictate-screen.tgz
          if-no-files-found: error

  # The Linux dictation helper release assets (D140): built here for both
  # architectures, published by release.yml, never packed in the .vsix.
  linux-native-build:
    name: compile native helpers (linux ${{ matrix.arch }})
    if: ${{ inputs.part != 'org' && !inputs.fast }}
    strategy:
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libpulse-dev cmake g++-14
      - run: node --input-type=module -e "import { buildLinuxHelper } from './scripts/build-linux-helper.mjs'; buildLinuxHelper()"
      - run: CC=gcc-14 CXX=g++-14 node scripts/build-linux-dictation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-created-linux-${{ matrix.arch }}
          path: |
            native/linux/${{ matrix.arch }}/muse-created
            native/linux/${{ matrix.arch }}/muse-dictate
            native/linux/${{ matrix.arch }}/*.so*
          if-no-files-found: error

  packages:
    name: universal release artifacts
    if: ${{ inputs.part != 'org' && !inputs.fast }}
    needs: [checks, native-build, linux-native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-dictate-darwin
          path: native/darwin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-created-linux-x64
          path: native/linux/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-created-linux-arm64
          path: native/linux/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: muse-vault-darwin
          path: dist/native/darwin
      - run: chmod +x native/linux/x64/muse-created native/linux/arm64/muse-created native/linux/x64/muse-dictate native/linux/arm64/muse-dictate
      - run: chmod +x dist/native/darwin/muse-vault
      - run: chmod +x native/darwin/muse-dictate
      - run: tar -xzf native/darwin/muse-dictate-screen.tgz -C native/darwin
      # D140: the Linux dictation helper ships as same-tag release assets,
      # never in the VSIX. Regenerate its pins from these built helpers so
      # the packaged extension embeds their exact digests; unset pins fail.
      - run: node scripts/build-linux-helper-pins.mjs native/linux/x64 native/linux/arm64
      - run: node scripts/check-linux-helper-pins.mjs --require-values
      - run: npm ci
      - run: npm run package
        env:
          # The packaged-README badge check lists public main (GitHub API).
          GITHUB_TOKEN: ${{ github.token }}
      - name: the universal VSIX stays within its measured budget
        run: node scripts/check-vsix-size.mjs ./*.vsix
      # D140: prove the VSIX embeds the pins of exactly these helper files;
      # a VSIX whose digests do not match the uploaded assets fails here.
      - name: the VSIX pins match the helper release assets
        run: |
          mkdir -p helper-assets
          for spec in x64:muse-dictate x64:libwhisper.so.1 x64:libggml.so x64:libggml-base.so \
              x64:libggml-cpu-x64.so arm64:muse-dictate arm64:libwhisper.so.1 arm64:libggml.so \
              arm64:libggml-base.so arm64:libggml-cpu-armv8.0_1.so; do
            arch="${spec%%:*}"
            file="${spec#*:}"
            cp "native/linux/$arch/$file" "helper-assets/linux-$arch-$file"
          done
          unzip -p ./*.vsix extension/dist/voiceLinux.js > "$RUNNER_TEMP/voiceLinux.js"
          node scripts/check-linux-helper-pins.mjs --bundle "$RUNNER_TEMP/voiceLinux.js" --assets helper-assets
      # What must be inside the package: the licence, the third-party
      # notices, the native helpers and every runtime bundle (the webview
      # loads main.css beside main.js; the extension requires modelApi.js
      # when the Model API backend first starts, M57, starts pageWorker.js
      # as a worker for each web page it converts, M69, and requires
      # browserCheck.js on the first browser check, M81).
      - name: the .vsix carries the notices, the helpers, the bundles and the manifest's text
        run: |
          listing="$(unzip -Z1 ./*.vsix)"
          for entry in extension/LICENSE.txt extension/THIRD_PARTY_NOTICES.txt extension/package.nls.json \
            extension/native/linux/x64/muse-created extension/native/linux/arm64/muse-created \
            extension/native/dictation-linux/whisper-LICENSE.txt extension/native/dictation-linux/model-LICENSE.txt \
            extension/native/windows/dictate.ps1 extension/native/windows/capture.ps1 \
            extension/native/windows/MuseSparkJob.cs extension/native/windows/MuseSparkMcpJob.cs \
            extension/native/windows/MuseSparkMcpLauncher.cs extension/native/darwin/muse-dictate \
            extension/native/windows/MuseSparkScreenRecord.cs \
            extension/native/darwin/muse-dictate-screen.app/Contents/MacOS/muse-dictate \
            extension/native/darwin/muse-dictate-screen.app/Contents/_CodeSignature/CodeResources \
            extension/dist/vault.js extension/dist/vaultBoundaries.js extension/dist/estimator.js extension/dist/estimateContracts.js \
            extension/dist/native/darwin/muse-vault \
            extension/native/windows/MuseSparkVault.cs extension/native/windows/MuseSparkVaultCng.cs \
            extension/native/windows/MuseSparkVaultHello.cs extension/native/windows/MuseSparkVaultLock.cs \
            extension/dist/extension.js extension/dist/conversation.js extension/dist/prompts.js extension/dist/modelApi.js extension/dist/searchWorker.js \
            extension/dist/pageWorker.js extension/dist/planMarkdown.js extension/dist/checkpointStore.js \
            extension/dist/review.js extension/dist/agentImport.js extension/dist/conversationGit.js extension/dist/bundledSkills.js \
            extension/dist/uiTextRuntime.js extension/dist/uiTextHooks.js extension/dist/uiTextSurfaces.js \
            extension/dist/uiTextMedia.js extension/dist/media.js extension/dist/screenRecord.js \
            extension/dist/uiText.js extension/dist/validation.js extension/dist/wire.js extension/dist/browserCheck.js extension/dist/browserRuntime.js \
            extension/dist/legalScan.js extension/dist/legal-data/NOTICE.md extension/dist/legal-data/provenance.json \
            extension/dist/sessionBoard.js extension/dist/reviewer.js \
            extension/dist/foreignHooks.js extension/dist/hookRuntime.js extension/dist/extensionHooks.js extension/dist/pluginHooks.js \
            extension/dist/codeIntel.js extension/dist/voice.js extension/dist/museCodeReviewer.js \
            extension/dist/report.js extension/dist/recorder.js \
            extension/dist/webFetch.js extension/dist/judge.js extension/docs/judge.md extension/dist/whatsNew.js extension/dist/whatsNew.json \
            extension/dist/webview/main.js extension/dist/webview/main.css \
            extension/dist/webview/whatsNew.js extension/dist/webview/whatsNew.css; do
            if ! grep -Fxq -- "$entry" <<< "$listing"; then
              echo "::error::$entry is missing from the .vsix" >&2
              exit 1
            fi
          done
          # D140: the Linux dictation helper ships as release assets, never
          # in the VSIX; any bundled binary fails the package.
          for entry in extension/native/linux/x64/muse-dictate extension/native/linux/arm64/muse-dictate \
            extension/native/linux/x64/libwhisper.so.1 extension/native/linux/arm64/libwhisper.so.1 \
            extension/native/linux/x64/libggml.so extension/native/linux/arm64/libggml.so \
            extension/native/linux/x64/libggml-base.so extension/native/linux/arm64/libggml-base.so \
            extension/native/linux/x64/libggml-cpu-x64.so extension/native/linux/arm64/libggml-cpu-armv8.0_1.so; do
            if grep -Fxq -- "$entry" <<< "$listing"; then
              echo "::error::$entry must not ship in the .vsix" >&2
              exit 1
            fi
          done
          echo "the .vsix holds $(wc -l <<< "$listing") entries, the required ones included"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-spark-code-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 30
      # The ACP agent's npm package (M63, PLAN.md D62), from the same
      # production build `npm run package` just ran.
      - run: node scripts/package-acp.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: the agent's package carries its bundles, tables, notices and manifest
        run: |
          listing="$(tar -tzf dist/muse-spark-code-acp-*.tgz)"
          for entry in package/package.json package/dist/uiTextRuntime.js package/dist/uiTextHooks.js package/dist/uiTextSurfaces.js package/dist/uiTextMedia.js \
            package/dist/vault.js package/dist/vaultBoundaries.js package/dist/estimator.js package/dist/estimateContracts.js \
            package/native/windows/MuseSparkVault.cs package/native/windows/MuseSparkVaultCng.cs \
            package/native/windows/MuseSparkVaultHello.cs package/native/windows/MuseSparkVaultLock.cs \
            package/dist/native/darwin/muse-vault \
            package/dist/acp.js package/dist/sharingRuntime.js package/dist/modelApi.js package/dist/media.js package/dist/uiText.js package/dist/validation.js package/dist/wire.js package/dist/reviewer.js \
            package/dist/providers.js package/dist/subscriptions.js package/dist/configuredProviders.js package/dist/providerCatalog.js \
            package/dist/foreignHooks.js package/dist/hookRuntime.js package/dist/extensionHooks.js \
            package/dist/recorder.js package/dist/resourceGovernor.js package/dist/resourceAdmission.js \
            package/dist/exec.js package/dist/mcpPool.js package/dist/modelApiCodeIntel.js package/dist/structuredSchema.js \
            package/dist/searchWorker.js package/dist/pageWorker.js \
            package/native/darwin/muse-dictate \
            package/native/linux/x64/muse-created package/native/linux/arm64/muse-created \
            package/native/windows/MuseSparkJob.cs package/native/windows/MuseSparkMcpJob.cs \
            package/native/windows/MuseSparkMcpLauncher.cs \
            package/THIRD_PARTY_NOTICES.txt package/LICENSE package/README.md \
            package/schemas/exec-result-v1.schema.json package/schemas/exec-event-v1.schema.json \
            package/schemas/exec-result-v2.schema.json package/schemas/exec-event-v2.schema.json \
            package/dist/runtime.bundles.json.br package/dist/legalScan.js \
            package/dist/legal-data/NOTICE.md package/dist/legal-data/provenance.json \
            package/schemas/share-v1.schema.json; do
            if ! grep -Fxq -- "$entry" <<< "$listing"; then
              echo "::error::$entry is missing from the agent's package" >&2
              exit 1
            fi
          done
          if ! grep -Fxq -- "package/l10n/ui.tables.json.br" <<< "$listing"; then
            echo "::error::runtime table archive is missing from the agent's package" >&2
            exit 1
          fi
          echo "the agent's package holds $(wc -l <<< "$listing") entries, the required ones included"
      # The bundles load the shared English table at runtime: the extension
      # and Model API bundles from this build, the agent as npm installs it.
      - name: the bundles and the installed agent load the shared English table
        run: |
          acp="$RUNNER_TEMP/acp-install"
          mkdir -p "$acp"
          npm install --prefix "$acp" --ignore-scripts --audit=false --fund=false ./dist/muse-spark-code-acp-*.tgz
          node scripts/check-ui-text.mjs "$acp/node_modules/muse-spark-code-acp"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-spark-code-acp
          path: dist/muse-spark-code-acp-*.tgz
          if-no-files-found: error
          retention-days: 30
      - name: CycloneDX inventories for shipped bundles and native runtime dependencies
        run: node scripts/release-sbom.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-spark-code-sboms
          path: dist/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: record the actual checkout tree and release asset hashes
        id: source
        run: node scripts/release-reuse.mjs record
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-tree-${{ steps.source.outputs.tree }}
          path: dist/release-build.json
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: gitleaks
    if: ${{ inputs.part != 'org' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        if: github.event_name != 'merge_group'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The action exits 1 on any event but push, pull_request,
      # workflow_dispatch and schedule ("The [merge_group] event is not yet
      # supported", src/index.js at the pinned commit). A merge group gets the
      # action's own default CLI (8.24.3, checked against the release's
      # SHA-256) over every commit the group's commit reaches: the main it
      # becomes, PR commits included. A PR-style first-parent range from the
      # group's merge commit would reach none of the PR's commits.
      - name: gitleaks (merge group, the history that lands)
        if: github.event_name == 'merge_group'
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner -v --log-opts=HEAD .

  sast:
    name: semgrep
    if: ${{ inputs.part != 'org' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The semgrep CLI is pinned in the requirements file (Dependabot's pip
      # entry proposes the bumps). `--config auto` still fetches the
      # registry's current rule set at scan time: new rules can find new
      # issues in an unchanged tree, which is the point of the job.
      - run: pip install -r .github/semgrep/requirements.txt
      - run: semgrep scan --config auto --error --exclude=dist --exclude=coverage --exclude=node_modules
