# Muse Desktop Rust workspace: only OSI-approved permissive licences, no
# advisories, no unmaintained crates (M111 lane CP).
[advisories]
ignore = []

[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
