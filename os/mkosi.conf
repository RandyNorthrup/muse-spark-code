[Config]
MinimumVersion=27.1

[Distribution]
Distribution=debian
Release=trixie
Snapshot=20261005T000000Z
Repositories=main non-free-firmware

[Output]
Format=disk
ImageId=muse-spark-code-node-os
ImageVersion=0.19.0
CompressOutput=no
ManifestFormat=json
SplitArtifacts=uki kernel initrd partitions roothash repart-definitions
Seed=8821992e-4707-4882-96ce-a8b16b671a09
RepartDirectories=repart
ElTorito=no

[Content]
SourceDateEpoch=1791158400
Packages=systemd systemd-sysv systemd-boot-efi systemd-resolved systemd-timesyncd
         ca-certificates bash coreutils git openssh-client iproute2 kmod
         libnss-resolve libnss-myhostname dbus
         libstdc++6
         curl
         nftables
         firmware-amd-graphics firmware-intel-graphics firmware-iwlwifi
         firmware-atheros firmware-realtek firmware-brcm80211 firmware-mediatek
ExtraTrees=overlay
CleanPackageMetadata=yes
RemoveFiles=/usr/bin/apt* /usr/bin/dpkg* /usr/sbin/dpkg* /var/log/alternatives.log
            /var/cache/ldconfig/aux-cache
# The initrd's kernel modules only need to reach the root disk. Graphics and
# wireless drivers, and the firmware mkosi pulls in with them (about 70 MB
# more in the UKI, measured 2026-10-24 with OS5's firmware installed), load
# from the verity-protected /usr once it is mounted.
KernelInitrdModules=default
                    -/drivers/gpu/
                    -/drivers/net/wireless/
PostInstallationScripts=mkosi.postinst
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
KernelCommandLine=console=tty0 console=ttyS0,115200 ro root=PARTLABEL=muse-root

[Validation]
SecureBoot=no
SignExpectedPcr=no
Checksum=yes

[Build]
Incremental=no
# systemd-repart draws a random ext4 directory hash seed for each filesystem it
# makes; that seed was the only byte that differed in /usr between two builds
# (measured 2026-10-24: 120 bytes in the six superblock copies). The seed is
# the partition seed above, public by design, and the options repeat repart's
# own, since mke2fs honours the last -E it is given.
Environment="SYSTEMD_REPART_MKFS_OPTIONS_EXT4=-E discard,lazy_itable_init=1,hash_seed=8821992e-4707-4882-96ce-a8b16b671a09"
