# Muse Node OS default firewall policy (OS4).
#
# Default drop on input and forward; the host initiates outbound connections
# freely. Allowed inbound:
#   - loopback and already-established traffic,
#   - SSH on 22 (host administration),
#   - the first-boot setup server on the setup port, only until setup
#     completes; the setup-complete step deletes that rule and reloads.
#
# Load with: nft -f /etc/nftables.conf
# Syntax-check where netlink is available with: nft --check -f <file>
# (the OS6 QEMU boot test parses this file inside the booted image).

define setup_port = 8443

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iifname "lo" accept
    ct state established,related accept
    tcp dport 22 accept
    tcp dport $setup_port accept comment "first-boot setup only; removed at setup completion"
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
