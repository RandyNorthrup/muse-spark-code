# Muse Node OS default firewall policy (OS4).
#
# Default drop on input and forward; the host initiates outbound connections
# freely. Allowed inbound:
#   - loopback and already-established traffic,
#   - IPv6 neighbour discovery and router advertisements, and the DHCPv6
#     replies systemd-networkd waits for on link-local addresses: a
#     default-drop input chain without them cuts IPv6 off a LAN (RFC 4890
#     section 4.4.1 lists neighbour discovery as the minimum to admit),
#   - SSH on 22 (host administration),
#   - the first-boot setup server on the setup port, only until setup
#     completes; the setup-complete step deletes that rule and reloads.
#
# Installed as /etc/nftables.conf by the OS1 composer and loaded by
# nftables.service at boot (the OS6 QEMU boot shows the unit finishing).
# Load by hand with: nft -f /etc/nftables.conf
# Syntax-check where netlink is available with: nft --check -f <file>

define setup_port = 8443

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iifname "lo" accept
    ct state established,related accept
    icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    ip6 saddr fe80::/10 udp dport 546 accept comment "DHCPv6 replies from link-local servers"
    tcp dport 22 accept
    tcp dport $setup_port accept comment "first-boot setup only; removed at setup completion"
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
