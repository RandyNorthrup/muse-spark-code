[Output]
OutputExtension=iso
ElTorito=yes
ElToritoVolume=MUSE_NODE_INSTALLER
ElToritoPublisher=Muse Spark Code (Unofficial)

[Content]
# All installation state is ephemeral; OS3 supplies the authenticated disk
# selection/writer. Booting this medium never writes a target disk.
KernelCommandLine=systemd.volatile=overlay
ExtraTrees=installer-overlay
