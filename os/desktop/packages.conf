# Muse Desktop (M111, D91.20) lane IN: the input methods and fonts the
# `desktop` profile adds to the node image. Lane IM wires this file into
# its profile; the package names are Debian trixie's, resolved under OS1's
# snapshot pinning like every other image package.
#
# Input methods: fcitx5 on input-method-v2 and text-input-v3, with Pinyin
# for Simplified Chinese, Chewing for Traditional Chinese, Mozc for
# Japanese and Hangul for Korean. Electron speaks text-input-v3 only with
# --enable-wayland-ime --wayland-text-input-version=3 (captured from a real
# Electron run in test/desktop/l10n/ime-flags.json; the workbench passes
# them).
#
# Fonts (lane AR, D91.11): the UI face (Inter) and the monospace face
# (JetBrains Mono), the CJK coverage and the emoji face the font gate
# (scripts/check-font-coverage.mjs) shapes every string against. All four
# are OFL families in Debian trixie (fonts-inter 4.1,
# fonts-jetbrains-mono 2.304, verified on packages.debian.org 2026-11-02).
# The gate passes with this set alone (13 fonts, 2688 codepoints, this
# rig), so the image carries no Noto Sans/Mono fallback; the person adds
# wider coverage from the archive when their own files need it.
#
# Desktop CI (not the image) additionally installs libharfbuzz-bin, which
# carries the hb-shape the font gate shapes with.

[Content]
Packages=fcitx5 fcitx5-pinyin fcitx5-chewing fcitx5-mozc fcitx5-hangul
         fonts-inter fonts-jetbrains-mono fonts-noto-cjk fonts-noto-color-emoji
