<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Muse Desktop (M111, D91.11) lane AR: the image's font defaults. Lane IM
     installs this file to /usr/share/fonts/conf.avail/ and enables it in
     conf.d. The 59 slot is load-bearing: aliases for one family accumulate
     with the earlier file's list first, so this file sorts after
     49-sansserif.conf (absent-family requests gain sans-serif before our
     alias runs, and fall back to our UI face) and 50-user.conf (the
     person's own aliases accumulate first and keep winning), and before
     60-latin.conf (our faces come before its Noto/DejaVu lists). A strong
     match here instead would hijack every request, because 49 appends a
     weak sans-serif to all of them; an alias at 64 loses to 60-latin. All
     of this was proven with fc-match on linuxlt against the image's four
     font packages (see the lane's certification record). Every family named
     here is installed by os/desktop/packages.conf; the font gate
     (scripts/check-font-coverage.mjs) shapes every UI string against them. -->
<fontconfig>
  <!-- The UI face, then CJK per locale, emoji last. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <!-- No serif face ships; serif renders in the UI face, never tofu. -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
  </alias>
  <!-- The code face, then CJK for CJK in terminals and editors. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
  </alias>
  <!-- Rendering: smoothed and hinted for LCD panels. No dpi: the
       compositor owns scaling, and a forced dpi breaks fractional scale. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
</fontconfig>
