# RAUC system configuration for Raspberry Pi targets (Pi 4, Pi 5).
#
# Slot map (OS1-OS2-SLOTS, os/README.md): the two 260 MiB FAT partitions
# `muse-pi-boot-a` / `muse-pi-boot-b` hold firmware, DTB, overlays, kernel,
# initrd and the verity command line; slot B ships reserved and slot A
# populated, with initial `autoboot.txt` selecting A. The shared A/B `/usr`
# data partitions pair with their dm-verity hash partitions exactly as on
# UEFI. The inactive slots ship empty with `NoAuto` and are populated only
# by a verified bundle install, which is certified outside the sandbox
# (Q-M110-OS2-RAUC).
#
# `bootloader=custom` drives `pi-tryboot-backend` in this directory, which
# owns the `autoboot.txt` contract (`[all] tryboot_a_b=1`, `boot_partition=`
# and the `[tryboot]` section). Each boot FAT is a bootable slot with
# `bootname` A/B; the data and hash partitions ride along via `parent`, so
# one bundle update always replaces the boot payload together with its
# paired data/hash partitions.
#
# Assumptions recorded for hardware qualification, not claimed here:
#  - `compatible` must equal the bundle's `Compatible` string or RAUC
#    refuses the install; the value below is the registry OS2-OS1-RECIPE
#    must keep in sync with the bundle builder (same value as system-efi.conf).
#  - RAUC invokes the custom backend as
#    `pi-tryboot-backend <get-primary|set-primary|get-state|set-state|get-current>`
#    (plus this lane's `get-trial` extension for the mark-good path); the
#    call sequence RAUC core uses around install is qualified with real
#    slots outside the sandbox.
#
# Keyring path only: the bundle-signing CA is the owner's (Q-M110, PLAN
# D90.24). No key, certificate or fingerprint is committed here; OS2-OS1-RECIPE
# provisions `/etc/rauc/keyring.pem` on the image outside this lane.

[system]
compatible=Muse Node OS 1
bootloader=custom
mountprefix=/run/rauc

[handlers]
bootloader-custom-backend=/usr/lib/muse-update/pi-tryboot-backend

[keyring]
path=/etc/rauc/keyring.pem

[slot.boot.0]
device=/dev/disk/by-partlabel/muse-pi-boot-a
type=vfat
bootname=A

[slot.boot.1]
device=/dev/disk/by-partlabel/muse-pi-boot-b
type=vfat
bootname=B

[slot.usr.0]
device=/dev/disk/by-partlabel/muse-usr-a
type=ext4
parent=boot.0

[slot.usr.1]
device=/dev/disk/by-partlabel/muse-usr-b
type=ext4
parent=boot.1

[slot.usrhash.0]
device=/dev/disk/by-partlabel/muse-usr-a-verity
type=raw
parent=boot.0

[slot.usrhash.1]
device=/dev/disk/by-partlabel/muse-usr-b-verity
type=raw
parent=boot.1
