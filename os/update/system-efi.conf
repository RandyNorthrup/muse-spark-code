# RAUC system configuration for UEFI targets (x86-64, ARM64 SystemReady).
#
# Slot map (OS1-OS2-SLOTS, os/README.md): the single shared ESP holds the
# signed UKIs; the A/B `/usr` data partitions pair with their dm-verity
# hash partitions. The inactive data/hash slots ship empty with `NoAuto`
# and are populated only by a verified bundle install, which is certified
# outside the sandbox (Q-M110-OS2-RAUC).
#
# Assumptions recorded for hardware qualification, not claimed here:
#  - `compatible` must equal the bundle's `Compatible` string or RAUC
#    refuses the install; the value below is the registry OS2-OS1-RECIPE
#    must keep in sync with the bundle builder.
#  - `bootloader=efi` drives the ESP BootXXXX variables keyed by `bootname`.
#    The shared `[slot.efi.0]` is not redundant (one ESP per machine) and
#    stays mounted while RAUC writes the new UKI into it.
#  - Hash partitions carry raw dm-verity trees (no filesystem), hence
#    `type=raw`, each bound to its data slot with `parent`.
#
# Keyring path only: the bundle-signing CA is the owner's (Q-M110, PLAN
# D90.24). No key, certificate or fingerprint is committed here; OS2-OS1-RECIPE
# provisions `/etc/rauc/keyring.pem` on the image outside this lane.

[system]
compatible=Muse Node OS 1
bootloader=efi
mountprefix=/run/rauc

[keyring]
path=/etc/rauc/keyring.pem

[slot.efi.0]
device=/dev/disk/by-partlabel/muse-efi
type=vfat
allow-mounted=true

[slot.usr.0]
device=/dev/disk/by-partlabel/muse-usr-a
type=ext4
bootname=A

[slot.usr.1]
device=/dev/disk/by-partlabel/muse-usr-b
type=ext4
bootname=B

[slot.usrhash.0]
device=/dev/disk/by-partlabel/muse-usr-a-verity
type=raw
parent=usr.0

[slot.usrhash.1]
device=/dev/disk/by-partlabel/muse-usr-b-verity
type=raw
parent=usr.1
