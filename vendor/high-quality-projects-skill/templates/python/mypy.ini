; Strict mypy. Copy to project root as mypy.ini, or fold into pyproject.toml
; under [tool.mypy].
;
; `strict` expands as mypy evolves. Pin mypy and inspect --help on upgrades;
; explicit checks below preserve the intended contract across preset changes.

[mypy]
; Match Ruff and the project's lowest supported Python runtime.
python_version = 3.14
strict = true

; --- beyond `strict` ---
warn_unreachable = true
strict_equality = true
strict_bytes = true
extra_checks = true
disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_explicit = false
; ^ leaving explicit `Any` legal: banning it outright forces `object` +
;   casts in real code (JSON, **kwargs plumbing) and reads worse. Flip to
;   true if the codebase is fully typed and you want zero escape hatches.

; Fail loudly rather than silently skipping unannotated third-party code.
ignore_missing_imports = false
follow_imports = normal

; Error reporting
show_error_codes = true
show_column_numbers = true
pretty = true

; Every `# type: ignore` must name the code it suppresses, and unused
; ignores are themselves errors — stops ignore-rot.
;
; Optional correctness codes that `strict` does not enable:
;   explicit-override  overriding methods need @typing.override (TypeScript's
;                      noImplicitOverride); a renamed base method cannot leave
;                      a silently orphaned "override" behind. Python < 3.12
;                      imports `override` from typing_extensions.
;   exhaustive-match   a `match` over an enum/union/literal must handle every
;                      case (TypeScript's switch-exhaustiveness-check).
;   mutable-override   rejects narrowing a mutable attribute in a subclass.
;   truthy-iterable    `if items:` on an Iterable that may be a generator is
;                      always true.
;   deprecated         uses of APIs marked @deprecated (PEP 702), including
;                      standard-library deprecations recorded in typeshed.
enable_error_code = ignore-without-code,redundant-expr,truthy-bool,possibly-undefined,unused-awaitable,explicit-override,exhaustive-match,mutable-override,truthy-iterable,deprecated
warn_unused_ignores = true

[mypy-tests.*]
; Test bodies stay checked, but pytest fixtures are famously hard to annotate.
disallow_untyped_decorators = false
