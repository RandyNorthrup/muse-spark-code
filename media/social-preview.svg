<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- GitHub social preview (1280×640, the 2:1 card behind shared links):
       typography only, no logo. Rendered to media/social-preview.png by
       scripts/render-images.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117"/>
      <stop offset="1" stop-color="#1b2033"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3b6cf6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3b6cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb2ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7fb2ff"/>
      <stop offset="1" stop-color="#7fb2ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 160H1280M0 320H1280M0 480H1280"/>
    <path d="M160 0V640M320 0V640M480 0V640M640 0V640M800 0V640M960 0V640M1120 0V640"/>
  </g>
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" fill="#f5f7fb" text-anchor="middle">
    <text x="640" y="272" font-size="86" font-weight="700" letter-spacing="-1">Muse Spark Code</text>
    <rect x="490" y="300" width="300" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="640" y="356" font-size="32" fill="#c3cbdc">Meta’s Muse Spark as a coding agent inside VS Code</text>
    <g font-size="20" font-weight="600" fill="#9fb7ff">
      <rect x="252" y="402" width="176" height="44" rx="22" fill="#1c2540" stroke="#33427a"/>
      <text x="340" y="431">Muse Code CLI</text>
      <rect x="442" y="402" width="140" height="44" rx="22" fill="#1c2540" stroke="#33427a"/>
      <text x="512" y="431">Model API</text>
      <rect x="596" y="402" width="180" height="44" rx="22" fill="#1c2540" stroke="#33427a"/>
      <text x="686" y="431">Voice dictation</text>
      <rect x="790" y="402" width="238" height="44" rx="22" fill="#1c2540" stroke="#33427a"/>
      <text x="909" y="431">Windows · macOS · Linux</text>
    </g>
    <text x="640" y="500" font-size="19" fill="#7c879d">Streaming chat · tool calls with diffs · permission modes · session history · no telemetry</text>
    <text x="640" y="570" font-size="18" fill="#5f6a80">VS Code Marketplace · RandyNorthrup.muse-spark-code · unofficial, not affiliated with Meta · MIT</text>
  </g>
