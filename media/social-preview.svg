      <path fill="#7fb2ff" opacity="0.85" d="M96 74c1.5 8 4.5 11 12.5 12.5-8 1.5-11 4.5-12.5 12.5-1.5-8-4.5-11-12.5-12.5 8-1.5 11-4.5 12.5-12.5z"/>
      <path fill="#7fb2ff" opacity="0.6" d="M32 82c1 5.5 3 7.5 8.5 8.5-5.5 1-7.5 3-8.5 8.5-1-5.5-3-7.5-8.5-8.5 5.5-1 7.5-3 8.5-8.5z"/>
