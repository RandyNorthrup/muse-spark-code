<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench 1280 light</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./muse.css">
<link rel="stylesheet" href="./mock.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}a{color:var(--ms-text)}a:hover{color:var(--ms-info)}</style>
</helmet>
<div style="width: 1280px; height: 1300px">
  <dc-import name="Workbench" theme="{{theme}}" size="1280" center="editor" rtl="{{ false }}" num="05" label="Workbench" prev="Wb1280Dark.dc.html" next="Wb1280Hc.dc.html" hint-size="1280px,1300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","hc-dark","hc-light"],"default":"light"},"$preview":{"width":1280,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
