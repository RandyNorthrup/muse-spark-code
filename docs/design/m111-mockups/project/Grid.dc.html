<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview viewport grid</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./muse.css">
<link rel="stylesheet" href="./mock.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}a{color:var(--ms-text)}a:hover{color:var(--ms-info)}</style>
</helmet>
<div style="width: 1920px; height: 1512px">
  <dc-import name="Workbench" theme="{{theme}}" size="1920" center="grid" rtl="{{ false }}" num="17" label="Preview · the multi-viewport grid" prev="Preview.dc.html" next="Rtl.dc.html" hint-size="1920px,1512px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","hc-dark","hc-light"],"default":"light"},"$preview":{"width":1920,"height":1512}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
