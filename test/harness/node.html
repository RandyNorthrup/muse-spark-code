<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muse Node workspace harness</title>
    <link rel="stylesheet" href="../../dist/webview/main.css" />
    <link rel="stylesheet" href="../../dist/webview/node/files/main.css" />
    <style>
      html,
      body {
        width: 100%;
        height: auto;
        overflow: auto;
      }
      body {
        background: var(--vscode-sideBar-background, white);
        color: var(--vscode-foreground, black);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="../../node_modules/axe-core/axe.min.js"></script>
    <script type="module">
      const errors = []
      window.addEventListener('error', (event) => errors.push(event.message))
      window.addEventListener('unhandledrejection', (event) => errors.push(String(event.reason)))
      const params = new URLSearchParams(location.search)
      const scenario = (params.get('scenario') ?? 'node-files').replace(/-narrow$/, '')
      const theme = await (await fetch(`themes/${params.get('theme') ?? 'light'}.json`)).json()
      document.body.className = theme.bodyClass
      for (const [key, value] of Object.entries(theme.variables))
        document.documentElement.style.setProperty(key, value)
      for (const key of theme.unset) document.documentElement.style.removeProperty(key)
      const lang = params.get('lang')
      if (lang !== null) {
        const table = await (
          await fetch(lang === 'pseudo' ? 'l10n/ui.pseudo.json' : `../../l10n/ui.${lang}.json`)
        ).json()
        const embedded = document.createElement('script')
        embedded.id = 'muse-l10n'
        embedded.type = 'application/json'
        embedded.textContent = JSON.stringify({ locale: lang === 'pseudo' ? 'en' : lang, table })
        document.head.append(embedded)
        document.documentElement.lang = lang === 'pseudo' ? 'en' : lang
      }
      const { mountNodeWorkspace } = await import('../../dist/webview/node/files/main.js')
      const encode = (text) => new TextEncoder().encode(text)
      const hash = async (text) =>
        Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', encode(text))), (byte) =>
          byte.toString(16).padStart(2, '0'),
        ).join('')
      let text = 'export const greeting = "hello"\n'
      const destination = {
        host: 'git.example.invalid',
        port: 22,
        user: 'git',
        repository: 'owner/repo.git',
        hostKeyDigest: 'a'.repeat(64),
      }
      const status = {
        branch: 'refs/heads/main',
        head: 'b'.repeat(40),
        changes: [{ path: 'src/example.ts', kind: 'modified' }],
        nextCursor: null,
        remotes: [{ name: 'origin', destination }],
      }
      const calls = []
      const port = {
        request: async (method, input, signal) => {
          signal.throwIfAborted()
          calls.push({ method, input })
          if (method === 'node/files/list')
            return {
              entries:
                input.directory === null
                  ? [{ path: 'src', kind: 'directory', sizeBytes: 0 }]
                  : [{ path: 'src/example.ts', kind: 'file', sizeBytes: encode(text).length }],
              nextCursor: null,
            }
          if (method === 'node/files/search')
            return {
              entries: [{ path: 'src/example.ts', kind: 'file', sizeBytes: encode(text).length }],
              nextCursor: null,
            }
          if (method === 'node/files/read')
            return { path: input.path, text, digest: await hash(text) }
          if (method === 'node/files/write') {
            if (input.expectedDigest !== (await hash(text))) throw new Error('stale fixture')
            text = input.text
            return { digest: await hash(text) }
          }
          if (method === 'node/files/download')
            return { data: btoa(text), digest: await hash(text) }
          if (method === 'node/git/status') return status
          if (method === 'node/git/branches')
            return { branches: [{ name: 'refs/heads/main', current: true }], nextCursor: null }
          if (method === 'node/git/diff')
            return {
              head: status.head,
              digest: await hash('diff'),
              diff: '--- a/src/example.ts\n+++ b/src/example.ts\n@@ -1 +1 @@\n-hello\n+world\n',
              truncated: false,
            }
          if (method === 'node/git/stage') return { done: true }
          if (method === 'node/terminal/open') return { terminalId: 't1' }
          if (method === 'node/terminal/attach') return { done: true }
          if (method === 'node/terminal/close') return { done: true }
          if (method === 'node/dashboard/read')
            return {
              nodeId: 'a'.repeat(64),
              version: '0.19.0',
              uptimeMs: 3_600_000,
              sandbox: 'shared',
              locked: false,
              keyStoreSealed: true,
              attendance: 'attended',
              sessions: [
                {
                  v: 1,
                  id: 'session',
                  ownerId: 'owner',
                  surface: 'web',
                  createdAt: 1000,
                  lastSeenAt: 2000,
                  idleExpiresAt: 62_000,
                  absoluteExpiresAt: 3_602_000,
                },
              ],
              pendingChallenges: 0,
              cpuPercent: 12.5,
              memory: { usedBytes: 1500, totalBytes: 8000 },
              disk: { freeBytes: 2500, totalBytes: 9000 },
              workspaces: [
                { id: 'repo', label: 'home', path: 'workspace', trusted: true, lastUsedAt: 3000 },
              ],
            }
          if (method === 'node/audit/list')
            return {
              entries: [
                {
                  v: 1,
                  seq: 3,
                  time: 1003,
                  nodeId: 'a'.repeat(64),
                  sessionId: null,
                  previousHash: 'b'.repeat(64),
                  hash: 'c'.repeat(64),
                  outcome: 'allowed',
                  kind: 'terminal',
                  terminalId: 't1',
                  workspaceId: 'repo',
                  phase: 'end',
                  inputBytes: 100,
                  outputBytes: 200,
                  source: 'person',
                },
                {
                  v: 1,
                  seq: 2,
                  time: 1002,
                  nodeId: 'a'.repeat(64),
                  sessionId: null,
                  previousHash: 'b'.repeat(64),
                  hash: 'c'.repeat(64),
                  outcome: 'allowed',
                  kind: 'signin',
                  action: 'signin',
                  credentialIdHash: 'd'.repeat(64),
                },
                {
                  v: 1,
                  seq: 1,
                  time: 1001,
                  nodeId: 'a'.repeat(64),
                  sessionId: null,
                  previousHash: 'b'.repeat(64),
                  hash: 'c'.repeat(64),
                  outcome: 'allowed',
                  kind: 'git',
                  workspaceId: 'repo',
                  action: 'push',
                  actionDigest: 'e'.repeat(64),
                },
              ],
              nextCursor: null,
            }
          if (
            [
              'node/git/commit',
              'node/git/branch',
              'node/git/fetch',
              'node/git/pull',
              'node/git/push',
            ].includes(method)
          )
            return { head: status.head, changed: true }
          throw new Error('unexpected fixture method')
        },
      }
      const auth = {
        verify: async (action, actionDigest) => ({
          id: 'proof',
          sessionId: 'session',
          action,
          actionDigest,
          verifiedAt: 1,
          expiresAt: 2,
        }),
      }
      window.nodeHarness = {
        calls,
        destination,
        status,
        readFile: () => text,
        changeFile: (replacement) => {
          text = replacement
        },
      }
      const wires = []
      const connectTerminal = async (terminalId) => {
        const messages = new Set()
        const closes = new Set()
        const wire = {
          send: (frame) => {
            calls.push({ wire: terminalId, frame: JSON.parse(frame) })
          },
          close: () => {
            for (const handler of [...closes]) handler()
          },
          onMessage: (handler) => {
            messages.add(handler)
            return () => {
              messages.delete(handler)
            }
          },
          onClose: (handler) => {
            closes.add(handler)
            return () => {
              closes.delete(handler)
            }
          },
        }
        wires.push({ terminalId, messages })
        // The shell answers after the page subscribes: a prompt, one
        // command and its output, and the tab stays live for the look.
        setTimeout(() => {
          const event = {
            v: 1,
            seq: 1,
            time: 1001,
            nodeId: 'a'.repeat(64),
            terminalId,
            type: 'terminalOutput',
            data: '$ echo hello\r\nhello\r\n$ ',
          }
          for (const handler of [...messages]) handler(JSON.stringify(event))
        }, 50)
        return wire
      }
      mountNodeWorkspace(document.querySelector('#root'), {
        port,
        auth,
        workspaceId: 'repo',
        connectTerminal,
      })
      const find = async (selector) => {
        for (let attempt = 0; attempt < 200; attempt += 1) {
          const element = document.querySelector(selector)
          if (element !== null) return element
          await new Promise((resolve) => setTimeout(resolve, 25))
        }
        throw new Error(`missing ${selector}`)
      }
      try {
        await find('[role="treeitem"]')
        if (scenario === 'node-editor' || scenario === 'node-diff') {
          document.querySelector('[role="treeitem"]').click()
          const file = await find('[id="node-file-src%2Fexample.ts"]')
          file.click()
          await find('.cm-editor')
          if (scenario === 'node-diff') {
            document
              .querySelector('.node-actions button[aria-pressed="false"]:not(nav button)')
              .click()
            await find('.cm-mergeView')
          }
        }
        if (scenario === 'node-git' || scenario === 'node-git-confirm') {
          document.querySelector('nav button:nth-child(2)').click()
          await find('select option')
          if (scenario === 'node-git-confirm') {
            document.querySelector('section .node-actions button:last-child').click()
            await find('[role="group"]')
          }
        }
        if (scenario === 'node-terminal') {
          document.querySelector('nav button:nth-child(3)').click()
          await find('.node-terminal-stack')
          // No tabs yet, so the toolbar's first button opens the shell.
          document.querySelector('section .node-actions button').click()
          await find('.xterm')
        }
        if (scenario === 'node-dashboard') {
          document.querySelector('nav button:nth-child(4)').click()
          await find('dl')
        }
        if (scenario === 'node-audit') {
          document.querySelector('nav button:nth-child(5)').click()
          await find('section li')
        }
        if (scenario === 'node-help') {
          document.querySelector('nav button:nth-child(6)').click()
          await find('h3')
        }
        if (scenario === 'node-whatsnew') {
          document.querySelector('nav button:nth-child(7)').click()
          await find('section li')
        }
        document.body.dataset['nodeReady'] = 'true'
        if (params.get('axe') === '1') {
          await new Promise((resolve) => setTimeout(resolve, 300))
          const result = await window.axe.run(document, {
            runOnly: {
              type: 'tag',
              values: ['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa', 'wcag22aa'],
            },
          })
          const normalize = (findings) =>
            findings.map((finding) => ({
              id: finding.id,
              impact: finding.impact,
              help: finding.help,
              nodes: finding.nodes.map((node) => ({
                target: node.target,
                summary: node.failureSummary ?? '',
                reasons: [...node.any, ...node.all, ...node.none].map(
                  (reason) => reason.messageKey,
                ),
              })),
            }))
          const output = document.createElement('pre')
          output.id = 'axe-result'
          output.hidden = true
          output.textContent = JSON.stringify({
            violations: normalize(result.violations),
            incomplete: normalize(result.incomplete),
            harnessErrors: errors,
          })
          document.body.append(output)
        }
      } catch (error) {
        const output = document.createElement('pre')
        output.id = 'axe-result'
        output.hidden = true
        output.textContent = JSON.stringify({
          violations: [],
          incomplete: [],
          harnessErrors: [...errors, String(error)],
        })
        document.body.append(output)
      }
    </script>
  </body>
</html>
