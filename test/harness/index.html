  <head>
    <meta charset="utf-8" />
    <title>Muse Spark webview harness</title>
    <!--
      Loads the built webview bundle behind a scripted fake host so the UI can
      be exercised in an ordinary browser (see scripts/harness-shots.mjs).
      Served from the repository root; run `npm run build:dev` first.
      The colour variables below approximate VS Code's light theme for the
      screenshots; `?theme=` applies a theme captured from VS Code itself,
      as the accessibility gate does (scripts/a11y.mjs). `?lang=` renders
      the panel in a translated table (below).
    -->
    <link rel="stylesheet" href="../../dist/webview/main.css" />
    <script>
      // `?lang=<id>` renders the panel in l10n/ui.<id>.json, and
      // `?lang=pseudo` in the pseudo-locale table scripts/pseudo-l10n.mjs
      // writes (PLAN.md D33). The table goes into the page as the host puts
      // it into a webview's HTML: a JSON <script id="muse-l10n"> holding
      // `{ locale, table }`, with <html lang> set. The bundle reads it on
      // its first run, so it is fetched synchronously, before the bundle's
      // <script> below; without `?lang` nothing here runs. A table that
      // cannot be read, or that the webview refuses, fails the page
      // (harnessErrors, further down).
      const harnessL10n = (() => {
        const lang = new URLSearchParams(location.search).get('lang')
        if (lang === null) {
          return {}
        }
        try {
          const isPseudo = lang === 'pseudo'
          if (!isPseudo && !/^[a-z]{2,3}(?:-[a-z\d]+)*$/.test(lang)) {
            throw new Error('not a VS Code language id')
          }
          const url = isPseudo ? 'l10n/ui.pseudo.json' : `../../l10n/ui.${lang}.json`
          const request = new XMLHttpRequest()
          request.open('GET', url, false)
          request.send()
          if (request.status !== 200) {
            throw new Error(`${url}: HTTP ${String(request.status)}`)
          }
          // The pseudo table is English underneath: its plural rules apply.
          const locale = isPseudo ? 'en' : lang
          const table = JSON.parse(request.responseText)
          const element = document.createElement('script')
          element.type = 'application/json'
          element.id = 'muse-l10n'
          element.textContent = JSON.stringify({ locale, table })
          document.head.append(element)
          document.documentElement.lang = locale
          return { lang, table }
        } catch (error) {
          return { lang, error: `?lang=${lang}: ${String(error)}` }
        }
      })()
    </script>

    <script>
      // The fake host: answers the webview the way the extension would.
      const send = (message) => {
        window.postMessage(message, '*')
      }
      const later = (ms, fn) => setTimeout(fn, ms)
      // Runs fn with the first element matching selector once one renders:
      // after the settle time the scenarios have always given, then every
      // 50 ms. One that never renders throws, naming it, so the accessibility
      // gate fails the page instead of scanning a half-played scenario.
      const SETTLE_MS = 300
      const FIND_INTERVAL_MS = 50
      const FIND_TIMEOUT_MS = 3000
      const whenFound = (selector, fn) => {
        const look = (waited) => {
          const element = document.querySelector(selector)
          if (element !== null) {
            fn(element)
          } else if (waited >= FIND_TIMEOUT_MS) {
            throw new Error(`never rendered: ${selector}`)
          } else {
            later(FIND_INTERVAL_MS, () => look(waited + FIND_INTERVAL_MS))
          }
        }
        later(SETTLE_MS, () => look(0))
      }
      const files = [
        'src/extension.ts',
        'src/webview/App.tsx',
        'src/webview/components/Composer.tsx',
        'src/shared/protocol.ts',
        'src/host/settings.ts',
        'README.md',
        'PLAN.md',
      ]
      const settings = {
        preferredLocation: 'panel',
        initialPermissionMode: 'manual',
        autosave: true,
        attachOpenFile: true,
        useCtrlEnterToSend: false,
        hideOnboarding: false,
        focusView: false,
        respectGitIgnore: true,
        confidentialWorkspace: false,
        allowDangerouslySkipPermissions: false,
        archiveInactiveSessions: 14,
      }
      const models = [
        {
          modelId: 'muse-spark-1.3',
          displayLabel: 'muse-spark-1.3',
          contextLimit: 1007997,
          isDefault: false,
        },
        {
          modelId: 'muse-spark-1.2',
          displayLabel: 'muse-spark-1.2',
          contextLimit: 1007997,
          isDefault: false,
        },
      ]
      const skills = [
        {
          selector: 'fix-bug',
          displayName: 'Fix bug',
          description: 'Fix the bug described in the prompt',
        },
        {
          selector: 'acme:deploy',
          displayName: 'Deploy',
          description: 'Deploy to an environment',
          argumentHint: '<env>',
        },
      ]
      const attachment = (name, mediaType) => ({
        id: `att-${String(Date.now())}-${String(Math.random())}`,
        name,
        mediaType,
        width: 686,
        height: 695,
        sizeBytes: 12345,
      })
      let composer = { effort: 'high', isThinkingEnabled: true, permissionMode: 'manual' }
      // Stored sessions shaped as `session/list` rows after the host mapping (M6).
      const ago = (ms) => new Date(Date.now() - ms).toISOString()
      const HOUR = 60 * 60 * 1000
      const storedSessions = [
        {
          sessionId: 'now',
          title: 'Fix the parser',
          isNamed: true,
          createdAt: ago(3 * HOUR),
          updatedAt: ago(10 * 60 * 1000),
          lastActivityAt: ago(10 * 60 * 1000),
          branch: 'main',
          status: 'idle',
          turnCount: 4,
          isFork: false,
        },
        {
          sessionId: 'today',
          title: 'what does this do?',
          isNamed: false,
          createdAt: ago(5 * HOUR),
          updatedAt: ago(5 * HOUR),
          status: 'notLoaded',
          turnCount: 1,
          isFork: false,
        },
        {
          sessionId: 'yesterday',
          title: 'Write the README section on the sandbox',
          isNamed: false,
          createdAt: ago(26 * HOUR),
          updatedAt: ago(26 * HOUR),
          branch: 'docs/sandbox',
          status: 'notLoaded',
          turnCount: 3,
          isFork: true,
        },
        {
          sessionId: 'week',
          title: 'Approval card stage lock',
          isNamed: false,
          createdAt: ago(4 * 24 * HOUR),
          updatedAt: ago(4 * 24 * HOUR),
          status: 'notLoaded',
          turnCount: 7,
          isFork: false,
        },
        {
          sessionId: 'older',
          title: 'Scaffold the extension',
          isNamed: false,
          createdAt: ago(9 * 24 * HOUR),
          updatedAt: ago(9 * 24 * HOUR),
          status: 'notLoaded',
          turnCount: 12,
          isFork: false,
        },
        {
          sessionId: 'stale',
          title: 'Forgotten experiment',
          isNamed: false,
          createdAt: ago(20 * 24 * HOUR),
          updatedAt: ago(20 * 24 * HOUR),
          status: 'notLoaded',
          turnCount: 2,
          isFork: false,
        },
      ]
      const archivedIds = ['week']
      const storedHistory = (sessionId, row, lastTurnId) => {
        const items = [
          {
            itemId: 'u1',
            kind: 'userMessage',
            status: 'completed',
            turnId: 't1',
            text: 'Fix the parser so `a ?? b` binds tighter than `||`.',
          },
          {
            itemId: 'r1',
            kind: 'reasoning',
            status: 'completed',
            summary: ['Look at the precedence table first.'],
          },
          {
            itemId: 'rd1',
            kind: 'toolCall',
            status: 'completed',
            tool: 'read_file',
            args: '{"path":"src/parser.ts"}',
            visibleOutput: 'Read text file `src/parser.ts`.',
          },
          {
            itemId: 'm1',
            kind: 'agentMessage',
            status: 'completed',
            text: 'The precedence table lists `??` below `||`; swapping the two rows fixes it.',
          },
          {
            itemId: 'u2',
            kind: 'userMessage',
            status: 'completed',
            turnId: 't2',
            text: 'Do it and add a test.',
            attachments: [{ type: 'image', mediaType: 'image/png', width: 686, height: 695 }],
          },
          {
            itemId: 'ed1',
            kind: 'toolCall',
            status: 'completed',
            tool: 'edit_file',
            args: '{"find":"a","path":"src/parser.ts","replace":"b"}',
            visibleOutput: 'edited',
            patchSummary: { files: 1, added: 2, removed: 2 },
            patchRef: { id: 'tool_patch-ed1', byteLen: 200 },
          },
          {
            itemId: 'm2',
            kind: 'agentMessage',
            status: 'completed',
            text: 'Done: the rows are swapped and `parser.test.ts` covers both forms.',
          },
        ]
        const cut =
          lastTurnId === undefined ? items.length : items.findIndex((i) => i.turnId === 't2')
        return {
          sessionId,
          ...(row?.isNamed && { name: row.title }),
          items: items.slice(0, cut),
          todos: [],
        }
      }
      let turn = 0
      const outbox = []
      window.harnessOutbox = outbox
      // Under `?lang`, what the webview reports as an error fails the page:
      // a table it refused is reported so, and the page would otherwise be
      // checked in English as if it were translated.
      const webviewErrors = []
      const scenarioName = new URLSearchParams(location.search).get('scenario')
      // M25: the conversation a panel saved in VS Code's webview state before
      // the crash screen's Reload, as the webview's own snapshot writes it.
      const restoredState = {
        sessionId: 'restored-1',
        snapshot: {
          version: 1,
          sessionId: 'restored-1',
          title: 'Fix the parser',
          sequence: 6,
          localSequence: 0,
          draft: 'and add a test for it',
          todos: [],
          childTranscripts: {},
          transcript: [
            {
              kind: 'user',
              id: 'u1',
              seq: 1,
              text: 'Fix the parser so `a ?? b` binds tighter than `||`.',
              status: 'sent',
              attachments: [],
              turnId: 't7',
            },
            {
              kind: 'reasoning',
              id: 'r1',
              parts: ['Look at the precedence table first.'],
              isStreaming: false,
              startedAt: 0,
              durationMs: 6000,
            },
            {
              kind: 'tool',
              id: 'rd1',
              tool: 'read_file',
              args: '{"path":"src/parser.ts"}',
              status: 'completed',
              output: 'Read text file `src/parser.ts`.',
              isBackground: false,
              completedSeq: 3,
            },
            {
              kind: 'assistant',
              id: 'm1',
              text: 'The precedence table lists `??` below `||`. Before I swap the rows:',
              isStreaming: false,
            },
            {
              kind: 'tool',
              id: 'q1',
              tool: 'request_user_input',
              args: '{}',
              status: 'inProgress',
              output: '',
              isBackground: false,
              question: {
                userInputId: 'ui1',
                questions: [
                  {
                    id: 'scope',
                    header: 'Scope',
                    question: 'Fix only `??`, or every operator the table gets wrong?',
                    selection: { mode: 'single' },
                    options: [{ label: 'Only ??' }, { label: 'Every operator' }],
                  },
                ],
              },
            },
          ],
        },
      }
      window.acquireVsCodeApi = () => ({
        getState: () => (scenarioName === 'restored' ? restoredState : undefined),
        setState: () => undefined,
        postMessage: (message) => {
          outbox.push(message)
          document.title = `harness: ${message.type}`
          switch (message.type) {
            case 'ready': {
              // The host sends these from its own table, the same one as the page's.
              send({
                type: 'init',
                extensionVersion: '0.0.0-harness',
                emptyStateHint:
                  harnessL10n.table?.emptyStateHint ??
                  'Type /model to pick the right tool for the job.',
                composerPlaceholder:
                  harnessL10n.table?.composerPlaceholder ??
                  'ctrl esc (ctrl alt esc on Windows) to focus or unfocus Muse',
                settings,
              })
              // M25: first, the session and turn the host holds for this surface.
              const isRestored = scenarioName === 'restored'
              send(
                isRestored
                  ? { type: 'surfaceState', sessionId: 'restored-1', activeTurnId: 't7' }
                  : { type: 'surfaceState' },
              )
              send({ type: 'authState', status: 'signedIn' })
              send({ type: 'composerState', ...composer })
              send({ type: 'modelList', models })
              send({
                type: 'sessionInfo',
                modelId: 'muse-spark-1.3',
                contextLimit: 1007997,
                ...(isRestored && { sessionId: 'restored-1' }),
              })
              break
            }
            case 'listSkills': {
              later(50, () => send({ type: 'skillList', skills }))
              break
            }
            case 'searchMentions': {
              const query = message.query.toLowerCase()
              const items = files
                .filter((file) => file.toLowerCase().includes(query))
                .map((path) => ({ path, isFolder: false }))
              later(30, () => send({ type: 'mentionResults', requestId: message.requestId, items }))
              break
            }
            case 'attachImageData': {
              later(20, () =>
                send({
                  type: 'attachmentAdded',
                  attachment: attachment(message.name, message.mediaType),
                }),
              )
              break
            }
            case 'pickFile': {
              later(20, () =>
                send({ type: 'attachmentAdded', attachment: attachment('image.png', 'image/png') }),
              )
              break
            }
            case 'setModel': {
              send({ type: 'sessionInfo', modelId: message.modelId, contextLimit: 1007997 })
              break
            }
            case 'setEffort': {
              composer = { ...composer, effort: message.effort }
              send({ type: 'composerState', ...composer })
              break
            }
            case 'setThinking': {
              composer = { ...composer, isThinkingEnabled: message.enabled }
              send({ type: 'composerState', ...composer })
              break
            }
            case 'setPermissionMode': {
              composer = { ...composer, permissionMode: message.mode }
              send({ type: 'composerState', ...composer })
              break
            }
            case 'sendMessage': {
              turn += 1
              const turnId = `t${String(turn)}`
              const itemId = `m${String(turn)}`
              send({ type: 'turnAccepted', localId: message.localId, turnId })
              send({ type: 'agentEvent', event: { type: 'turnStarted', turnId } })
              if (window.harnessSilent) {
                // Transcript fixtures script their own items.
                break
              }
              send({
                type: 'agentEvent',
                event: {
                  type: 'itemStarted',
                  item: { itemId, kind: 'agentMessage', status: 'inProgress', turnId, text: '' },
                },
              })
              later(300, () =>
                send({
                  type: 'agentEvent',
                  event: {
                    type: 'textDelta',
                    itemId,
                    field: 'text',
                    delta: `Echo: ${message.text} (${String(message.attachmentIds.length)} image(s))`,
                  },
                }),
              )
              later(4000, () => {
                send({
                  type: 'agentEvent',
                  event: {
                    type: 'itemCompleted',
                    item: { itemId, kind: 'agentMessage', status: 'completed' },
                  },
                })
                send({
                  type: 'agentEvent',
                  event: { type: 'turnCompleted', turnId, terminal: 'completed' },
                })
              })
              break
            }
            case 'readToolImage': {
              // M43: a picture drawn here, as the host would read it from the workspace.
              const canvas = document.createElement('canvas')
              canvas.width = 320
              canvas.height = 180
              const pen = canvas.getContext('2d')
              const sky = pen.createLinearGradient(0, 0, 0, 180)
              sky.addColorStop(0, '#1b3a6b')
              sky.addColorStop(1, '#4f8fd6')
              pen.fillStyle = sky
              pen.fillRect(0, 0, 320, 180)
              pen.fillStyle = '#0d1f3a'
              pen.fillRect(0, 140, 320, 40)
              pen.fillStyle = '#f2f2f2'
              pen.fillRect(150, 60, 20, 80)
              pen.fillStyle = '#e8b04a'
              pen.fillRect(146, 48, 28, 14)
              later(30, () =>
                send({
                  type: 'toolImage',
                  itemId: message.itemId,
                  path: message.path,
                  dataUri: canvas.toDataURL('image/png'),
                }),
              )
              break
            }
            case 'readOutput': {
              if (window.harnessPagedPatch !== undefined) {
                // M25: a patch document longer than one page, served in two.
                const whole = window.harnessPagedPatch
                const half = Math.floor(whole.length / 2)
                const isFirst = message.offsetBytes === 0
                later(30, () =>
                  send({
                    type: 'outputPage',
                    itemId: message.itemId,
                    outputRef: message.outputRef,
                    offsetBytes: message.offsetBytes,
                    byteLen: isFirst ? half : whole.length - half,
                    eof: !isFirst,
                    content: isFirst ? whole.slice(0, half) : whole.slice(half),
                  }),
                )
                break
              }
              later(30, () =>
                send({
                  type: 'outputPage',
                  itemId: message.itemId,
                  outputRef: message.outputRef,
                  offsetBytes: 0,
                  byteLen: 200,
                  eof: true,
                  content: JSON.stringify({
                    files: [
                      {
                        path: 'src/webview/App.tsx',
                        hunks: [
                          {
                            oldStart: 226,
                            newStart: 226,
                            lines: [
                              "   it('labels the model pill', () => {",
                              "-    expect(label).toBe('muse-spark-1.3 (1M) High')",
                              "+    expect(label).toBe('muse-spark-1.3 High')",
                              '     deliver({',
                            ],
                          },
                        ],
                      },
                    ],
                  }),
                }),
              )
              break
            }
            case 'decideApproval': {
              later(30, () =>
                send({
                  type: 'agentEvent',
                  event: {
                    type: 'approvalResolved',
                    approvalId: message.approvalId,
                    itemId: 'sh1',
                    decision: 'approved',
                    resolvedBy: 'user',
                  },
                }),
              )
              break
            }
            // --- Session history (M6) ---
            case 'listSessions': {
              later(40, () => send({ type: 'sessionList', sessions: storedSessions, archivedIds }))
              break
            }
            case 'setSessionArchived': {
              if (message.isArchived) {
                archivedIds.push(message.sessionId)
              } else {
                archivedIds.splice(archivedIds.indexOf(message.sessionId), 1)
              }
              send({ type: 'sessionList', sessions: storedSessions, archivedIds })
              break
            }
            case 'resumeSession': {
              const row = storedSessions.find((s) => s.sessionId === message.sessionId)
              later(60, () => {
                send({ type: 'historyLoaded', ...storedHistory(message.sessionId, row) })
                send({ type: 'notice', level: 'info', text: `Resumed ${row?.title ?? ''}` })
                send({
                  type: 'sessionInfo',
                  modelId: 'muse-spark-1.3',
                  contextLimit: 1007997,
                  sessionId: message.sessionId,
                })
              })
              break
            }
            case 'forkSession': {
              later(60, () => {
                send({
                  type: 'historyLoaded',
                  ...storedHistory('forked', undefined, message.lastTurnId),
                })
                send({
                  type: 'notice',
                  level: 'info',
                  text: 'Forked into a new conversation. Fix the parser',
                })
                send({
                  type: 'sessionInfo',
                  modelId: 'muse-spark-1.3',
                  contextLimit: 1007997,
                  sessionId: 'forked',
                })
              })
              break
            }
            case 'renameSession': {
              later(40, () =>
                send({ type: 'agentEvent', event: { type: 'sessionNamed', name: message.name } }),
              )
              break
            }
            // --- Voice dictation (M9): the harness "listens" for a moment, then
            // hands back a phrase, as the Windows helper would.
            case 'dictation': {
              if (message.action === 'start') {
                send({ type: 'dictationState', status: 'starting' })
                later(40, () => send({ type: 'dictationState', status: 'listening' }))
                break
              }
              send({ type: 'dictationState', status: 'idle' })
              later(40, () => send({ type: 'insertText', text: 'open the settings file ' }))
              break
            }
            // --- Paid features (M33): the palette's toggles, confirmed at once ---
            case 'setPaidFeature': {
              const features = new Set(window.harnessPaid?.features ?? [])
              if (message.isOn) {
                features.add(message.feature)
              } else {
                features.delete(message.feature)
              }
              window.harnessPaid = { ...window.harnessPaid, features: [...features] }
              later(40, () => send({ type: 'paidState', state: window.harnessPaid }))
              break
            }
            // --- Account & usage (M8) ---
            case 'readUsage': {
              later(40, () =>
                send(
                  window.harnessBackend === 'modelApi'
                    ? {
                        type: 'usageReport',
                        backend: 'modelApi',
                        account: { signInMethod: 'apiKey' },
                      }
                    : {
                        type: 'usageReport',
                        backend: 'museCode',
                        account: {
                          signInMethod: 'cli',
                          cliVersion: '1.3.0',
                          delegationMode: 'off',
                        },
                        subscription: {
                          observedAtMs: Date.now() - 4 * 60 * 1000,
                          tier: 'muse-pro',
                          window: {
                            usedPercent: 42,
                            resetsAtMs: Date.now() + (2 * 60 + 5) * 60 * 1000,
                            windowDurationMins: 300,
                          },
                          weekly: {
                            usedPercent: 17,
                            resetsAtMs: Date.now() + 3 * 24 * 60 * 60 * 1000,
                          },
                        },
                        insights: {
                          day: {
                            attempts: 186,
                            sessions: 6,
                            reminderAttempts: 150,
                            subagentAttempts: 24,
                            longSessionAttempts: 0,
                          },
                          week: {
                            attempts: 1821,
                            sessions: 41,
                            reminderAttempts: 1462,
                            subagentAttempts: 96,
                            longSessionAttempts: 210,
                          },
                        },
                      },
                ),
              )
              break
            }
            case 'webviewError': {
              if (harnessL10n.lang !== undefined) {
                webviewErrors.push(`?lang=${harnessL10n.lang}: the webview: ${message.message}`)
              }
              break
            }
            case 'answerQuestion': {
              later(30, () =>
                send({
                  type: 'agentEvent',
                  event: {
                    type: 'questionSettled',
                    userInputId: message.userInputId,
                    outcome: 'answered',
                    answers: message.answers,
                  },
                }),
              )
              break
            }
            default: {
              break
            }
          }
        },
      })

    <script>

      // A scenario starts once the panel has drawn its surface: the composer,
      // a sign-in or install gate, or the crash screen; never sooner than the
      // 400 ms it always waited. A fixed delay alone raced the first render

      if (scenario !== null && scenario in steps) {

      // `?theme=<kind>` applies the colours VS Code gives a webview in one of
      // its default themes (test/harness/themes, captured from VS Code by
      // scripts/capture-themes.mjs). A colour the theme leaves unset is made
      // invalid, so the stylesheet's own fallback applies, as in VS Code.
      // `?axe=1` then runs axe-core (WCAG 2.0, 2.1 and 2.2, levels A and AA)
      // once the scenario has played, and writes what it found into a
      // hidden <pre id="axe-result"> for scripts/a11y.mjs (M37, PLAN.md D32).
      const params = new URLSearchParams(location.search)
      const FONT_VARIABLE = /font/
      const isString = (value) => typeof value === 'string'
      // The capture is checked before use: a file of another shape fails the
      // page by name instead of colouring it wrongly.
      const themeOf = (kind, value) => {
        const isTheme =
          typeof value === 'object' &&
          value !== null &&
          isString(value.bodyClass) &&
          typeof value.variables === 'object' &&
          value.variables !== null &&
          Object.values(value.variables).every(isString) &&
          Array.isArray(value.unset) &&
          value.unset.every(isString)
        if (!isTheme) {
          throw new Error(`themes/${kind}.json is not a theme capture`)
        }
        return value
      }
      const applyTheme = async (kind) => {
        const response = await fetch(`themes/${kind}.json`)
        if (!response.ok) {
          throw new Error(`themes/${kind}.json: HTTP ${String(response.status)}`)
        }
        const theme = themeOf(kind, await response.json())
        const root = document.documentElement.style
        for (const [name, value] of Object.entries(theme.variables)) {
          root.setProperty(name, value)
        }
        // The fonts are the webview host's, not the theme's: they stay.
        for (const name of theme.unset.filter((unset) => !FONT_VARIABLE.test(unset))) {
          root.setProperty(name, 'initial')
        }
        document.body.classList.add(...theme.bodyClass.split(' '))
      }
      const AXE_AFTER_MS = 5000
      const AXE_TAGS = ['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa', 'wcag22aa']
      const writeAxeResult = (value) => {
        const result = document.createElement('pre')
        result.id = 'axe-result'
        result.hidden = true
        result.textContent = JSON.stringify(value)
        document.body.append(result)
      }
      const loadAxe = () =>
        new Promise((resolve, reject) => {
          const script = document.createElement('script')
          script.src = '../../node_modules/axe-core/axe.min.js'
          script.addEventListener('load', resolve)
          script.addEventListener('error', () => {
            reject(new Error('axe-core did not load'))
          })
          document.head.append(script)
        })
      // WCAG 2.5.8 "does not apply to targets while they are obscured by
      // content displayed as a result of a user interaction" (W3C,
      // Understanding 2.5.8), such as a menu the user opened. axe measures
      // the covered area anyway. A target-size finding is exempt, and
      // reported, only when every element axe relates to it sits in an
      // opened menu or dialog that does not hold the target itself and that
      // overlaps it on screen: covered by a separate overlay, not crowded by
      // its own neighbours (the review of PR #18).
      const OPENED_CONTENT = '.popover, [role="menu"], [role="dialog"]'
      const elementAt = (target) => document.querySelector(target.join(' '))
      const overlaps = (cover, element) => {
        const a = cover.getBoundingClientRect()
        const b = element.getBoundingClientRect()
        return a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom
      }
      const isObscuredByOpenedContent = (node) => {
        const target = elementAt(node.target)
        const related = [...node.any, ...node.all, ...node.none].flatMap(
          (check) => check.relatedNodes,
        )
        return (
          target !== null &&
          related.length > 0 &&
          related.every((entry) => {
            const cover = elementAt(entry.target)?.closest(OPENED_CONTENT)
            return cover != null && !cover.contains(target) && overlaps(cover, target)
          })
        )
      }
      // One of axe's result lists, the exempt elements taken out and noted.
      const findingsOf = (list, exempt) =>
        list.flatMap((finding) => {
          const nodes = finding.nodes.filter((node) => {
            if (finding.id === 'target-size' && isObscuredByOpenedContent(node)) {
              exempt.push({ rule: finding.id, target: node.target.join(' ') })
              return false
            }
            return true
          })
          return nodes.length === 0
            ? []
            : [
                {
                  id: finding.id,
                  impact: finding.impact,
                  help: finding.help,
                  nodes: nodes.map((node) => ({
                    target: node.target.join(' '),
                    summary: node.failureSummary,
                    // Why axe could not decide, as keys (bgOverlap, …).
                    reasons: [...node.any, ...node.all, ...node.none].flatMap((check) =>
                      check.data?.messageKey === undefined ? [] : [check.data.messageKey],
                    ),
                  })),
                },
              ]
        })
      const runAxe = async () => {
        await loadAxe()
        // "incomplete" is what axe could not decide on its own: a size it
        // could not measure, a background it could not see. It is returned
        // as well, never dropped (the review of PR #18).
        const results = await window.axe.run(document, {
          runOnly: { type: 'tag', values: AXE_TAGS },
          resultTypes: ['violations', 'incomplete'],
        })
        const exempt = []
        return {
          violations: findingsOf(results.violations, exempt),
          incomplete: findingsOf(results.incomplete, exempt),
          exempt,
        }
      }
      // Every error the webview reported in a `?lang` run, from its first
      // (a refused table) to the scenario's end, fails the page.
      const collectWebviewErrors = () => {
        harnessErrors.push(...webviewErrors)
      }
      const themed = params.has('theme') ? applyTheme(params.get('theme')) : Promise.resolve()
      if (params.get('axe') === '1') {
        themed
          .then(
            () =>
              new Promise((resolve) => {
                later(AXE_AFTER_MS, resolve)
              }),
          )
          .then(collectWebviewErrors)
          .then(runAxe)
          .then(
            (result) => {
              writeAxeResult({ ...result, harnessErrors })
            },
            (error) => {
              writeAxeResult({ error: String(error) })
            },
          )
      }
