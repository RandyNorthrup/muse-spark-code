<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Muse Spark webview harness</title>
    <!--
      Loads the built webview bundle behind a scripted fake host so the UI can
      be exercised in an ordinary browser (see scripts/harness-shots.mjs).
      Served from the repository root; run `npm run build:dev` first.
      The colour variables below approximate VS Code's light theme for the
      screenshots; `?theme=` applies a theme captured from VS Code itself,
      as the accessibility gate does (scripts/a11y.mjs).
    -->
    <link rel="stylesheet" href="../../dist/webview/main.css" />
    <style>
      :root {
        --vscode-foreground: #3b3b3b;
        --vscode-descriptionForeground: #717171;
        --vscode-disabledForeground: #a0a0a0;
        --vscode-errorForeground: #f14c4c;
        --vscode-font-family: 'Segoe UI', sans-serif;
        --vscode-font-size: 13px;
        --vscode-editor-font-family: Consolas, monospace;
        --vscode-sideBar-background: #f8f8f8;
        --vscode-panel-border: #e5e5e5;
        --vscode-badge-foreground: #3b3b3b;
        --vscode-badge-background: #e8e8e8;
        --vscode-button-foreground: #ffffff;
        --vscode-button-background: #005fb8;
        --vscode-button-hoverBackground: #0258a8;
        --vscode-button-secondaryForeground: #3b3b3b;
        --vscode-button-secondaryBackground: #e5e5e5;
        --vscode-input-foreground: #3b3b3b;
        --vscode-input-background: #ffffff;
        --vscode-input-border: #cecece;
        --vscode-input-placeholderForeground: #767676;
        --vscode-focusBorder: #005fb8;
        --vscode-toolbar-hoverBackground: #e8e8e8;
        --vscode-editorWidget-background: #f8f8f8;
        --vscode-editorWidget-border: #c8c8c8;
        --vscode-widget-shadow: rgba(0, 0, 0, 0.16);
        --vscode-list-activeSelectionBackground: #e8e8e8;
        --vscode-list-activeSelectionForeground: #000000;
        --vscode-checkbox-border: #cecece;
      }

      html,
      body {
        width: 690px;
      }
    </style>
    <script>
      // The fake host: answers the webview the way the extension would.
      const send = (message) => {
        window.postMessage(message, '*')
      }
      const later = (ms, fn) => setTimeout(fn, ms)
      const files = [
        'src/extension.ts',
        'src/webview/App.tsx',
        'src/webview/components/Composer.tsx',
        'src/shared/protocol.ts',
        'src/host/settings.ts',
        'README.md',
        'PLAN.md',
      ]
      const settings = {
        preferredLocation: 'panel',
        initialPermissionMode: 'manual',
        autosave: true,
        attachOpenFile: true,
        useCtrlEnterToSend: false,
        hideOnboarding: false,
        focusView: false,
        respectGitIgnore: true,
        confidentialWorkspace: false,
        allowDangerouslySkipPermissions: false,
        archiveInactiveSessions: 14,
      }
      const models = [
        {
          modelId: 'muse-spark-1.3',
          displayLabel: 'muse-spark-1.3',
          contextLimit: 1007997,
          isDefault: false,
        },
        {
          modelId: 'muse-spark-1.2',
          displayLabel: 'muse-spark-1.2',
          contextLimit: 1007997,
          isDefault: false,
        },
      ]
      const skills = [
        {
          selector: 'fix-bug',
          displayName: 'Fix bug',
          description: 'Fix the bug described in the prompt',
        },
        {
          selector: 'acme:deploy',
          displayName: 'Deploy',
          description: 'Deploy to an environment',
          argumentHint: '<env>',
        },
      ]
      const attachment = (name, mediaType) => ({
        id: `att-${String(Date.now())}-${String(Math.random())}`,
        name,
        mediaType,
        width: 686,
        height: 695,
        sizeBytes: 12345,
      })
      let composer = { effort: 'high', isThinkingEnabled: true, permissionMode: 'manual' }
      // Stored sessions shaped as `session/list` rows after the host mapping (M6).
      const ago = (ms) => new Date(Date.now() - ms).toISOString()
      const HOUR = 60 * 60 * 1000
      const storedSessions = [
        {
          sessionId: 'now',
          title: 'Fix the parser',
          isNamed: true,
          createdAt: ago(3 * HOUR),
          updatedAt: ago(10 * 60 * 1000),
          lastActivityAt: ago(10 * 60 * 1000),
          branch: 'main',
          status: 'idle',
          turnCount: 4,
          isFork: false,
        },
        {
          sessionId: 'today',
          title: 'what does this do?',
          isNamed: false,
          createdAt: ago(5 * HOUR),
          updatedAt: ago(5 * HOUR),
          status: 'notLoaded',
          turnCount: 1,
          isFork: false,
        },
        {
          sessionId: 'yesterday',
          title: 'Write the README section on the sandbox',
          isNamed: false,
          createdAt: ago(26 * HOUR),
          updatedAt: ago(26 * HOUR),
          branch: 'docs/sandbox',
          status: 'notLoaded',
          turnCount: 3,
          isFork: true,
        },
        {
          sessionId: 'week',
          title: 'Approval card stage lock',
          isNamed: false,
          createdAt: ago(4 * 24 * HOUR),
          updatedAt: ago(4 * 24 * HOUR),
          status: 'notLoaded',
          turnCount: 7,
          isFork: false,
        },
        {
          sessionId: 'older',
          title: 'Scaffold the extension',
          isNamed: false,
          createdAt: ago(9 * 24 * HOUR),
          updatedAt: ago(9 * 24 * HOUR),
          status: 'notLoaded',
          turnCount: 12,
          isFork: false,
        },
        {
          sessionId: 'stale',
          title: 'Forgotten experiment',
          isNamed: false,
          createdAt: ago(20 * 24 * HOUR),
          updatedAt: ago(20 * 24 * HOUR),
          status: 'notLoaded',
          turnCount: 2,
          isFork: false,
        },
      ]
      const archivedIds = ['week']
      const storedHistory = (sessionId, row, lastTurnId) => {
        const items = [
          {
            itemId: 'u1',
            kind: 'userMessage',
            status: 'completed',
            turnId: 't1',
            text: 'Fix the parser so `a ?? b` binds tighter than `||`.',
          },
          {
            itemId: 'r1',
            kind: 'reasoning',
            status: 'completed',
            summary: ['Look at the precedence table first.'],
          },
          {
            itemId: 'rd1',
            kind: 'toolCall',
            status: 'completed',
            tool: 'read_file',
            args: '{"path":"src/parser.ts"}',
            visibleOutput: 'Read text file `src/parser.ts`.',
          },
          {
            itemId: 'm1',
            kind: 'agentMessage',
            status: 'completed',
            text: 'The precedence table lists `??` below `||`; swapping the two rows fixes it.',
          },
          {
            itemId: 'u2',
            kind: 'userMessage',
            status: 'completed',
            turnId: 't2',
            text: 'Do it and add a test.',
            attachments: [{ type: 'image', mediaType: 'image/png', width: 686, height: 695 }],
          },
          {
            itemId: 'ed1',
            kind: 'toolCall',
            status: 'completed',
            tool: 'edit_file',
            args: '{"find":"a","path":"src/parser.ts","replace":"b"}',
            visibleOutput: 'edited',
            patchSummary: { files: 1, added: 2, removed: 2 },
            patchRef: { id: 'tool_patch-ed1', byteLen: 200 },
          },
          {
            itemId: 'm2',
            kind: 'agentMessage',
            status: 'completed',
            text: 'Done: the rows are swapped and `parser.test.ts` covers both forms.',
          },
        ]
        const cut =
          lastTurnId === undefined ? items.length : items.findIndex((i) => i.turnId === 't2')
        return {
          sessionId,
          ...(row?.isNamed && { name: row.title }),
          items: items.slice(0, cut),
          todos: [],
        }
      }
      let turn = 0
      const outbox = []
      window.harnessOutbox = outbox
      const scenarioName = new URLSearchParams(location.search).get('scenario')
      // M25: the conversation a panel saved in VS Code's webview state before
      // the crash screen's Reload, as the webview's own snapshot writes it.
      const restoredState = {
        sessionId: 'restored-1',
        snapshot: {
          version: 1,
          sessionId: 'restored-1',
          title: 'Fix the parser',
          sequence: 6,
          localSequence: 0,
          draft: 'and add a test for it',
          todos: [],
          childTranscripts: {},
          transcript: [
            {
              kind: 'user',
              id: 'u1',
              seq: 1,
              text: 'Fix the parser so `a ?? b` binds tighter than `||`.',
              status: 'sent',
              attachments: [],
              turnId: 't7',
            },
            {
              kind: 'reasoning',
              id: 'r1',
              parts: ['Look at the precedence table first.'],
              isStreaming: false,
              startedAt: 0,
              durationMs: 6000,
            },
            {
              kind: 'tool',
              id: 'rd1',
              tool: 'read_file',
              args: '{"path":"src/parser.ts"}',
              status: 'completed',
              output: 'Read text file `src/parser.ts`.',
              isBackground: false,
              completedSeq: 3,
            },
            {
              kind: 'assistant',
              id: 'm1',
              text: 'The precedence table lists `??` below `||`. Before I swap the rows:',
              isStreaming: false,
            },
            {
              kind: 'tool',
              id: 'q1',
              tool: 'request_user_input',
              args: '{}',
              status: 'inProgress',
              output: '',
              isBackground: false,
              question: {
                userInputId: 'ui1',
                questions: [
                  {
                    id: 'scope',
                    header: 'Scope',
                    question: 'Fix only `??`, or every operator the table gets wrong?',
                    selection: { mode: 'single' },
                    options: [{ label: 'Only ??' }, { label: 'Every operator' }],
                  },
                ],
              },
            },
          ],
        },
      }
      window.acquireVsCodeApi = () => ({
        getState: () => (scenarioName === 'restored' ? restoredState : undefined),
        setState: () => undefined,
        postMessage: (message) => {
          outbox.push(message)
          document.title = `harness: ${message.type}`
          switch (message.type) {
            case 'ready': {
              send({
                type: 'init',
                extensionVersion: '0.0.0-harness',
                emptyStateHint: 'Type /model to pick the right tool for the job.',
                composerPlaceholder: 'ctrl esc (ctrl alt esc on Windows) to focus or unfocus Muse',
                settings,
              })
              // M25: first, the session and turn the host holds for this surface.
              const isRestored = scenarioName === 'restored'
              send(
                isRestored
                  ? { type: 'surfaceState', sessionId: 'restored-1', activeTurnId: 't7' }
                  : { type: 'surfaceState' },
              )
              send({ type: 'authState', status: 'signedIn' })
              send({ type: 'composerState', ...composer })
              send({ type: 'modelList', models })
              send({
                type: 'sessionInfo',
                modelId: 'muse-spark-1.3',
                contextLimit: 1007997,
                ...(isRestored && { sessionId: 'restored-1' }),
              })
              break
            }
            case 'listSkills': {
              later(50, () => send({ type: 'skillList', skills }))
              break
            }
            case 'searchMentions': {
              const query = message.query.toLowerCase()
              const items = files
                .filter((file) => file.toLowerCase().includes(query))
                .map((path) => ({ path, isFolder: false }))
              later(30, () => send({ type: 'mentionResults', requestId: message.requestId, items }))
              break
            }
            case 'attachImageData': {
              later(20, () =>
                send({
                  type: 'attachmentAdded',
                  attachment: attachment(message.name, message.mediaType),
                }),
              )
              break
            }
            case 'pickFile': {
              later(20, () =>
                send({ type: 'attachmentAdded', attachment: attachment('image.png', 'image/png') }),
              )
              break
            }
            case 'setModel': {
              send({ type: 'sessionInfo', modelId: message.modelId, contextLimit: 1007997 })
              break
            }
            case 'setEffort': {
              composer = { ...composer, effort: message.effort }
              send({ type: 'composerState', ...composer })
              break
            }
            case 'setThinking': {
              composer = { ...composer, isThinkingEnabled: message.enabled }
              send({ type: 'composerState', ...composer })
              break
            }
            case 'setPermissionMode': {
              composer = { ...composer, permissionMode: message.mode }
              send({ type: 'composerState', ...composer })
              break
            }
            case 'sendMessage': {
              turn += 1
              const turnId = `t${String(turn)}`
              const itemId = `m${String(turn)}`
              send({ type: 'turnAccepted', localId: message.localId, turnId })
              send({ type: 'agentEvent', event: { type: 'turnStarted', turnId } })
              if (window.harnessSilent) {
                // Transcript fixtures script their own items.
                break
              }
              send({
                type: 'agentEvent',
                event: {
                  type: 'itemStarted',
                  item: { itemId, kind: 'agentMessage', status: 'inProgress', turnId, text: '' },
                },
              })
              later(300, () =>
                send({
                  type: 'agentEvent',
                  event: {
                    type: 'textDelta',
                    itemId,
                    field: 'text',
                    delta: `Echo: ${message.text} (${String(message.attachmentIds.length)} image(s))`,
                  },
                }),
              )
              later(4000, () => {
                send({
                  type: 'agentEvent',
                  event: {
                    type: 'itemCompleted',
                    item: { itemId, kind: 'agentMessage', status: 'completed' },
                  },
                })
                send({
                  type: 'agentEvent',
                  event: { type: 'turnCompleted', turnId, terminal: 'completed' },
                })
              })
              break
            }
            case 'readOutput': {
              if (window.harnessPagedPatch !== undefined) {
                // M25: a patch document longer than one page, served in two.
                const whole = window.harnessPagedPatch
                const half = Math.floor(whole.length / 2)
                const isFirst = message.offsetBytes === 0
                later(30, () =>
                  send({
                    type: 'outputPage',
                    itemId: message.itemId,
                    outputRef: message.outputRef,
                    offsetBytes: message.offsetBytes,
                    byteLen: isFirst ? half : whole.length - half,
                    eof: !isFirst,
                    content: isFirst ? whole.slice(0, half) : whole.slice(half),
                  }),
                )
                break
              }
              later(30, () =>
                send({
                  type: 'outputPage',
                  itemId: message.itemId,
                  outputRef: message.outputRef,
                  offsetBytes: 0,
                  byteLen: 200,
                  eof: true,
                  content: JSON.stringify({
                    files: [
                      {
                        path: 'src/webview/App.tsx',
                        hunks: [
                          {
                            oldStart: 226,
                            newStart: 226,
                            lines: [
                              "   it('labels the model pill', () => {",
                              "-    expect(label).toBe('muse-spark-1.3 (1M) High')",
                              "+    expect(label).toBe('muse-spark-1.3 High')",
                              '     deliver({',
                            ],
                          },
                        ],
                      },
                    ],
                  }),
                }),
              )
              break
            }
            case 'decideApproval': {
              later(30, () =>
                send({
                  type: 'agentEvent',
                  event: {
                    type: 'approvalResolved',
                    approvalId: message.approvalId,
                    itemId: 'sh1',
                    decision: 'approved',
                    resolvedBy: 'user',
                  },
                }),
              )
              break
            }
            // --- Session history (M6) ---
            case 'listSessions': {
              later(40, () => send({ type: 'sessionList', sessions: storedSessions, archivedIds }))
              break
            }
            case 'setSessionArchived': {
              if (message.isArchived) {
                archivedIds.push(message.sessionId)
              } else {
                archivedIds.splice(archivedIds.indexOf(message.sessionId), 1)
              }
              send({ type: 'sessionList', sessions: storedSessions, archivedIds })
              break
            }
            case 'resumeSession': {
              const row = storedSessions.find((s) => s.sessionId === message.sessionId)
              later(60, () => {
                send({ type: 'historyLoaded', ...storedHistory(message.sessionId, row) })
                send({ type: 'notice', level: 'info', text: `Resumed ${row?.title ?? ''}` })
                send({
                  type: 'sessionInfo',
                  modelId: 'muse-spark-1.3',
                  contextLimit: 1007997,
                  sessionId: message.sessionId,
                })
              })
              break
            }
            case 'forkSession': {
              later(60, () => {
                send({
                  type: 'historyLoaded',
                  ...storedHistory('forked', undefined, message.lastTurnId),
                })
                send({
                  type: 'notice',
                  level: 'info',
                  text: 'Forked into a new conversation. Fix the parser',
                })
                send({
                  type: 'sessionInfo',
                  modelId: 'muse-spark-1.3',
                  contextLimit: 1007997,
                  sessionId: 'forked',
                })
              })
              break
            }
            case 'renameSession': {
              later(40, () =>
                send({ type: 'agentEvent', event: { type: 'sessionNamed', name: message.name } }),
              )
              break
            }
            // --- Voice dictation (M9): the harness "listens" for a moment, then
            // hands back a phrase, as the Windows helper would.
            case 'dictation': {
              if (message.action === 'start') {
                send({ type: 'dictationState', status: 'starting' })
                later(40, () => send({ type: 'dictationState', status: 'listening' }))
                break
              }
              send({ type: 'dictationState', status: 'idle' })
              later(40, () => send({ type: 'insertText', text: 'open the settings file ' }))
              break
            }
            // --- Account & usage (M8) ---
            case 'readUsage': {
              later(40, () =>
                send(
                  window.harnessBackend === 'modelApi'
                    ? {
                        type: 'usageReport',
                        backend: 'modelApi',
                        account: { signInMethod: 'apiKey' },
                      }
                    : {
                        type: 'usageReport',
                        backend: 'museCode',
                        account: {
                          signInMethod: 'cli',
                          cliVersion: '1.3.0',
                          delegationMode: 'off',
                        },
                        subscription: {
                          observedAtMs: Date.now() - 4 * 60 * 1000,
                          tier: 'muse-pro',
                          window: {
                            usedPercent: 42,
                            resetsAtMs: Date.now() + (2 * 60 + 5) * 60 * 1000,
                            windowDurationMins: 300,
                          },
                          weekly: {
                            usedPercent: 17,
                            resetsAtMs: Date.now() + 3 * 24 * 60 * 60 * 1000,
                          },
                        },
                        insights: {
                          day: {
                            attempts: 186,
                            sessions: 6,
                            reminderAttempts: 150,
                            subagentAttempts: 24,
                            longSessionAttempts: 0,
                          },
                          week: {
                            attempts: 1821,
                            sessions: 41,
                            reminderAttempts: 1462,
                            subagentAttempts: 96,
                            longSessionAttempts: 210,
                          },
                        },
                      },
                ),
              )
              break
            }
            case 'answerQuestion': {
              later(30, () =>
                send({
                  type: 'agentEvent',
                  event: {
                    type: 'questionSettled',
                    userInputId: message.userInputId,
                    outcome: 'answered',
                    answers: message.answers,
                  },
                }),
              )
              break
            }
            default: {
              break
            }
          }
        },
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="../../dist/webview/main.js"></script>
    <script>
      // Scripting errors and dropped host messages are written into the page
      // so a screenshot shows them instead of a silent empty state.
      const report = (text) => {
        const line = document.createElement('pre')
        line.className = 'harness-report'
        line.textContent = text
        document.body.prepend(line)
      }
      window.addEventListener('error', (event) => {
        report(`harness error: ${event.message} (${event.filename}:${String(event.lineno)})`)
      })
      const originalWarn = console.warn.bind(console)
      console.warn = (...args) => {
        report(`warn: ${args.map(String).join(' ')}`)
        originalWarn(...args)
      }
      // `?scenario=<name>` drives the UI without a human, for headless shots.
      const scenario = new URLSearchParams(location.search).get('scenario')
      const textarea = () => document.querySelector('textarea')
      const setValue = (element, prototype, text) => {
        const setter = Object.getOwnPropertyDescriptor(prototype, 'value').set
        setter.call(element, text)
        element.dispatchEvent(new Event('input', { bubbles: true }))
      }
      const setDraft = (text) => {
        const element = textarea()
        setValue(element, HTMLTextAreaElement.prototype, text)
        element.setSelectionRange(text.length, text.length)
        element.dispatchEvent(new KeyboardEvent('keyup', { key: 'a', bubbles: true }))
      }
      const key = (init) =>
        textarea().dispatchEvent(
          new KeyboardEvent('keydown', { bubbles: true, cancelable: true, ...init }),
        )
      const click = (label) => document.querySelector(`button[aria-label="${label}"]`).click()
      const event = (payload) => send({ type: 'agentEvent', event: payload })
      // About 10k tokens of markdown: prose plus a fenced block, repeated.
      const longReply = () =>
        [
          'The reducer folds `item/delta` events into the open entry, so **streaming** text costs one array copy per delta; a 10k-token reply is about 40k characters.',
          '',
          '```ts',
          'export function fold(state: State, delta: string): State {',
          '  return { ...state, text: state.text + delta }',
          '}',
          '```',
          '',
          '',
        ]
          .join('\n')
          .repeat(120)
      // A run shaped like the live capture of 2026-09-21: user card, reasoning,
      // Read, Edit (with patch), Write, PowerShell, then the reply. The shell
      // row stays in progress when `isShellPending` so a card can attach.
      const transcriptFixture = ({ isShellPending = false, isDone = false } = {}) => {
        window.harnessSilent = true
        setDraft('Edit notes.md, then list the folder')
        key({ key: 'Enter' })
        event({
          type: 'itemStarted',
          item: { itemId: 'r1', kind: 'reasoning', status: 'inProgress' },
        })
        event({
          type: 'textDelta',
          itemId: 'r1',
          field: 'summary.0',
          delta: 'Need to read the file first, then apply the edit.',
        })
        event({
          type: 'itemCompleted',
          item: {
            itemId: 'r1',
            kind: 'reasoning',
            status: 'completed',
            summary: ['Need to read the file first, then apply the edit.'],
          },
        })
        event({
          type: 'itemCompleted',
          item: {
            itemId: 'rd1',
            kind: 'toolCall',
            status: 'completed',
            tool: 'read_file',
            args: '{"path":"notes.md"}',
            visibleOutput: 'Read text file `notes.md`.\n1|# Notes\n2|\n3|first line',
          },
        })
        event({
          type: 'itemStarted',
          item: {
            itemId: 'ed1',
            kind: 'toolCall',
            status: 'inProgress',
            tool: 'edit_file',
            args: '{"find":"first line","path":"notes.md","replace":"second line\\nthird line"}',
          },
        })
        event({
          type: 'itemCompleted',
          item: {
            itemId: 'ed1',
            kind: 'toolCall',
            status: 'completed',
            tool: 'edit_file',
            args: '{"find":"first line","path":"notes.md","replace":"second line\\nthird line"}',
            visibleOutput:
              'edited\nchanged lines: line 3\n--- original\n+++ updated\n@@\n-first line\n+second line\n+third line\n',
            patchSummary: { files: 1, added: 2, removed: 1 },
            patchRef: { id: 'tool_patch-ed1', byteLen: 318 },
          },
        })
        event({
          type: 'itemCompleted',
          item: {
            itemId: 'wr1',
            kind: 'toolCall',
            status: 'completed',
            tool: 'write_file',
            args: '{"content":"hi\\n","path":"hello.txt"}',
            visibleOutput: 'wrote 3 bytes to hello.txt',
            patchSummary: { files: 1, added: 1, removed: 0 },
          },
        })
        event({
          type: 'itemStarted',
          item: {
            itemId: 'sh1',
            kind: 'toolCall',

      const writeAxeResult = (value) => {
        const result = document.createElement('pre')
        result.id = 'axe-result'
        result.hidden = true
        result.textContent = JSON.stringify(value)
        document.body.append(result)
      }
      const loadAxe = () =>
        new Promise((resolve, reject) => {
          const script = document.createElement('script')
          script.src = '../../node_modules/axe-core/axe.min.js'
          script.addEventListener('load', resolve)
          script.addEventListener('error', () => {
            reject(new Error('axe-core did not load'))
          })
          document.head.append(script)
        })
      // WCAG 2.5.8 "does not apply to targets while they are obscured by
      // content displayed as a result of a user interaction" (W3C,
      // Understanding 2.5.8), such as a menu the user opened. axe measures
      // the covered area anyway, so a target-size finding whose crowding or
      // covering elements all belong to an open menu or dialog is counted
      // as exempt and reported, not dropped silently.
      const OPENED_CONTENT = '.popover, [role="menu"], [role="dialog"]'
      const isInsideOpenedContent = (related) =>
        document.querySelector(related.target.join(' '))?.closest(OPENED_CONTENT) != null
      const isObscuredByOpenedContent = (node) => {
        const related = [...node.any, ...node.all, ...node.none].flatMap(
          (check) => check.relatedNodes,
        )
        return related.length > 0 && related.every(isInsideOpenedContent)
      }
      const runAxe = async () => {
        await loadAxe()
        const results = await window.axe.run(document, {
          runOnly: { type: 'tag', values: AXE_TAGS },
          resultTypes: ['violations'],
        })
        const exempt = []
        const violations = results.violations.flatMap((violation) => {
          const nodes = violation.nodes.filter((node) => {
            if (violation.id === 'target-size' && isObscuredByOpenedContent(node)) {
              exempt.push({ rule: violation.id, target: node.target.join(' ') })
              return false
            }
            return true
          })
          return nodes.length === 0
            ? []
            : [
                {
                  id: violation.id,
                  impact: violation.impact,
                  help: violation.help,
                  nodes: nodes.map((node) => ({
                    target: node.target.join(' '),
                    summary: node.failureSummary,
                  })),
                },
              ]
        })
        return { violations, exempt }
      }
      const themed = params.has('theme') ? applyTheme(params.get('theme')) : Promise.resolve()
      if (params.get('axe') === '1') {
        themed
          .then(
            () =>
              new Promise((resolve) => {
                later(AXE_AFTER_MS, resolve)
              }),
          )
          .then(runAxe)
          .then(
            (result) => {
              writeAxeResult(result)
            },
            (error) => {
              writeAxeResult({ error: String(error) })
            },
          )
      }
    </script>
  </body>
</html>
